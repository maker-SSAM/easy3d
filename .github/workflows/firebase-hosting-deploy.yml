name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - gallery-6-slots-and-multicolor-nameplate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY3D }}'
          channelId: live
          projectId: easy3d-ef224
