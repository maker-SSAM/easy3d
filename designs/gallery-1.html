<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>갤러리1 - 이름표 상자 (Manifold-3D) - 초등 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>
    <!-- core.js가 PMREMGenerator로 굽는 가상의 방 환경(IBL 반사광) — 재질에 은은한 반사를 준다 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>
    <!-- 웹 브라우저에서 TTF 폰트의 벡터 패스를 추출하는 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="../assets/js/core.js"></script>
    <!-- 폰트 → 글자 윤곽선 추출 공용 모듈 -->
    <script src="../assets/js/font-core.js"></script>
    <!-- 글자 윤곽선 → Manifold-3D 솔리드 → three.js 변환 공용 브릿지. ES 모듈이라 로딩이
         비동기다 — 그래서 아래 페이지 로직 스크립트도 type="module"로 만들어서
         ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->
    <script type="module" src="../assets/js/manifold-core.js"></script>
    <style>
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: #333; }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <script type="module">
        // 갤러리1: three.js(렌더링) + Manifold-3D(결합) 확정 스택으로 처음부터 다시 만든
        // 이름표 상자. 상자와 글자를 진짜 하나의 매니폴드 솔리드로 union하고, STL 단일
        // 파일로 내보낸다. 미리보기에서는 부품(상자/글자)별로 다른 색을 보여줄 수 있다
        // (Manifold의 originalID 추적 — manifold-core.js 참고). STL 자체는 색 정보가 없으므로
        // 내보낸 파일은 하나의 결합된 형태(색 없음)가 된다.
        const shell = ParametricCore.mountEditorShell(document.body);

        const FONT_OPTIONS = [
            { label: 'Noto Serif KR', file: 'NotoSerifKR-Black.ttf' },
            { label: 'Noto Sans KR', file: 'NotoSansKR-Black.ttf' },
            { label: 'Paperlogy', file: 'Paperlogy-8ExtraBold.ttf' },
            { label: 'Cafe24 Ohsquare', file: 'Cafe24Ohsquare-v2.0.ttf' },
            { label: 'Cafe24 Ssurround', file: 'Cafe24Ssurround-v2.0.ttf' },
            { label: 'Mona12', file: 'Mona12-Bold.ttf' },
            { label: 'Cafe24 Proup', file: 'Cafe24PROUP.ttf' },
            { label: 'Cafe24 Supermagic', file: 'Cafe24Supermagic-Bold-v1.0.ttf' },
            { label: 'Cafe24 Ssukssuk', file: 'Cafe24SsukssukRegular.ttf' },
            { label: 'Cafe24 Dongdong', file: 'Cafe24DongdongRegular.ttf' }
        ];
        const DEFAULT_FONT_INDEX = FONT_OPTIONS.findIndex(f => f.file === 'Paperlogy-8ExtraBold.ttf');

        // "초기화" 버튼이 되돌릴 기본값 — 아래 controlsBodyEl의 초기 HTML 값과 반드시 일치해야 한다.
        const DEFAULTS = {
            text: '테스트', fontIndex: DEFAULT_FONT_INDEX,
            sizeX: 60, sizeY: 60, sizeZ: 20,
            fontSize: 12, fontThick: 4,
            colBox: '#1e88e5', colText: '#ffca28'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3>이름표 상자 설정</h3>
            <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;">* 상자와 글자를 Manifold-3D로 진짜 하나의 입체로 결합합니다. 완성되면 STL 파일 하나로 내려받을 수 있어요.</p>

            <div class="control-group">
                <label>각인할 글자 입력 (입력 후 Enter 또는 다른 곳 클릭)</label>
                <input type="text" id="inputText" value="테스트" onkeydown="onTextKeydown(event)" onblur="updateModel()">
            </div>

            <div class="control-group">
                <label>글씨체 선택</label>
                <select id="fontSelect" onchange="onFontChange()">
                    ${FONT_OPTIONS.map((f, i) => `<option value="${i}"${i === DEFAULT_FONT_INDEX ? ' selected' : ''}>${f.label}</option>`).join('')}
                </select>
            </div>

            <div class="control-group"><label>상자 가로 (X): <span id="valX">60</span>mm</label><input type="range" id="sizeX" min="40" max="300" value="60" oninput="updateModel()"></div>
            <div class="control-group"><label>상자 세로 (Y): <span id="valY">60</span>mm</label><input type="range" id="sizeY" min="40" max="300" value="60" oninput="updateModel()"></div>
            <div class="control-group"><label>상자 높이 (Z): <span id="valZ">20</span>mm</label><input type="range" id="sizeZ" min="10" max="300" value="20" oninput="updateModel()"></div>

            <div class="control-group"><label>글자 크기: <span id="valFontSize">12</span></label><input type="range" id="fontSize" min="5" max="70" value="12" oninput="updateModel()"></div>
            <div class="control-group"><label>글자 돌출 높이: <span id="valFontThick">4</span>mm</label><input type="range" id="fontThick" min="1" max="15" value="4" oninput="updateModel()"></div>

            <div class="color-row"><span>상자 색</span><input type="color" id="colBox" value="#1e88e5" oninput="updateModel()"></div>
            <div class="color-row"><span>글자 색</span><input type="color" id="colText" value="#ffca28" oninput="updateModel()"></div>
        `;

        // 다운로드 버튼은 footer에 넣어서 컨트롤 패널이 길어져도 화면 하단에 항상 고정으로 보이게 한다.
        shell.controlsFooterEl.innerHTML = `
            <button class="download-btn" onclick="downloadSTL()">파일(STL) 다운로드</button>
        `;

        // Three.js 씬/카메라/렌더러/조명/애니메이션 루프 초기화 (공통 스캐폴드)
        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let currentGroup = null;
        let currentManifolds = []; // 이번 프레임에서 만든 Manifold 객체들 — 다음 갱신 전에 dispose
        let openTypeFont = null;
        let manifoldReady = false;

        function loadFont(file, callback) {
            FontCore.loadFont(file, callback);
        }

        function onFontChange() {
            const idx = document.getElementById('fontSelect').value;
            loadFont(FONT_OPTIONS[idx].file, function (font) {
                openTypeFont = font;
                updateModel();
            });
        }

        // 모든 입력값 + 카메라 시점을 처음 상태로 되돌린다.
        function resetToDefaults() {
            document.getElementById('inputText').value = DEFAULTS.text;
            document.getElementById('fontSelect').value = DEFAULTS.fontIndex;
            document.getElementById('sizeX').value = DEFAULTS.sizeX;
            document.getElementById('sizeY').value = DEFAULTS.sizeY;
            document.getElementById('sizeZ').value = DEFAULTS.sizeZ;
            document.getElementById('fontSize').value = DEFAULTS.fontSize;
            document.getElementById('fontThick').value = DEFAULTS.fontThick;
            document.getElementById('colBox').value = DEFAULTS.colBox;
            document.getElementById('colText').value = DEFAULTS.colText;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            onFontChange(); // 폰트를 다시 로드하면서 위 값들을 반영해 모델도 재생성한다
        }

        // 글자 수가 많아질수록 매번 union을 다시 계산하는 비용이 커져서, 텍스트 입력은
        // 키 하나하나에 반응하지 않고 Enter를 누르거나(onblur) 입력창을 벗어날 때만
        // 모델을 다시 만든다.
        function onTextKeydown(event) {
            if (event.key === 'Enter') updateModel();
        }

        // 텍스트 한 줄 전체의 글자 윤곽선을 (x=0 중심 정렬해서) 뽑아낸다.
        function buildContours(text, font, size) {
            const contours = [];
            let currentX = 0;
            const chars = Array.from(text);
            chars.forEach(ch => {
                const glyph = font.charToGlyph(ch);
                if (!glyph) return;
                const path = glyph.getPath(currentX, 0, size);
                // curveSegments(곡선 하나를 몇 개의 직선으로 근사할지). flatShading을 쓰면
                // 삼각형 하나하나가 평평한 면으로 보이므로, 둥근 획이 매끄러워 보이려면
                // 이 값을 충분히 높여야 한다(48).
                FontCore.extractGlyphContours(path.commands || [], 48).forEach(c => contours.push(c));
                currentX += glyph.advanceWidth / font.unitsPerEm * size;
            });
            if (!contours.length) return contours;
            let minX = Infinity, maxX = -Infinity;
            contours.forEach(pts => pts.forEach(p => { if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0]; }));
            const centerX = (minX + maxX) / 2;
            contours.forEach(pts => pts.forEach(p => { p[0] -= centerX; }));
            return contours;
        }

        function disposeCurrentManifolds() {
            currentManifolds.forEach(m => ManifoldCore.dispose(m));
            currentManifolds = [];
        }

        function disposeCurrentThreeMesh() {
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
        }

        function updateModel() {
            if (!manifoldReady) return;

            const textValue = document.getElementById('inputText').value || '';
            const x = parseFloat(document.getElementById('sizeX').value);
            const y = parseFloat(document.getElementById('sizeY').value);
            const z = parseFloat(document.getElementById('sizeZ').value);
            const fSize = parseFloat(document.getElementById('fontSize').value);
            const fThick = parseFloat(document.getElementById('fontThick').value);
            const boxColor = document.getElementById('colBox').value;
            const textColor = document.getElementById('colText').value;

            document.getElementById('valX').innerText = x;
            document.getElementById('valY').innerText = y;
            document.getElementById('valZ').innerText = z;
            document.getElementById('valFontSize').innerText = fSize;
            document.getElementById('valFontThick').innerText = fThick;

            const hasText = openTypeFont && textValue.trim().length > 0;

            disposeCurrentManifolds();

            const box = ManifoldCore.cuboid(x, z, y); // (가로, 높이, 세로) - Y-up
            currentManifolds.push(box);
            const idToColor = new Map([[box.originalID(), boxColor]]);

            let fused = box;
            if (hasText) {
                const contours = buildContours(textValue, openTypeFont, fSize);
                if (contours.length) {
                    const text = ManifoldCore.extrudeContours(contours, fThick);
                    currentManifolds.push(text);
                    idToColor.set(text.originalID(), textColor);

                    const positioned = ManifoldCore.translateY(text, z);
                    currentManifolds.push(positioned);

                    fused = ManifoldCore.union(box, positioned);
                    currentManifolds.push(fused);
                }
            }

            const threeMesh = ManifoldCore.toThreeMesh(fused, idToColor);
            // 그림자를 완전히 없애기로 함: castShadow=true였을 때는 돌출된 글자가 상자
            // 자신의 윗면에 그림자를 드리웠는데, 이건 바닥 그림자 진하기(floor opacity)와는
            // 별개로 이 메시 자체의 그림자 참여 여부라서 따로 꺼야 사라진다.
            threeMesh.castShadow = false;
            threeMesh.receiveShadow = false;

            disposeCurrentThreeMesh();
            currentGroup = new THREE.Group();
            currentGroup.add(threeMesh);
            scene.add(currentGroup);
        }

        function downloadSTL() {
            if (!currentGroup) return;
            const textValue = document.getElementById('inputText').value || 'model';
            ParametricCore.exportSTL(currentGroup, `${textValue}_nameplate.stl`);
        }

        // 전역에 노출 (컨트롤 패널의 inline onclick/oninput에서 호출하기 위함)
        window.updateModel = updateModel;
        window.onFontChange = onFontChange;
        window.onTextKeydown = onTextKeydown;
        window.downloadSTL = downloadSTL;

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            onFontChange(); // 기본 폰트 로드 후 첫 모델 생성
        }
        main();
    </script>
</body>
</html>
