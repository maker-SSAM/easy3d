<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일에서 실제 기기 폭 기준으로 레이아웃을 잡게 한다(index.html과 동일한 이유). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 다크모드 첫 페인트 전 적용(깜빡임 방지) — assets/js/theme-core.js의 로직과 동일하되,
         외부 파일 로딩을 기다리지 않도록 일부러 인라인으로 중복해뒀다. -->
    <script>(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
    <script>(function(){var l=localStorage.getItem('lang')||'ko';document.documentElement.setAttribute('data-lang',l);})();</script>
    <title data-i18n-en="Gallery 1 - Gem Maker (Manifold-3D) - Elementary Parametric Design Studio">갤러리1 - 보석 만들기 (Manifold-3D) - 초등 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>
    <!-- core.js가 PMREMGenerator로 굽는 가상의 방 환경(IBL 반사광) — 재질에 은은한 반사를 준다 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="../assets/js/theme-core.js"></script>
    <script src="../assets/js/lang-core.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/threemf-core.js"></script>
    <!-- 원뿔대(cylinder) 조합 → Manifold-3D 솔리드 → three.js 변환 공용 브릿지. ES 모듈이라
         로딩이 비동기다 — 그래서 아래 페이지 로직 스크립트도 type="module"로 만들어서
         ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->
    <script type="module" src="../assets/js/manifold-core.js"></script>
    <style>
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: var(--text-color); }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <script type="module">
        // 갤러리1: 보석(gem) 모양 만들기. Code and Make(codeandmake.com)의 오픈소스 OpenSCAD
        // "Gem Generator"(https://codeandmake.com/post/gem-generator, MIT 유사 permissive
        // 라이선스) 설계를 이 프로젝트의 three.js + Manifold-3D 스택으로 포팅했다.
        //
        // 원본은 원뿔(cone)과 평평한 원기둥(cylinder)을 intersection해서 끝이 잘린 원뿔대를
        // 만드는데, 잘리는 높이의 반지름이 항상 원뿔 테이퍼 비율과 정확히 일치해서
        // (반지름(cutoff%) = 원래반지름 * cutoff/100) 그 결과는 그냥 원뿔대(frustum) 그 자체와
        // 같다. 그래서 불리언 intersection 없이 ManifoldCore.cylinder(아랫반지름, 윗반지름, 높이,
        // 면개수)만으로 동일한 모양을 바로 만들 수 있다 — 아래쪽(뾰족한 부분/파빌리온),
        // 가운데 띠(거들), 위쪽(뭉툭한 부분/크라운) 세 조각을 만들어 union으로 하나의 입체로 합친다.
        const shell = ParametricCore.mountEditorShell(document.body, null, {
            sourceUrl: 'https://codeandmake.com/post/gem-generator',
            licenseType: 'BY-SA'
        });

        // "초기화" 버튼이 되돌릴 기본값. 원본 OpenSCAD 디자인의 기본값(Bottom_Height=30,
        // Top_Height=15)에서 Bottom_Height=15, Top_Height=10으로 조정함 — 그 외 값은 원본과 동일
        // (Diameter=30, Sides=6, Bottom_Cutoff_Percent=0, Middle_Height=0, Top_Cutoff_Percent=50).
        const DEFAULTS = {
            diameter: 30, sides: 6,
            bottomHeight: 15, bottomCutoff: 0,
            middleHeight: 0,
            topHeight: 10, topCutoff: 50,
            colGem: '#8e24aa'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3 data-i18n-en="Gem Settings">보석 설정</h3>
            <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 20px;" data-i18n-en="* Adjust the length and proportions of each part to complete your own beautiful gem design.">* 보석을 이루는 부분의 길이와 비율을 조절하여 나만의 멋진 보석 디자인을 완성하세요.</p>

            <div class="control-group"><label><span data-i18n-en="Diameter (widest part)">지름 (가장 넓은 부분)</span>: <span id="valDiameter">30</span>mm</label><input type="range" id="diameter" min="10" max="80" value="30" oninput="updateModel()"></div>
            <div class="control-group"><label><span data-i18n-en="Number of faces">면 개수</span>: <span id="valSides">6</span></label><input type="range" id="sides" min="3" max="12" value="6" oninput="updateModel()"></div>

            <div class="control-group"><label><span data-i18n-en="Bottom height (pointed part)">아래쪽 높이 (뾰족한 부분)</span>: <span id="valBottomHeight">15</span>mm</label><input type="range" id="bottomHeight" min="5" max="60" value="15" oninput="updateModel()"></div>
            <div class="control-group"><label><span data-i18n-en="Bottom cutoff ratio">아래쪽 자르기 비율</span>: <span id="valBottomCutoff">0</span>%</label><input type="range" id="bottomCutoff" min="0" max="100" value="0" oninput="updateModel()"></div>

            <div class="control-group"><label><span data-i18n-en="Middle band height">가운데 띠 높이</span>: <span id="valMiddleHeight">0</span>mm</label><input type="range" id="middleHeight" min="0" max="40" value="0" oninput="updateModel()"></div>

            <div class="control-group"><label><span data-i18n-en="Top height (blunt part)">위쪽 높이 (뭉툭한 부분)</span>: <span id="valTopHeight">10</span>mm</label><input type="range" id="topHeight" min="5" max="40" value="10" oninput="updateModel()"></div>
            <div class="control-group"><label><span data-i18n-en="Top cutoff ratio">위쪽 자르기 비율</span>: <span id="valTopCutoff">50</span>%</label><input type="range" id="topCutoff" min="0" max="100" value="50" oninput="updateModel()"></div>

            <div class="color-row"><span data-i18n-en="Gem color">보석 색</span><input type="color" id="colGem" value="#8e24aa" oninput="updateModel()"></div>
        `;

        // 다운로드 버튼은 footer에 넣어서 컨트롤 패널이 길어져도 화면 하단에 항상 고정으로 보이게 한다.
        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);

        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });
        if (window.LangCore) window.LangCore.applyTranslations(document);

        // Three.js 씬/카메라/렌더러/조명/애니메이션 루프 초기화 (공통 스캐폴드)
        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let currentGroup = null;
        let currentManifolds = []; // 이번 프레임에서 만든 Manifold 객체들 — 다음 갱신 전에 dispose
        let manifoldReady = false;

        // 모든 입력값 + 카메라 시점을 처음 상태로 되돌린다.
        function resetToDefaults() {
            document.getElementById('diameter').value = DEFAULTS.diameter;
            document.getElementById('sides').value = DEFAULTS.sides;
            document.getElementById('bottomHeight').value = DEFAULTS.bottomHeight;
            document.getElementById('bottomCutoff').value = DEFAULTS.bottomCutoff;
            document.getElementById('middleHeight').value = DEFAULTS.middleHeight;
            document.getElementById('topHeight').value = DEFAULTS.topHeight;
            document.getElementById('topCutoff').value = DEFAULTS.topCutoff;
            document.getElementById('colGem').value = DEFAULTS.colGem;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            updateModel();
        }

        function disposeCurrentManifolds() {
            currentManifolds.forEach(m => ManifoldCore.dispose(m));
            currentManifolds = [];
        }

        function disposeCurrentThreeMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
        }

        function updateModel() {
            if (!manifoldReady) return;

            const diameter = parseFloat(document.getElementById('diameter').value);
            const sides = parseInt(document.getElementById('sides').value, 10);
            const bottomHeight = parseFloat(document.getElementById('bottomHeight').value);
            const bottomCutoff = parseFloat(document.getElementById('bottomCutoff').value);
            const middleHeight = parseFloat(document.getElementById('middleHeight').value);
            const topHeight = parseFloat(document.getElementById('topHeight').value);
            const topCutoff = parseFloat(document.getElementById('topCutoff').value);
            const gemColor = document.getElementById('colGem').value;

            document.getElementById('valDiameter').innerText = diameter;
            document.getElementById('valSides').innerText = sides;
            document.getElementById('valBottomHeight').innerText = bottomHeight;
            document.getElementById('valBottomCutoff').innerText = bottomCutoff;
            document.getElementById('valMiddleHeight').innerText = middleHeight;
            document.getElementById('valTopHeight').innerText = topHeight;
            document.getElementById('valTopCutoff').innerText = topCutoff;

            disposeCurrentManifolds();

            // 원본 OpenSCAD 공식 그대로: cutoff%만큼 잘라낸 자리의 반지름은 항상
            // (원래 반지름 * cutoff/100)과 같고, 그 자리까지의 높이는 (원래 높이 * (100-cutoff)/100).
            const radius = diameter / 2;
            const bottomCutHeight = bottomHeight * (100 - bottomCutoff) / 100;
            const bottomTipRadius = radius * (bottomCutoff / 100);
            const topCutHeight = topHeight * (100 - topCutoff) / 100;
            const topTipRadius = radius * (topCutoff / 100);

            const idToColor = new Map();
            const parts = [];
            let cursorY = 0;

            // 아래쪽(파빌리온) — 뾰족한 끝이 아래(y=0), 가장 넓은 부분이 위(거들과 맞닿는 면)
            if (bottomCutHeight > 0.001) {
                const piece = ManifoldCore.cylinder(bottomTipRadius, radius, bottomCutHeight, sides);
                currentManifolds.push(piece);
                idToColor.set(piece.originalID(), gemColor);
                const positioned = ManifoldCore.translateY(piece, cursorY);
                currentManifolds.push(positioned);
                parts.push(positioned);
                cursorY += bottomCutHeight;
            }

            // 가운데 띠(거들) — 위아래 반지름이 같은 곧은 원기둥
            if (middleHeight > 0.001) {
                const piece = ManifoldCore.cylinder(radius, radius, middleHeight, sides);
                currentManifolds.push(piece);
                idToColor.set(piece.originalID(), gemColor);
                const positioned = ManifoldCore.translateY(piece, cursorY);
                currentManifolds.push(positioned);
                parts.push(positioned);
                cursorY += middleHeight;
            }

            // 위쪽(크라운) — 가장 넓은 부분이 아래(거들과 맞닿는 면), 뭉툭한 끝이 위
            if (topCutHeight > 0.001) {
                const piece = ManifoldCore.cylinder(radius, topTipRadius, topCutHeight, sides);
                currentManifolds.push(piece);
                idToColor.set(piece.originalID(), gemColor);
                const positioned = ManifoldCore.translateY(piece, cursorY);
                currentManifolds.push(positioned);
                parts.push(positioned);
                cursorY += topCutHeight;
            }

            disposeCurrentThreeMesh();
            if (!parts.length) return; // 세 조각 모두 자르기 비율/높이가 극단이라 부피가 안 남는 경우

            let fused = parts[0];
            for (let i = 1; i < parts.length; i++) {
                const merged = ManifoldCore.union(fused, parts[i]);
                currentManifolds.push(merged);
                fused = merged;
            }

            // 실제 보석처럼 매끈하게 반짝이도록 이름표 상자보다 낮은 roughness/metalness를 준다.
            // 보석은 다른 갤러리와 달리 면(facet)이 각져 보이는 것 자체가 매력이라, creaseNormals의
            // 매끈한 곡면 처리 대신 flatShading으로 되돌린다 — 인접한 두 면(facet) 사이 각도 차이가
            // 35°(CREASE_ANGLE) 미만이면(면 개수가 많을수록 그럴 가능성이 커짐) 보석인데도 뭉개져
            // 보이는 문제가 생기기 때문.
            const threeMesh = ManifoldCore.toThreeMesh(fused, idToColor, gemColor, { metalness: 0.15, roughness: 0.15, flatShading: true });
            threeMesh.castShadow = false;
            threeMesh.receiveShadow = false;

            currentGroup = new THREE.Group();
            currentGroup.add(threeMesh);
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
        }

        function downloadSTL() {
            if (!currentGroup) return;
            const sides = document.getElementById('sides').value;
            ParametricCore.exportSTL(currentGroup, LangCore.pick(`보석_${sides}면.stl`, `gem_${sides}sides.stl`));
        }

        // STL과 달리 3MF는 색 정보를 담을 수 있으므로, currentGroup(이미 보석 색이 입혀진
        // threeMesh)을 그대로 넘긴다 — 별도로 다시 만들 필요가 없다.
        function download3MF() {
            if (!currentGroup) return;
            const sides = document.getElementById('sides').value;
            ThreeMFCore.export3MF(currentGroup, LangCore.pick(`보석_${sides}면.3mf`, `gem_${sides}sides.3mf`));
        }

        // 전역에 노출 (컨트롤 패널의 inline onclick/oninput에서 호출하기 위함)
        window.updateModel = updateModel;
        window.downloadSTL = downloadSTL;
        window.download3MF = download3MF;
        // 메인화면 카드 미리보기(GLB)를 구울 때 바깥에서 완성된 모델을 꺼내가기 위한 훅.
        // 실제 사용자 기능은 아니고, index.html의 미리보기 파일을 다시 구울 때만 쓴다.
        window.__getPreviewGroup = function () { return currentGroup; };

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            updateModel();
        }
        main();
    </script>
</body>
</html>
