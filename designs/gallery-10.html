<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <!-- 예전 GitHub Pages 주소로 들어온 방문자를 easy3d.web.app으로 넘긴다(다른 갤러리와 같음). -->

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n-en="Gallery 10 - Coloring Plate - Parametric Design Studio for Beginners">갤러리10 - 색칠공부판 - 초보자를 위한 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>

    <style>
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: var(--text-color); }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; }
        .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .check-row label { font-size: 0.95em; }
        .section-label { font-weight: bold; font-size: 0.95em; margin: 18px 0 10px; padding-top: 12px; border-top: 1px solid var(--panel-border); color: var(--text-color); }
        .section-label:first-of-type { margin-top: 8px; padding-top: 0; border-top: none; }
        .align-label { display: block; font-size: 0.9em; color: var(--text-color); margin-bottom: 6px; }
        .align-row { display: flex; gap: 6px; margin-bottom: 14px; }
        .align-row button {
            flex: 1; padding: 6px 0; border: 1px solid var(--input-border); border-radius: 4px;
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.9em;
        }
        .align-row button.active { background: #1e88e5; border-color: #1e88e5; color: #fff; }
        .fmt-hint { font-size: 0.78em; color: var(--text-muted); margin: 0 0 10px; line-height: 1.5; }
        .fmt-hint.warn { color: #e65100; }
        /* 그림 넣기: 원본 | 선화 두 칸. 칸 위에 그림 파일을 끌어다 놓아도 된다. */
        .drop-zone {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            border: 2px dashed var(--input-border); border-radius: 8px; padding: 6px; margin-bottom: 8px;
            background: var(--input-bg);
        }
        .drop-zone.over { border-color: #1e88e5; background: rgba(30,136,229,0.08); }
        .pv-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
        .pv-cell span { font-size: 0.75em; color: var(--text-muted); }
        .pv-cell canvas { width: 100%; height: auto; max-height: 180px; object-fit: contain; background: #fff; border-radius: 4px; border: 1px solid var(--panel-border); }
        .pick-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .pick-row button, .pick-row select {
            flex: 1; padding: 7px 4px; border: 1px solid var(--input-border); border-radius: 4px;
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.88em; min-width: 0;
        }
        .pick-row button.primary { background: #1e88e5; border-color: #1e88e5; color: #fff; }
    </style>
    <script data-goatcounter="https://maker-ssam.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <script type="module">
        // 갤러리10: 색칠공부판 — 그림 파일 → 색칠공부 선화 → 선에 두께를 주어 돌출 → 흰 바닥판 위 검은 선 판.
        // 모두 브라우저 안에서 한다(그림은 어디로도 보내지 않음).
        //
        // 앞부분(그림 → 선)은 순수 JS:
        //   1) 그림을 흰 바탕에 그려 '어두운 정도' 값(V = max(R,G,B))을 읽는다. 밝기(휘도) 대신 V를 쓰는 건
        //      색칠된 면(빨강·노랑·살색)은 V가 높아서 선으로 잡히지 않고, 검은·진한 선만 잡히게 하려고.
        //   2) 선 찾기 = 아주 어두운 곳(V < 기준) + 주변보다 뚜렷이 어두운 곳(적응형 이진화, 연필 선·흐린 스캔용).
        //   3) 작은 점 지우기·작은 구멍 메우기(연결 요소 넓이) → 선이 있는 곳만 잘라서 다시 크게 읽기.
        //   4) '고른 두께': 선을 뼈대(1픽셀, Zhang-Suen 세선화)로 줄인 뒤, 뼈대에서의 거리(EDT)가 반지름 이하인 곳 =
        //      모든 선이 같은 두께. '원래 굵기': 원래 선 모양 ∪ (뼈대 + 가장 얇은 선 두께) → 얇은 곳만 굵어진다.
        //      둘 다 거리 '값'의 0 높이선(마칭 스퀘어, 선형 보간)으로 윤곽선을 뽑아 픽셀 계단 없이 매끈하다.
        // 뒷부분은 갤러리9와 같은 방식: manifold-3d CrossSection → 압출 → 바닥판·테두리와 합치기, 3MF는 색 나누기.
        //
        // 쓰지 않은 것(일부러): Potrace·autotrace(GPL-2.0 — 공개 저장소에 넣을 수 없음),
        // Three.js pointsToStroke(선이 교차하는 곳에서 면이 겹쳐 STL 결함).
        const shell = ParametricCore.mountEditorShell(document.body, null, {});

        // ---------- 예시 그림(이 페이지에서 직접 그린 것) ----------
        const SAMPLES = [
            {
                id: 'cat', ko: '고양이', en: 'Cat',
                svg: `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 400 300"><rect width="400" height="300" fill="#fff"/>
<g fill="none" stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path d="M112 128 L122 52 L168 98 Q200 88 232 98 L278 52 L288 128 Q296 214 200 236 Q104 214 112 128 Z"/>
<path d="M136 86 L130 64 M264 86 L270 64"/>
<ellipse cx="165" cy="148" rx="15" ry="19"/><ellipse cx="235" cy="148" rx="15" ry="19"/>
<path d="M189 176 L211 176 L200 189 Z"/>
<path d="M200 189 Q200 203 184 205 M200 189 Q200 203 216 205"/>
<path d="M150 182 L92 172 M150 194 L94 202 M250 182 L308 172 M250 194 L306 202"/>
<path d="M60 286 Q200 250 340 286"/>
<circle cx="352" cy="52" r="22"/><path d="M352 14 L352 22 M352 82 L352 90 M314 52 L322 52 M382 52 L390 52 M325 25 L331 31 M373 73 L379 79 M379 25 L373 31 M331 73 L325 79"/>
</g>
<circle cx="167" cy="152" r="6" fill="#151515"/><circle cx="237" cy="152" r="6" fill="#151515"/>
</svg>`
            },
            {
                id: 'house', ko: '집과 꽃', en: 'House & flower',
                svg: `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 400 300"><rect width="400" height="300" fill="#fff"/>
<g fill="none" stroke="#151515" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path d="M40 150 L140 70 L240 150"/><rect x="62" y="140" width="156" height="120"/>
<rect x="88" y="168" width="44" height="40"/><path d="M110 168 L110 208 M88 188 L132 188"/>
<path d="M160 260 L160 196 Q180 180 200 196 L200 260"/>
<path d="M200 96 L200 70 L224 70 L224 116"/>
<path d="M10 262 L390 262"/>
<path d="M318 262 L318 168 M318 220 Q290 208 280 186 Q306 186 318 208"/>
<circle cx="318" cy="140" r="16"/>
<circle cx="318" cy="100" r="22"/><circle cx="358" cy="140" r="22"/><circle cx="318" cy="180" r="22"/><circle cx="278" cy="140" r="22"/>
<path d="M30 40 Q50 20 70 40 Q90 20 110 40"/>
</g></svg>`
            }
        ];

        const DEFAULTS = {
            sample: 'cat',
            imgKind: 'line', colorK: 8, bgEdge: true,
            sens: 5, speck: 2,
            lineMode: 'even', keepFill: true, lineW: 1.2, lineH: 1.2,
            plateShape: 'rect', plateSize: 120, gap: 3, frameOn: true, frameW: 2, cornerR: 4,
            baseThick: 2.0,
            colBase: '#ffffff', colLine: '#000000'
        };
        const MIN_LINE_W = 0.8; // mm — 노즐 0.4mm 기준 두 줄. 이보다 얇은 선은 출력이 잘 안 된다.
        const FILL_HALF_MM = 1.5; // mm — 두께가 이것의 두 배(3mm)를 넘는 검은 곳은 '칠한 면'으로 본다(고른 두께 + 칠한 곳 그대로)

        shell.controlsBodyEl.innerHTML = `
            <h3 data-i18n-en="Coloring Plate">색칠공부판</h3>
            <p class="fmt-hint" data-i18n-en="Turn a drawing with clear dark lines into a plate: black raised lines on a white base, ready to color in.">선이 뚜렷한 그림을 넣으면, 흰 바닥판 위에 검은 선이 솟은 색칠공부판을 만들어요.</p>

            <div class="section-label" data-i18n-en="1. Picture">1. 그림</div>
            <div class="pick-row">
                <button type="button" class="primary" id="pickBtn" data-i18n-en="Choose a picture...">그림 고르기...</button>
                <select id="sampleSelect">
                    ${SAMPLES.map(s => `<option value="${s.id}" data-i18n-en="Example: ${s.en}">예시: ${s.ko}</option>`).join('')}
                </select>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <div class="drop-zone" id="dropZone">
                <div class="pv-cell"><canvas id="srcCanvas" width="240" height="180"></canvas><span data-i18n-en="Original">원본</span></div>
                <div class="pv-cell"><canvas id="lineCanvas" width="240" height="180"></canvas><span data-i18n-en="Line art (what gets printed)">선화(출력되는 모양)</span></div>
            </div>
            <p class="fmt-hint" data-i18n-en="You can also drag a picture here or paste it (Ctrl+V). The picture stays in your browser.">그림을 여기로 끌어다 놓거나 붙여넣기(Ctrl+V)해도 돼요. 그림은 내 브라우저 밖으로 나가지 않아요.</p>
            <p class="fmt-hint" id="lineNote"></p>

            <div class="section-label" data-i18n-en="2. Finding lines">2. 선 찾기</div>
            <!-- 그림 종류: 선 있는 그림 = 어두운 선을 찾음, 선 없는 그림 = 색을 몇 가지로 줄여 색이 바뀌는 곳을 선으로 -->
            <div class="align-row" id="imgKindRow">
                <button type="button" data-kind="line" data-i18n-en="Has outlines">선 있는 그림</button>
                <button type="button" data-kind="color" data-i18n-en="No outlines (color edges)">선 없는 그림</button>
                <button type="button" data-kind="ai" data-i18n-en="AI line art">AI 선화</button>
            </div>
            <p class="fmt-hint" id="aiInfo" data-i18n-en="For 3D game captures and photos. The first time you choose it, the AI model (about 30 MB) is downloaded once. The picture is processed only inside your browser.">3D 게임 캡쳐·사진에 좋아요. 처음 고를 때 AI 모델(약 30MB)을 한 번 내려받아요. 그림은 내 브라우저 안에서만 처리돼요.</p>
            <p class="fmt-hint" id="aiNote"></p>
            <div id="colorKRow" class="control-group"><label><span data-i18n-en="Number of colors (detail)">색 개수(자세함)</span>: <span id="valColorK">8</span></label><input type="range" id="colorK" min="2" max="16" step="1" value="8" oninput="scheduleUpdate('mask')"></div>
            <div id="bgEdgeRow" class="check-row"><input type="checkbox" id="bgEdge" checked onchange="scheduleUpdate('mask')"><label for="bgEdge" data-i18n-en="Colors touching the picture edge are background">그림 가장자리에 닿은 색은 배경으로</label></div>
            <div id="sensRow" class="control-group"><label><span data-i18n-en="Line sensitivity">선 감도</span>: <span id="valSens">5</span></label><input type="range" id="sens" min="1" max="10" step="1" value="5" oninput="scheduleUpdate('mask')"></div>
            <div class="control-group"><label><span data-i18n-en="Remove small dots">작은 점 지우기</span>: <span id="valSpeck">2</span></label><input type="range" id="speck" min="0" max="5" step="1" value="2" oninput="scheduleUpdate('mask')"></div>

            <div class="section-label" data-i18n-en="3. Lines">3. 선</div>
            <div class="align-row" id="lineModeRow">
                <button type="button" data-mode="even" data-i18n-en="Even width">고른 두께</button>
                <button type="button" data-mode="keep" data-i18n-en="Keep original">원래 굵기</button>
            </div>
            <!-- 고른 두께일 때만: 눈동자처럼 칠한 곳(두께 3mm 넘는 곳)은 선으로 줄이지 않고 면으로 둔다 -->
            <div class="check-row" id="keepFillRow"><input type="checkbox" id="keepFill" checked onchange="scheduleUpdate('field')"><label for="keepFill" data-i18n-en="Keep filled black areas (e.g. pupils)">검게 칠한 곳은 그대로(눈동자 등)</label></div>
            <div class="control-group"><label><span id="lineWLabel">선 두께</span>: <span id="valLineW">1.2</span>mm</label><input type="range" id="lineW" min="${MIN_LINE_W}" max="3" step="0.1" value="1.2" oninput="scheduleUpdate('field')"></div>
            <div class="control-group"><label><span data-i18n-en="Line height">선 높이</span>: <span id="valLineH">1.2</span>mm</label><input type="range" id="lineH" min="0.4" max="4" step="0.2" value="1.2" oninput="scheduleUpdate('mesh')"></div>
            <div class="color-row"><span data-i18n-en="Line color">선 색</span><input type="color" id="colLine" value="#000000" oninput="scheduleUpdate('color')"></div>

            <div class="section-label" data-i18n-en="4. Plate">4. 판</div>
            <span class="align-label" data-i18n-en="Plate shape">판 모양</span>
            <div class="align-row" id="plateShapeRow">
                <button type="button" data-shape="rect" data-i18n-en="Rectangle">사각형</button>
                <button type="button" data-shape="outline" data-i18n-en="Follow picture">그림 따라</button>
            </div>
            <div class="control-group"><label><span data-i18n-en="Plate size (long side)">판 크기(긴 쪽)</span>: <span id="valPlateSize">120</span>mm</label><input type="range" id="plateSize" min="50" max="200" step="5" value="120" oninput="scheduleUpdate('field')"></div>
            <div class="control-group"><label><span data-i18n-en="Margin around the picture">그림 둘레 여백</span>: <span id="valGap">3</span>mm</label><input type="range" id="gap" min="0" max="15" step="0.5" value="3" oninput="scheduleUpdate('field')"></div>
            <div class="check-row"><input type="checkbox" id="frameOn" checked onchange="scheduleUpdate('field')"><label for="frameOn" data-i18n-en="Frame (closes cells at the edge)">테두리(가장자리 칸을 닫아 줘요)</label></div>
            <div class="control-group"><label><span data-i18n-en="Frame width">테두리 두께</span>: <span id="valFrameW">2</span>mm</label><input type="range" id="frameW" min="${MIN_LINE_W}" max="6" step="0.1" value="2" oninput="scheduleUpdate('field')"></div>
            <div class="control-group" id="cornerRow"><label><span data-i18n-en="Corner radius">모서리 둥글기</span>: <span id="valCornerR">4</span>mm</label><input type="range" id="cornerR" min="0" max="20" step="0.5" value="4" oninput="scheduleUpdate('field')"></div>
            <div class="control-group"><label><span data-i18n-en="Base thickness">바닥판 두께</span>: <span id="valBaseThick">2.0</span>mm</label><input type="range" id="baseThick" min="1" max="5" step="0.2" value="2.0" oninput="scheduleUpdate('mesh')"></div>
            <div class="color-row"><span data-i18n-en="Base color">바닥판 색</span><input type="color" id="colBase" value="#ffffff" oninput="scheduleUpdate('color')"></div>
            <p class="fmt-hint" id="plateNote"></p>
        `;

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);
        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });
        if (window.LangCore) window.LangCore.applyTranslations(document);

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.TOP
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;
        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);

        // ================= 그림 받기 =================
        let srcImage = null;     // HTMLImageElement (원본)
        let srcName = '';        // 받은 파일 이름(받는 파일 이름에 씀)
        let currentLineMode = DEFAULTS.lineMode;
        let currentPlateShape = DEFAULTS.plateShape;
        let currentImgKind = DEFAULTS.imgKind;

        function loadImageFromURL(url, name) {
            return new Promise(function (resolve, reject) {
                const img = new Image();
                img.onload = function () { resolve(img); };
                img.onerror = reject;
                img.src = url;
            }).then(function (img) {
                srcImage = img;
                srcName = name || '';
                drawSourcePreview();
                scheduleUpdate('image', 0);
            });
        }
        function loadSample(id) {
            const s = SAMPLES.find(function (x) { return x.id === id; }) || SAMPLES[0];
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.svg);
            return loadImageFromURL(url, '');
        }
        function loadImageFile(file) {
            if (!file || !/^image\//.test(file.type)) {
                alert(LangCore.pick('그림 파일(PNG·JPG 등)을 넣어 주세요.', 'Please choose a picture file (PNG, JPG, ...).'));
                return;
            }
            const url = URL.createObjectURL(file);
            loadImageFromURL(url, file.name.replace(/\.[^.]+$/, '')).catch(function () {
                alert(LangCore.pick('그림을 열 수 없어요. 다른 파일로 해 보세요.', 'Could not open the picture. Please try another file.'));
            }).finally(function () { setTimeout(function () { URL.revokeObjectURL(url); }, 1000); });
        }

        const fileInput = document.getElementById('fileInput');
        document.getElementById('pickBtn').addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () {
            const f = fileInput.files[0];
            fileInput.value = '';
            if (f) loadImageFile(f);
        });
        document.getElementById('sampleSelect').addEventListener('change', function (e) { loadSample(e.target.value); });
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(function (t) {
            dropZone.addEventListener(t, function (e) { e.preventDefault(); dropZone.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
            dropZone.addEventListener(t, function (e) { e.preventDefault(); dropZone.classList.remove('over'); });
        });
        dropZone.addEventListener('drop', function (e) {
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) loadImageFile(f);
        });
        document.addEventListener('paste', function (e) {
            const items = (e.clipboardData && e.clipboardData.items) || [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
                    e.preventDefault();
                    loadImageFile(items[i].getAsFile());
                    return;
                }
            }
        });

        document.querySelectorAll('#lineModeRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentLineMode = b.dataset.mode; syncLineMode(); scheduleUpdate('field'); });
        });
        document.querySelectorAll('#plateShapeRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentPlateShape = b.dataset.shape; syncPlateShape(); scheduleUpdate('field'); });
        });
        document.querySelectorAll('#imgKindRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentImgKind = b.dataset.kind; syncImgKind(); scheduleUpdate('mask'); });

            // 얇은 검은 선(테두리가 있는 그림)도 더한다. 두꺼운 검은 면(머리카락·그림자)은 넣지 않는다 — 그 둘레는 이미 색 경계로 잡힘.
            const dark = new Uint8Array(n);
            for (let i = 0; i < n; i++) dark[i] = r.V[i] < 80 ? 1 : 0;
            const inv = new Uint8Array(n);
            for (let i = 0; i < n; i++) inv[i] = dark[i] ? 0 : 1;
            // 반두께가 긴 쪽의 1/70(720px이면 10px, 판 120mm에서 선 두께 약 3mm)보다 두꺼운 곳만 '면'으로 본다
            const T = Math.max(4, Math.round(Math.max(W, H) / 70));
            const dIn2 = edt(inv, W, H);
            const core = new Uint8Array(n);
            let anyCore = false;
            for (let i = 0; i < n; i++) if (dark[i] && dIn2[i] > T * T) { core[i] = 1; anyCore = true; }
            const dCore2 = anyCore ? edt(core, W, H) : null;
            for (let i = 0; i < n; i++) {
                if (!dark[i]) continue;
                if (dCore2 && dCore2[i] <= (T + 1) * (T + 1)) continue; // 두꺼운 검은 면의 일부
                mask[i] = 1;
            }
            return mask;
        }

        // ---------- AI 선화 ----------
        // 모델: informative-drawings(Caroline Chan, Phillip Isola, Fredo Durand, CVPR 2022 「Learning to generate line drawings
        // that convey geometry and semantics」, 코드 MIT — github.com/carolineec/informative-drawings)의 선화(anime_style) 모델을
        // ONNX로 바꾼 것(huggingface.co/rocca/informative-drawings-line-art-onnx, 17.2MB). 실행기는 onnxruntime-web(MIT).
        // 주의(2026-11-25 조사): 학습된 가중치의 라이선스는 원 저장소 README에 적혀 있지 않다 → 그래서 파일을 이 사이트에 올리지 않고
        // 'AI 선화'를 고를 때만 위 주소에서 불러온다(공개 배포 전에 원작자 확인을 받을 것, HANDOFF 참고).
        // 입력: [1,3,H,W] RGB 0~1, 출력: [1,1,H,W] 회색 0~1(흰 바탕에 어두운 선). H·W는 8의 배수로 맞춘다.
        const AI_ORT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js';
        const AI_MODEL_URL = 'https://huggingface.co/rocca/informative-drawings-line-art-onnx/resolve/main/model.onnx';
        const AI_LONG = 512; // AI에 넣는 그림의 긴 쪽(이 맥에서 한 장 약 2.5초, 768이면 약 5.7초)
        let aiSessionPromise = null;
        let aiResult = null;  // { img: 원본 그림, canvas: AI가 그린 회색 선 그림, ms }
        let aiBusy = null;    // 지금 AI가 그리고 있는 원본 그림
        function setAiNote(msg, warn) {
            const el = document.getElementById('aiNote');
            el.textContent = msg || '';
            el.classList.toggle('warn', !!warn);
        }
        function loadScript(src) {
            return new Promise(function (resolve, reject) {
                const sc = document.createElement('script');
                sc.src = src; sc.onload = resolve; sc.onerror = function () { reject(new Error('script ' + src)); };
                document.head.appendChild(sc);
            });
        }
        function getAiSession() {
            if (!aiSessionPromise) {
                aiSessionPromise = (window.ort ? Promise.resolve() : loadScript(AI_ORT_URL)).then(function () {
                    // 여러 줄 실행은 교차 출처 격리(COOP/COEP)가 있을 때만 된다 — 이 사이트엔 없어 보통 한 줄
                    ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
                    return ort.InferenceSession.create(AI_MODEL_URL, { executionProviders: ['wasm'] });
                });
                aiSessionPromise.catch(function () { aiSessionPromise = null; }); // 실패하면 다음에 다시 시도
            }
            return aiSessionPromise;
        }
        async function runAiOn(session, img) {
            const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
            const k = AI_LONG / Math.max(iw, ih);
            const W = Math.max(8, Math.round(iw * k / 8) * 8), H = Math.max(8, Math.round(ih * k / 8) * 8);
            const c = document.createElement('canvas'); c.width = W; c.height = H;
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, W, H);
            const d = ctx.getImageData(0, 0, W, H).data;
            const n = W * H, arr = new Float32Array(3 * n);
            for (let i = 0; i < n; i++) { arr[i] = d[i * 4] / 255; arr[n + i] = d[i * 4 + 1] / 255; arr[2 * n + i] = d[i * 4 + 2] / 255; }
            const res = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', arr, [1, 3, H, W]) });
            const o = res[session.outputNames[0]];
            const oW = o.dims[3], oH = o.dims[2];
            const out = document.createElement('canvas'); out.width = oW; out.height = oH;
            const octx = out.getContext('2d');
            const id = octx.createImageData(oW, oH);
            for (let i = 0; i < oW * oH; i++) {
                const v = Math.round(Math.max(0, Math.min(1, o.data[i])) * 255);
                id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
            }
            octx.putImageData(id, 0, 0);
            return out;
        }
        // AI 결과가 지금 그림 것이면 true. 아니면 (아직 안 돌고 있으면) 돌리기 시작하고 false — 끝나면 다시 그린다.
        function ensureAi() {
            if (aiResult && aiResult.img === srcImage) return true;
            if (aiBusy === srcImage) return false;
            const img = srcImage;
            aiBusy = img;
            setAiNote(aiSessionPromise ? LangCore.pick('AI가 선을 그리는 중이에요(몇 초 걸려요)…', 'The AI is drawing lines (a few seconds)…')
                : LangCore.pick('AI 모델을 내려받는 중이에요(처음 한 번, 약 30MB)…', 'Downloading the AI model (first time only, about 30 MB)…'));
            (async function () {
                try {
                    const session = await getAiSession();
                    setAiNote(LangCore.pick('AI가 선을 그리는 중이에요(몇 초 걸려요)…', 'The AI is drawing lines (a few seconds)…'));
                    await new Promise(function (r) { setTimeout(r, 30); }); // 안내 글이 먼저 화면에 보이게
                    const t0 = performance.now();
                    const canvas = await runAiOn(session, img);
                    const ms = performance.now() - t0;
                    if (srcImage === img) {
                        aiResult = { img: img, canvas: canvas, ms: ms };
                        setAiNote(LangCore.pick('AI 선화 완료(' + (ms / 1000).toFixed(1) + '초). 선이 끊기면 선 감도를 올려 보세요.',
                            'AI line art done (' + (ms / 1000).toFixed(1) + ' s). If lines break up, raise the line sensitivity.'));
                        scheduleUpdate('mask', 0);
                    }
                } catch (err) {
                    console.error('AI 선화 실패:', err);
                    setAiNote(LangCore.pick('AI 모델을 불러오지 못했어요. 인터넷 연결을 확인하거나 다른 방식을 골라 주세요.',
                        'Could not load the AI model. Check the internet connection or choose another method.'), true);
                } finally {
                    if (aiBusy === img) aiBusy = null;
                    if (srcImage !== img && currentImgKind === 'ai') scheduleUpdate('mask', 0); // 도는 동안 그림이 바뀌었으면 새 그림으로
                }
            })();
            return false;
        }
        // AI가 그린 회색 그림에서 선 = 기준보다 어두운 곳. 선 감도 1~10 → 기준 0.64~0.97(기본 5 → 0.8)
        function aiLineMask(r, sens) {
            const thr = Math.min(0.97, 0.6 + 0.04 * sens) * 255;
            const mask = new Uint8Array(r.W * r.H);
            for (let i = 0; i < mask.length; i++) mask[i] = r.V[i] < thr ? 1 : 0;
            return mask;
        }

        function findMask(r, p) {
            if (p.imgKind === 'color') return colorEdgeMask(r, p.colorK, p.bgEdge, speckArea(Math.max(1, p.speck), r.W, r.H));
            if (p.imgKind === 'ai') return aiLineMask(r, p.sens);
            return lineMask(r, p.sens);
        }
        function computeStageB(p) {
            const speck = p.speck;
            // AI 선화는 AI가 그린 회색 선 그림(캔버스)을 원본 대신 읽는다
            const img = p.imgKind === 'ai' ? aiResult.canvas : srcImage;
            const iw = img.naturalWidth || img.width || 400, ih = img.naturalHeight || img.height || 300;
            // 1차: 그림 전체를 읽어 선이 있는 곳(테두리 상자)을 찾는다
            const r1 = rasterize(img, 0, 0, iw, ih, WORK_LONG);
            const m1 = cleanMask(findMask(r1, p), r1.W, r1.H, speckArea(speck, r1.W, r1.H));
            const bb = maskBBox(m1, r1.W, r1.H);
            if (!bb) return { empty: true };
            // 2차: 그 부분만(둘레 조금 더) 잘라서 다시 크게 읽는다 → 작은 그림도 픽셀이 넉넉하다
            const k1 = iw / r1.W;
            const marg = 0.02 * Math.max(bb.x1 - bb.x0 + 1, bb.y1 - bb.y0 + 1) + 2;
            const sx = Math.max(0, (bb.x0 - marg) * k1), sy = Math.max(0, (bb.y0 - marg) * k1);
            const ex = Math.min(iw, (bb.x1 + 1 + marg) * k1), ey = Math.min(ih, (bb.y1 + 1 + marg) * k1);
            const r2 = rasterize(img, sx, sy, ex - sx, ey - sy, WORK_LONG);
            const m2 = cleanMask(findMask(r2, p), r2.W, r2.H, speckArea(speck, r2.W, r2.H));
            // 둘레 PAD만큼 빈칸을 두른 칸으로 옮긴다
            const GW = r2.W + 2 * PAD, GH = r2.H + 2 * PAD;
            const mask = new Uint8Array(GW * GH);
            let count = 0;
            for (let y = 0; y < r2.H; y++) for (let x = 0; x < r2.W; x++) {
                if (m2[y * r2.W + x]) { mask[(y + PAD) * GW + x + PAD] = 1; count++; }
            }
            if (!count) return { empty: true };
            // 선이 실제로 있는 범위(판 크기·여백을 이 범위에 맞춘다 — 자를 때 둔 2% 둘레는 빼고)
            const tb = maskBBox(mask, GW, GH);
            const skel = thin(mask, GW, GH);
            // 세선화가 작은 점(2×2 등)을 통째로 지우는 일이 있어, 뼈대가 하나도 안 남은 조각은 가장 안쪽 한 점을 남긴다
            const inv = new Uint8Array(GW * GH);
            for (let i = 0; i < inv.length; i++) inv[i] = mask[i] ? 0 : 1;
            const dIn2 = edt(inv, GW, GH); // 선 안쪽 픽셀 → 가장 가까운 바깥까지 거리²
            const comps = labelComponents(mask, GW, GH, 1, true);
            const hasSkel = new Uint8Array(comps.sizes.length);
            const best = new Int32Array(comps.sizes.length).fill(-1);
            for (let i = 0; i < mask.length; i++) {
                const id = comps.label[i];
                if (id < 0) continue;
                if (skel[i]) hasSkel[id] = 1;
                if (best[id] < 0 || dIn2[i] > dIn2[best[id]]) best[id] = i;
            }
            for (let id = 0; id < hasSkel.length; id++) if (!hasSkel[id] && best[id] >= 0) skel[best[id]] = 1;
            // 이 그림의 보통 선 반두께(뼈대 위 '선 안쪽 깊이'의 가운데값) — 칠한 면과 선이 만나는 곳을 가르는 기준
            const depths = [];
            for (let i = 0; i < skel.length; i++) if (skel[i]) depths.push(dIn2[i]);
            depths.sort(function (a, b) { return a - b; });
            const halfMed = depths.length ? Math.sqrt(depths[depths.length >> 1]) : 1;
            const dSkel2 = edt(skel, GW, GH);
            const dSkel = new Float32Array(GW * GH);
            for (let i = 0; i < dSkel.length; i++) dSkel[i] = Math.sqrt(dSkel2[i]);
            return {
                empty: false, GW: GW, GH: GH, W: r2.W, H: r2.H,
                mask: mask, skel: skel, dSkel: dSkel, dIn2: dIn2, sdf: null,
                pieces: comps.sizes.length, halfMed: halfMed,
                bx0: tb.x0, by0: tb.y0, bx1: tb.x1, by1: tb.y1
            };
        }

        // 원래 굵기용: 선 경계까지의 부호 있는 거리(안 +, 밖 −)를 3×3으로 한 번 다듬은 것.
        function ensureSdf(b) {
            if (b.sdf) return b.sdf;
            const GW = b.GW, GH = b.GH;
            const dOut2 = edt(b.mask, GW, GH);
            const raw = new Float32Array(GW * GH);
            for (let i = 0; i < raw.length; i++) raw[i] = b.mask[i] ? Math.sqrt(b.dIn2[i]) - 0.5 : -(Math.sqrt(dOut2[i]) - 0.5);
            const sdf = new Float32Array(GW * GH);
            for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
                let s = 0, n = 0;
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    const xx = x + dx, yy = y + dy;
                    if (xx < 0 || yy < 0 || xx >= GW || yy >= GH) continue;
                    s += raw[yy * GW + xx]; n++;
                }
                sdf[y * GW + x] = s / n;
            }
            b.sdf = sdf;
            return sdf;
        }

        let msStats = null; // 마지막 윤곽선 뽑기의 점검 값(시험용 __info에 보임)
        // 마칭 스퀘어: 값 f > 0인 곳의 경계를 닫힌 윤곽선들로. 픽셀 중심이 정수 좌표.
        // 칸 밖은 −1로 본다(모든 윤곽선이 닫힘). 선분 방향은 '안쪽이 왼쪽'으로 통일해 이어 붙인다.
        function marchingSquares(f, W, H) {
            const OUT = -1;
            const val = function (x, y) { return (x < 0 || y < 0 || x >= W || y >= H) ? OUT : f[y * W + x]; };
            const W2 = W + 2;
            const keyH = function (x, y) { return ((y + 1) * W2 + (x + 1)) * 2; };      // (x,y)-(x+1,y)
            const keyV = function (x, y) { return ((y + 1) * W2 + (x + 1)) * 2 + 1; };  // (x,y)-(x,y+1)
            const pts = new Map();
            function pointH(x, y) {
                const k = keyH(x, y);
                if (!pts.has(k)) { const a = val(x, y), b = val(x + 1, y); pts.set(k, [x + a / (a - b), y]); }
                return k;
            }
            function pointV(x, y) {
                const k = keyV(x, y);
                if (!pts.has(k)) { const a = val(x, y), b = val(x, y + 1); pts.set(k, [x, y + a / (a - b)]); }
                return k;
            }
            const next = new Map();
            // 선분 방향은 좌표 계산이 아니라 '안/밖'만으로 정한다: 칸 둘레를 c0→c1→c2→c3로 돌 때
            // 안→밖으로 바뀌는 변(나가는 변)에서 끝나고, 밖→안으로 바뀌는 변(들어오는 변)에서 시작한다.
            // 이웃 칸은 같은 변을 반대로 돌므로 한쪽의 '나가는 변'은 다른 쪽의 '들어오는 변' → 늘 이어진다.
            // (2026-11-24 고침: 처음엔 기준 모서리와의 외적으로 방향을 정했는데, 값이 경계에 걸린 칸에서 방향이
            //  어긋나 윤곽선이 중간에 끊기고 직선으로 닫혀 큰 삼각형·반쯤 칠한 눈이 생겼다 — 선 두께 1.9mm 보고)
            let conflicts = 0;
            function addSeg(eFrom, eTo, keyOf) {
                const ka = keyOf[eFrom](), kb = keyOf[eTo]();
                if (next.has(ka)) conflicts++;
                next.set(ka, kb);
            }
            for (let y = -1; y < H; y++) {
                for (let x = -1; x < W; x++) {
                    const v0 = val(x, y), v1 = val(x + 1, y), v2 = val(x + 1, y + 1), v3 = val(x, y + 1);
                    const i0 = v0 > 0, i1 = v1 > 0, i2 = v2 > 0, i3 = v3 > 0;
                    const code = (i0 ? 1 : 0) | (i1 ? 2 : 0) | (i2 ? 4 : 0) | (i3 ? 8 : 0);
                    if (code === 0 || code === 15) continue;
                    // 모서리 c0(x,y) c1(x+1,y) c2(x+1,y+1) c3(x,y+1), 변 e0=c0c1 e1=c1c2 e2=c2c3 e3=c3c0
                    const ins = [i0, i1, i2, i3];
                    const isExit = function (e) { return ins[e] && !ins[(e + 1) % 4]; };
                    const edgeKey = [
                        function () { return pointH(x, y); },
                        function () { return pointV(x + 1, y); },
                        function () { return pointH(x, y + 1); },
                        function () { return pointV(x, y); }
                    ];
                    const crossed = [];
                    for (let e = 0; e < 4; e++) if (ins[e] !== ins[(e + 1) % 4]) crossed.push(e);
                    if (crossed.length === 2) {
                        const a = crossed[0], b = crossed[1];
                        if (isExit(a)) addSeg(b, a, edgeKey); else addSeg(a, b, edgeKey);
                    } else {
                        // 안장점: 가운데 값으로 어느 쪽을 이을지 정한다. 잘려 나가는 모서리 k는 변 (k-1, k) 사이.
                        const centerIn = (v0 + v1 + v2 + v3) / 4 > 0;
                        for (let k = 0; k < 4; k++) {
                            if (ins[k] === centerIn) continue; // 가운데와 같은 편 모서리는 잘리지 않음
                            const a = (k + 3) % 4, b = k;
                            if (isExit(a)) addSeg(b, a, edgeKey); else addSeg(a, b, edgeKey);
                        }
                    }
                }
            }
            const loops = [];
            const used = new Set();
            let open = 0;
            next.forEach(function (_, start) {
                if (used.has(start)) return;
                const loop = [];
                let k = start;
                while (k !== undefined && !used.has(k)) {
                    used.add(k);
                    loop.push(pts.get(k));
                    k = next.get(k);
                }
                if (k !== start) open++; // 제자리로 돌아오지 않은 윤곽선(있으면 안 됨 — 시험에서 0인지 본다)
                if (loop.length >= 3) loops.push(loop);
            });
            msStats = { conflicts: conflicts, open: open, loops: loops.length };
            return loops;
        }

        // ================= 판 모양(mm) =================
        function readParams() {
            const num = function (id) { return parseFloat(document.getElementById(id).value); };
            return {
                imgKind: currentImgKind, colorK: num('colorK'), bgEdge: document.getElementById('bgEdge').checked,
                sens: num('sens'), speck: num('speck'),
                lineMode: currentLineMode, keepFill: document.getElementById('keepFill').checked, lineW: Math.max(MIN_LINE_W, num('lineW')), lineH: num('lineH'),
                plateShape: currentPlateShape, plateSize: num('plateSize'), gap: num('gap'), frameOn: document.getElementById('frameOn').checked,
                frameW: Math.max(MIN_LINE_W, num('frameW')), cornerR: num('cornerR'),
                baseThick: num('baseThick'),
                colBase: document.getElementById('colBase').value, colLine: document.getElementById('colLine').value
            };
        }

        // 가운데가 원점인 둥근 사각형 윤곽선(반시계).
        function roundRect(w, h, r) {
            r = Math.max(0, Math.min(r, w / 2 - 0.01, h / 2 - 0.01));
            const x0 = -w / 2, x1 = w / 2, y0 = -h / 2, y1 = h / 2;
            if (r < 0.01) return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
            const pts = [];
            const N = 16;
            [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]].forEach(function (c) {
                for (let i = 0; i <= N; i++) {
                    const a = c[2] + (Math.PI / 2) * (i / N);
                    pts.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]);
                }
            });
            return pts;
        }

        const TIDY_EPS = 0.0001; // mm — 완성된 층의 아주 짧은 변 없애기(갤러리9와 같은 이유: float32에서 점이 합쳐지지 않게)
        const SIMPLIFY_EPS = 0.02; // mm — 윤곽선 점 줄이기(모양 변화 0.02mm 이하)
        const KISS_JOIN_MM = 0.001; // mm — 꼭짓점 하나로만 맞닿은 곳 잇기
        const ISO_NUDGE = 0.000731; // 픽셀 — 거리 값이 정확히 0인 픽셀을 피하려고 높이선을 옮기는 양(모양 변화 0.0001mm 수준)

        // 선 층·바닥판의 2D 단면(CrossSection)을 만든다. track()에 넣은 것은 호출부가 지운다.
        function buildShapes(p, b, track) {
            const inset = p.gap + (p.frameOn ? p.frameW : 0);
            const drawLong = p.plateSize - 2 * inset;
            if (drawLong < 10) return { tooSmall: true };
            const bW = b.bx1 - b.bx0 + 1, bH = b.by1 - b.by0 + 1; // 선이 있는 범위(픽셀)
            const s = drawLong / Math.max(bW, bH); // mm / 픽셀
            const rpx = (p.lineW / 2) / s;
            const GW = b.GW, GH = b.GH;
            const f = new Float32Array(GW * GH);
            if (p.lineMode === 'even') {
                for (let i = 0; i < f.length; i++) f[i] = rpx - b.dSkel[i];
                if (p.keepFill) {
                    // 칠한 곳 = 선 안쪽 깊이가 기준 T 이상인 곳의 '열기'(그 속 점들에서 같은 거리만큼 다시 부풀림)
                    // → 눈동자 같은 면은 원래 모양(모서리만 둥글게)으로 남는다. T는 FILL_HALF_MM, 고른 선 반두께의 1.5배,
                    // 이 그림의 보통 선 반두께의 2.2배 중 큰 값(선끼리 만나는 곳·꺾인 곳은 보통 선의 1.4배쯤이라 면으로 안 잡힘).
                    const T = Math.max(1.5 * rpx, FILL_HALF_MM / s, 2.2 * b.halfMed);
                    const T2 = T * T;
                    const core = new Uint8Array(GW * GH);
                    let any = false;
                    for (let i = 0; i < core.length; i++) if (b.dIn2[i] >= T2) { core[i] = 1; any = true; }
                    if (any) {
                        const dCore2 = edt(core, GW, GH);
                        for (let i = 0; i < f.length; i++) f[i] = Math.max(f[i], T - Math.sqrt(dCore2[i]));
                    }
                }
            } else {
                const sdf = ensureSdf(b);
                for (let i = 0; i < f.length; i++) f[i] = Math.max(rpx - b.dSkel[i], sdf[i]);
            }
            // 높이선을 0에서 아주 조금(ISO_NUDGE 픽셀) 옮긴다. 선 반두께가 픽셀 수로 딱 떨어지면(예: 그림 114mm·선 1.9mm →
            // 6픽셀) 거리 값이 정확히 0인 픽셀이 수백 개 생겨, 윤곽선이 픽셀 모서리에서 서로 맞닿는다(2026-11-24 보고된 경우).
            for (let i = 0; i < f.length; i++) f[i] -= ISO_NUDGE;
            const loops = marchingSquares(f, GW, GH);
            const cx = (b.bx0 + b.bx1) / 2, cy = (b.by0 + b.by1) / 2; // 선 범위의 가운데가 원점
            const contours = loops.map(function (loop) {
                return loop.map(function (q) { return [(q[0] - cx) * s, (cy - q[1]) * s]; });
            });
            const drawW = bW * s, drawH = bH * s;
            const innerW = drawW + 2 * p.gap, innerH = drawH + 2 * p.gap;
            const outerW = innerW + (p.frameOn ? 2 * p.frameW : 0), outerH = innerH + (p.frameOn ? 2 * p.frameW : 0);
            let linesXS = null;
            if (contours.length) {
                const raw = track(ManifoldCore.contoursToXS(contours));
                linesXS = track(raw.simplify(SIMPLIFY_EPS));
                if (linesXS.isEmpty()) linesXS = null;
            }
            let baseXS = null, clipXS = null;
            if (p.plateShape === 'outline' && linesXS) {
                // 그림 따라: 선 모양을 (여백 + 테두리)만큼 부풀리고 속을 메운 것이 바닥판.
                baseXS = outlinePlate(linesXS, p.gap + (p.frameOn ? p.frameW : 0), track);
                // 선이 놓일 수 있는 곳 = 바닥판에서 테두리 두께만큼 안쪽(테두리가 없으면 바닥판 전체 — 선은 늘 여백만큼 안쪽에 있다)
                clipXS = p.frameOn ? track(baseXS.offset(-p.frameW, 'Round', 2, roundSegs(p.frameW))) : baseXS;
            } else {
                baseXS = track(ManifoldCore.contoursToXS([roundRect(outerW, outerH, p.cornerR)]));
                // 선은 테두리 안쪽(테두리가 없으면 바닥판 가장자리에서 0.5mm 안쪽)까지만
                clipXS = p.frameOn
                    ? track(ManifoldCore.contoursToXS([roundRect(innerW, innerH, Math.max(0, p.cornerR - p.frameW))]))
                    : track(baseXS.offset(-0.5, 'Round', 2, 32));
            }
            let blackXS = linesXS ? track(linesXS.intersect(clipXS)) : null;
            if (p.frameOn) {
                const ring = track(baseXS.subtract(clipXS));
                blackXS = blackXS ? track(blackXS.add(ring)) : ring;
            }
            // 꼭짓점 하나로만 맞닿은 곳(점 줄이기·잘라 내기에서 생김 → 모서리 하나를 면 4개가 씀)을 아주 조금 부풀려 잇는다
            // (갤러리9의 KISS_JOIN_MM과 같은 처방).
            if (blackXS && !blackXS.isEmpty()) blackXS = track(blackXS.offset(KISS_JOIN_MM, 'Miter', 2));
            const tidy = function (xs) { return xs && !xs.isEmpty() ? track(xs.simplify(TIDY_EPS)) : null; };
            const out = { baseXS: tidy(baseXS), blackXS: tidy(blackXS), mmPerPx: s };
            // 판의 실제 크기(그림 따라 모양은 가운데가 원점이 아닐 수 있어 bounds로 잰다)
            const bb = out.baseXS ? out.baseXS.bounds() : { min: [-outerW / 2, -outerH / 2], max: [outerW / 2, outerH / 2] };
            out.minX = bb.min[0]; out.minY = bb.min[1]; out.maxX = bb.max[0]; out.maxY = bb.max[1];
            out.outerW = out.maxX - out.minX; out.outerH = out.maxY - out.minY;
            return out;
        }

        // 둥근 부풀리기의 원 조각 수: 조각 길이 약 0.3mm(갤러리9와 같은 생각 — 크게 부풀릴 때만 조각이 많아진다)
        function roundSegs(r) { return Math.max(16, Math.min(256, Math.ceil(2 * Math.PI * Math.abs(r) / 0.3))); }
        function signedArea(poly) {
            let a = 0;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += (poly[j][0] - poly[i][0]) * (poly[j][1] + poly[i][1]);
            return a / 2;
        }
        // 속 메우기: 바깥 윤곽선(넓이 +)만 남긴다. 몇 덩어리인지도 돌려준다.
        function fillHoles(xs, track) {
            const outers = xs.toPolygons().filter(function (poly) { return signedArea(poly) > 0; });
            return { xs: outers.length ? track(ManifoldCore.contoursToXS(outers)) : xs, pieces: outers.length };
        }
        // 그림 따라 바닥판: 선을 pad만큼 부풀려 속을 메운다. 해·땅 선처럼 떨어진 조각이 있어 판이 여러 덩어리가 되면,
        // C만큼 더 부풀렸다가 C만큼 줄여(닫기) 틈을 메우고, C를 키워 가며 한 덩어리가 될 때까지 한다.
        // 그래도 떨어져 있으면(그림 조각이 아주 멀리 있을 때) 전체를 감싸는 볼록 껍질로 한다.
        const OUTLINE_CLOSE_STEPS = [0, 3, 6, 12, 24];
        function outlinePlate(linesXS, pad, track) {
            let res = null;
            for (let i = 0; i < OUTLINE_CLOSE_STEPS.length; i++) {
                const C = OUTLINE_CLOSE_STEPS[i];
                let g = fillHoles(track(linesXS.offset(pad + C, 'Round', 2, roundSegs(pad + C))), track);
                if (C > 0) g = fillHoles(track(g.xs.offset(-C, 'Round', 2, roundSegs(C))), track);
                res = g;
                if (g.pieces <= 1) return g.xs;
            }
            return track(res.xs.hull());
        }

        // ================= 화면 =================
        let manifoldReady = false;
        let currentGroup = null;
        let currentMeshes = {};
        let shapeCache = null;   // { key, shapes, scratch }
        let lastInfo = null;
        let updateTimer = null;
        let pendingLevel = 0;
        const LEVELS = { color: 1, mesh: 2, field: 3, mask: 4, image: 5 };

        function scheduleUpdate(level, delay) {
            pendingLevel = Math.max(pendingLevel, LEVELS[level] || 3);
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(runUpdate, delay === undefined ? 120 : delay);
        }

        function showValues(p) {
            [['valSens', p.sens], ['valSpeck', p.speck], ['valColorK', p.colorK], ['valLineW', p.lineW.toFixed(1)], ['valLineH', p.lineH.toFixed(1)],
             ['valPlateSize', p.plateSize], ['valGap', p.gap], ['valFrameW', p.frameW.toFixed(1)], ['valCornerR', p.cornerR],
             ['valBaseThick', p.baseThick.toFixed(1)]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });
            document.getElementById('frameW').closest('.control-group').style.display = p.frameOn ? '' : 'none';
        }

        function dropShapeCache() {
            if (!shapeCache) return;
            shapeCache.scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); });
            shapeCache = null;
        }

        function runUpdate() {
            updateTimer = null;
            const level = pendingLevel;
            pendingLevel = 0;
            if (!manifoldReady || !srcImage) return;
            const p = readParams();
            showValues(p);
            // AI 선화: 결과가 아직 없으면 AI를 돌리고(끝나면 다시 불림) 지금 화면은 그대로 둔다
            if (p.imgKind === 'ai' && !ensureAi()) { pendingLevel = Math.max(pendingLevel, level); return; }
            const t0 = performance.now();
            if (level >= LEVELS.mask || !stageB) {
                stageB = computeStageB(p);
                dropShapeCache();
            }
            const tB = performance.now();
            if (stageB.empty) {
                dropShapeCache();
                disposeCurrent();
                drawLinePreview(null, p);
                lastInfo = { empty: true };
                updateNotes();
                return;
            }
            const key = [p.lineMode, p.keepFill, p.lineW, p.plateSize, p.gap, p.frameOn, p.frameW, p.cornerR, p.plateShape].join('|');
            if (!shapeCache || shapeCache.key !== key) {
                dropShapeCache();
                const scratch = [];
                const track = function (m) { scratch.push(m); return m; };
                let shapes;
                try { shapes = buildShapes(p, stageB, track); }
                catch (err) { console.error('선 모양 만들기 실패:', err); scratch.forEach(function (m) { m && m.delete && m.delete(); }); return; }
                shapeCache = { key: key, shapes: shapes, scratch: scratch };
                drawLinePreview(shapes, p);
            }
            const tC = performance.now();
            if (shapeCache.shapes.tooSmall) {
                disposeCurrent();
                lastInfo = { tooSmall: true };
                updateNotes();
                return;
            }
            if (level >= LEVELS.mesh || !currentGroup) buildPreview(p, shapeCache.shapes);
            else applyColors(p);
            lastInfo = { shapes: shapeCache.shapes, p: p, ms: { lines: Math.round(tB - t0), shape: Math.round(tC - tB), total: Math.round(performance.now() - t0) } };
            updateNotes();
        }

        function disposeCurrent() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(function (obj) {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
            currentMeshes = {};
        }

        // 미리보기: 바닥판과 선 층을 따로 그린다(빠름). 받기는 하나로 합친다(buildFused).
        function buildPreview(p, shapes) {
            disposeCurrent();
            currentGroup = new THREE.Group();
            const owned = [];
            const own = function (m) { owned.push(m); return m; };
            [
                { name: 'base', xs: shapes.baseXS, h: p.baseThick, y: 0, color: p.colBase },
                { name: 'line', xs: shapes.blackXS, h: p.lineH, y: p.baseThick, color: p.colLine }
            ].forEach(function (def) {
                if (!def.xs) return;
                let solid = own(ManifoldCore.extrudeXS(def.xs, def.h));
                const id = solid.originalID();
                if (def.y) solid = own(ManifoldCore.translateY(solid, def.y));
                const mesh = ManifoldCore.toThreeMesh(solid, new Map([[id, def.color]]), def.color, { roughness: 0.5, metalness: 0.05 });
                mesh.userData.layerName = def.name;
                currentMeshes[def.name] = mesh;
                currentGroup.add(mesh);
            });
            owned.forEach(function (m) { m.delete(); });
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
        }
        function applyColors(p) {
            const set = function (name, color) {
                const mesh = currentMeshes[name];
                if (!mesh) return;
                (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(function (m) { m.color.set(color); });
            };
            set('base', p.colBase);
            set('line', p.colLine);
        }

        // 선화 미리보기: 실제로 출력될 선 층(테두리 포함)을 흰 판 위에 그린다.
        function drawLinePreview(shapes, p) {
            const c = document.getElementById('lineCanvas');
            const ctx = c.getContext('2d');
            if (!shapes || shapes.tooSmall || !shapes.baseXS) {
                fitCanvas(c, 4, 3);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, c.width, c.height);
                return;
            }
            const k = fitCanvas(c, shapes.outerW, shapes.outerH);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, c.width, c.height);
            const tx = function (q) { return [(q[0] - shapes.minX) * k, (shapes.maxY - q[1]) * k]; };
            const fillXS = function (xs, color) {
                if (!xs) return;
                ctx.beginPath();
                xs.toPolygons().forEach(function (poly) {
                    poly.forEach(function (q, i) { const t = tx(q); if (i) ctx.lineTo(t[0], t[1]); else ctx.moveTo(t[0], t[1]); });
                    ctx.closePath();
                });
                ctx.fillStyle = color;
                ctx.fill('evenodd');
            };
            fillXS(shapes.baseXS, '#f4f4f4');
            fillXS(shapes.blackXS, '#111');
        }

        function updateNotes() {
            const lineNote = document.getElementById('lineNote');
            const plateNote = document.getElementById('plateNote');
            lineNote.classList.remove('warn');
            if (!lastInfo) { lineNote.textContent = ''; plateNote.textContent = ''; return; }
            if (lastInfo.empty) {
                lineNote.classList.add('warn');
                lineNote.textContent = LangCore.pick('선을 찾지 못했어요. 선 감도를 올리거나, 검은 선이 뚜렷한 그림을 넣어 보세요.',
                    'No lines found. Raise the line sensitivity, or use a picture with clear dark lines.');
                plateNote.textContent = '';
                return;
            }
            if (lastInfo.tooSmall) {
                lineNote.classList.add('warn');
                lineNote.textContent = LangCore.pick('판이 너무 작아요. 판 크기를 키우거나 여백·테두리를 줄여 주세요.', 'The plate is too small. Make it bigger or reduce the margin/frame.');
                plateNote.textContent = '';
                return;
            }
            const p = lastInfo.p, sh = lastInfo.shapes;
            lineNote.textContent = stageB.pieces > 400
                ? LangCore.pick('선 조각이 아주 많아요(' + stageB.pieces + '개). 사진이나 무늬가 많은 그림이면 선이 지저분할 수 있어요 — 작은 점 지우기를 올려 보세요.',
                    'There are very many line pieces (' + stageB.pieces + '). Photos or busy textures can come out messy — try raising "Remove small dots".')
                : '';
            if (stageB.pieces > 400) lineNote.classList.add('warn');
            plateNote.textContent = LangCore.pick(
                '판 크기 ' + sh.outerW.toFixed(1) + ' × ' + sh.outerH.toFixed(1) + 'mm. 색을 바꿔 가며 출력하려면: 슬라이서에서 ' + p.baseThick.toFixed(1) +
                'mm 높이 층(선이 시작되는 곳)을 인쇄하기 전에 일시정지를 넣고, 멈추면 선 색 필라멘트로 바꾸세요(층 높이 0.2mm 기준). 여러 색 프린터는 3MF로 받으면 색이 나뉘어 있어요.',
                'Plate ' + sh.outerW.toFixed(1) + ' × ' + sh.outerH.toFixed(1) + ' mm. For a single-color printer: in the slicer, add a pause before the layer at ' +
                p.baseThick.toFixed(1) + ' mm (where the lines start) and swap to the line color when it stops (0.2 mm layers). Multi-color printers: the 3MF keeps the two colors apart.');
        }

        // ================= 받기 =================
        function buildFused(p, track) {
            const shapes = shapeCache && !shapeCache.shapes.tooSmall ? shapeCache.shapes : null;
            if (!shapes || !shapes.baseXS) return null;
            const idToColor = new Map();
            const base = track(ManifoldCore.extrudeXS(shapes.baseXS, p.baseThick));
            idToColor.set(base.originalID(), p.colBase);
            let fused = base;
            if (shapes.blackXS) {
                const raw = track(ManifoldCore.extrudeXS(shapes.blackXS, p.lineH));
                idToColor.set(raw.originalID(), p.colLine);
                const lines = track(ManifoldCore.translateY(raw, p.baseThick));
                fused = track(ManifoldCore.union(base, lines));
            }
            return { fused: fused, idToColor: idToColor };
        }
        function exportWith(kind) {
            if (!manifoldReady || updateTimer) { if (updateTimer) { clearTimeout(updateTimer); runUpdate(); } }
            const p = readParams();
            const scratch = [];
            const track = function (m) { scratch.push(m); return m; };
            const cleanup = function () { scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); }); };
            let result;
            try { result = buildFused(p, track); }
            catch (err) { console.error(kind + ' 생성 실패:', err); cleanup(); return; }
            if (!result) { cleanup(); return; }
            const mesh = ManifoldCore.toThreeMesh(result.fused, result.idToColor);
            cleanup();
            const group = new THREE.Group();
            group.add(mesh);
            const base = (srcName || '').replace(/[\\/:*?"<>|]/g, '').slice(0, 20);
            const name = LangCore.pick((base ? base + '_' : '') + '색칠공부판', (base ? base + '_' : '') + 'coloring_plate');
            if (kind === 'STL') ParametricCore.exportSTL(group, name + '.stl');
            else ThreeMFCore.export3MF(group, name + '.3mf');
            mesh.geometry.dispose();
            (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(function (m) { m.dispose(); });
        }
        function downloadSTL() { exportWith('STL'); }
        function download3MF() { exportWith('3MF'); }

        // ================= 초기화 =================
        shell.resetBtn.onclick = function () {
            ['colorK', 'sens', 'speck', 'lineW', 'lineH', 'plateSize', 'gap', 'frameW', 'cornerR', 'baseThick', 'colBase', 'colLine'].forEach(function (id) {
                document.getElementById(id).value = DEFAULTS[id];
                document.getElementById(id).dispatchEvent(new Event('input')); // 슬라이더 숫자 칸(enhanceRangeInputs)도 맞춤
            });
            document.getElementById('frameOn').checked = DEFAULTS.frameOn;
            document.getElementById('keepFill').checked = DEFAULTS.keepFill;
            document.getElementById('bgEdge').checked = DEFAULTS.bgEdge;
            currentImgKind = DEFAULTS.imgKind;
            syncImgKind();
            currentLineMode = DEFAULTS.lineMode;
            syncLineMode();
            currentPlateShape = DEFAULTS.plateShape;
            syncPlateShape();
            document.getElementById('sampleSelect').value = DEFAULTS.sample;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.TOP);
            loadSample(DEFAULTS.sample);
        };

        window.scheduleUpdate = scheduleUpdate;
        window.downloadSTL = downloadSTL;
        window.download3MF = download3MF;
        window.__getPreviewGroup = function () { return currentGroup; };
        // 시험용: 바깥에서 그림을 넣고(데이터 주소), 받을 입체를 꺼내 검사할 때만 쓴다.
        window.__loadImageURL = function (url, name) { return loadImageFromURL(url, name); };
        window.__buildExportMesh = function () {
            if (updateTimer) { clearTimeout(updateTimer); runUpdate(); }
            const scratch = [];
            const r = buildFused(readParams(), function (m) { scratch.push(m); return m; });
            if (!r) return null;
            const mesh = ManifoldCore.toThreeMesh(r.fused, r.idToColor);
            scratch.forEach(function (m) { m.delete(); });
            return mesh;
        };
        window.__info = function () { return lastInfo && { ms: lastInfo.ms, ms2: msStats, pieces: stageB && stageB.pieces, empty: lastInfo.empty, tooSmall: lastInfo.tooSmall }; };

        async function main() {
            syncLineMode();
            syncImgKind();
            syncPlateShape();
            await ManifoldCore.ready;
            manifoldReady = true;
            loadSample(DEFAULTS.sample);
        }
