<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 다크모드 첫 페인트 전 적용(깜빡임 방지) — assets/js/theme-core.js의 로직과 동일하되,
         외부 파일 로딩을 기다리지 않도록 일부러 인라인으로 중복해뒀다. -->
    <script>(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>갤러리3 - 꼬임 연필꽂이 (Manifold-3D) - 초등 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>
    <!-- core.js가 PMREMGenerator로 굽는 가상의 방 환경(IBL 반사광) — 재질에 은은한 반사를 준다 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="../assets/js/theme-core.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/threemf-core.js"></script>
    <!-- 2D 단면 → 꼬임 압출(twist extrude)/볼록 껍질(hull) → Manifold-3D 솔리드 → three.js
         변환 공용 브릿지. ES 모듈이라 로딩이 비동기다 — 그래서 아래 페이지 로직 스크립트도
         type="module"로 만들어서 ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->
    <script type="module" src="../assets/js/manifold-core.js"></script>
    <style>
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: var(--text-color); }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; }
        .section-label { font-weight: bold; font-size: 0.95em; margin: 18px 0 10px; padding-top: 12px; border-top: 1px solid var(--panel-border); color: var(--text-color); }
        .section-label:first-of-type { margin-top: 8px; padding-top: 0; border-top: none; }
    </style>
</head>
<body>

    <script type="module">
        // 갤러리3: 꼬임 연필꽂이. Tony Z. Tonchev의 vase.scad(OpenSCAD, 2018)를 이
        // 프로젝트의 three.js + Manifold-3D 스택으로 포팅했다 — 원본은 꽃병이지만, 아랫지름과
        // 윗지름을 같게 두면(기본값) 옆이 벌어지지 않는 연필꽂이 모양이 된다.
        //
        // 원본 구조는 세 조각을 이어붙인다:
        //   1) 발(foot) — 둥근 원판(z=0~1)과 다각형 원판(z=3~4)의 convex hull. 원형 바닥에서
        //      다각형 몸통으로 매끄럽게 이어지는 짧은 전환부다. Manifold.hull()(=OpenSCAD의
        //      hull())로 그대로 옮겼다.
        //   2) 몸통 — 다각형 단면을 위로 갈수록 커지게(scale) + 비틀면서(twist) 압출한 벽.
        //      OpenSCAD의 linear_extrude(height, twist, scale)이 Manifold의
        //      CrossSection.extrude(height, nDivisions, twistDegrees, scaleTop)와 정확히
        //      대응돼서(ManifoldCore.extrudeTwist), 겉면과 (벽 두께만큼 작은) 속면을 각각
        //      압출한 뒤 빼기(subtract)만 하면 된다. 속 압출 높이를 겉보다 살짝(+0.1) 높게
        //      잡아 위쪽만 뚫리고 바닥은 막힌 채로 남는 것까지 원본 그대로다.
        //   3) 원본에 있던 "윗단 테두리" 블록 — scale(TZT_TR, TZT_BR, 0)으로 Z 배율이 0이라
        //      실제로는 부피가 0인(안 보이는) 조각이었다. 포팅해도 아무 것도 안 보이는
        //      죽은 코드라서 이번 포팅에서는 뺐다.
        //
        // 발/몸통 모두 OpenSCAD 원본과 동일한 Z-up 좌표계에서 만들고, 마지막에
        // ManifoldCore.toYUp()을 한 번만 호출해서 three.js Y-up으로 바꾼다(갤러리4 나사통과
        // 동일한 방침 — raw API 주석 참고).
        const shell = ParametricCore.mountEditorShell(document.body);

        const DEFAULTS = {
            baseDiameter: 80, topDiameter: 80, height: 100,
            crossection: 6, twist: 90, wallThickness: 3,
            col: '#ff5050'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3>꼬임 연필꽂이 설정</h3>
            <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;">* 다각형 단면을 비틀어서 만드는 나만의 연필꽂이입니다. 위쪽이 뚫려있어요.</p>

            <div class="section-label">1. 크기</div>
            <div class="control-group"><label>아랫지름: <span id="valBaseDiameter">80</span>mm</label><input type="range" id="baseDiameter" min="20" max="200" step="1" value="80" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>윗지름: <span id="valTopDiameter">80</span>mm</label><input type="range" id="topDiameter" min="20" max="300" step="1" value="80" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>높이: <span id="valHeight">100</span>mm</label><input type="range" id="height" min="20" max="300" step="1" value="100" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>벽 두께: <span id="valWallThickness">3</span>mm</label><input type="range" id="wallThickness" min="0.8" max="10" step="0.1" value="3" oninput="scheduleUpdate()"></div>

            <div class="section-label">2. 단면 모양</div>
            <div class="control-group">
                <label>단면 모양</label>
                <select id="crossection" onchange="scheduleUpdate()">
                    <option value="3">삼각형 (3면)</option>
                    <option value="4">사각형 (4면)</option>
                    <option value="5">오각형 (5면)</option>
                    <option value="6" selected>육각형 (6면)</option>
                    <option value="7">칠각형 (7면)</option>
                    <option value="8">팔각형 (8면)</option>
                    <option value="9">구각형 (9면)</option>
                    <option value="10">십각형 (10면)</option>
                </select>
            </div>
            <div class="control-group"><label>꼬임 각도: <span id="valTwist">90</span>°</label><input type="range" id="twist" min="0" max="360" step="1" value="90" oninput="scheduleUpdate()"></div>

            <div class="section-label">3. 색상</div>
            <div class="color-row"><span>연필꽂이</span><input type="color" id="col" value="#ff5050" oninput="scheduleUpdate()"></div>
        `;

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);

        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let currentMesh = null;
        let manifoldReady = false;
        let updateTimer = null;

        function scheduleUpdate() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 100);
        }

        function resetToDefaults() {
            document.getElementById('baseDiameter').value = DEFAULTS.baseDiameter;
            document.getElementById('topDiameter').value = DEFAULTS.topDiameter;
            document.getElementById('height').value = DEFAULTS.height;
            document.getElementById('crossection').value = DEFAULTS.crossection;
            document.getElementById('twist').value = DEFAULTS.twist;
            document.getElementById('wallThickness').value = DEFAULTS.wallThickness;
            document.getElementById('col').value = DEFAULTS.col;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            updateModel();
        }

        // ---------- 실제 모델링 ----------
        // 꼬임 압출의 세로 분할 수(nDivisions)는 순수 품질/성능 트레이드오프라 슬라이더로
        // 노출하지 않는다 — 미리보기는 낮게 고정해 속도를 확보하고, 다운로드할 때만
        // 잠깐 인쇄 품질로 다시 계산한다(갤러리6과 동일한 방침).
        const PREVIEW_TWIST_SLICES = 24;
        const EXPORT_TWIST_SLICES = 120;
        const FOOT_ROUND_SEGMENTS = 64; // 발 아랫단의 둥근 원판 — 원본의 $fn=100을 살짝 낮춤

        function buildVaseSolid(p, twistSlices) {
            const toDispose = [];
            function track(m) { toDispose.push(m); return m; }

            const baseRadius = p.baseDiameter / 2; // TZT_BR
            const scaleRatio = p.topDiameter / p.baseDiameter; // TZT_TR
            // extrude()의 scaleTop은 .d.ts상 Vec2|number 둘 다 받는다고 돼 있지만, 실제로
            // 겪은 문제: 숫자 하나만 넘기면 X/Y가 서로 다르게(한쪽은 거의 안 늘어난 채로)
            // 비대칭으로 깨져서 뾰족한 원뿔처럼 나온다 — 반드시 [x,y] 배열로 넘겨야 한다.
            const scaleTop = [scaleRatio, scaleRatio];
            const footPolyRadius = baseRadius * 0.95;

            // 1) 발: 둥근 원판(z=0~1) + 다각형 원판(z=3~4)의 convex hull
            const roundDisk = track(ManifoldCore.rawCylinder(baseRadius * 2, baseRadius * 2, 1, FOOT_ROUND_SEGMENTS));
            const polyDiskRaw = track(ManifoldCore.rawCylinder(footPolyRadius * 2, footPolyRadius * 2, 1, p.crossection));
            const polyDisk = track(ManifoldCore.translate(polyDiskRaw, 0, 0, 3));
            const foot = track(ManifoldCore.hullOf([roundDisk, polyDisk]));

            // 2) 몸통: 다각형 단면을 비틀면서(twist) 위로 갈수록 키우는(scale) 압출 → 속을 파낸다
            const outerXS = track(ManifoldCore.circleXS(footPolyRadius, p.crossection));
            const outerWall = track(ManifoldCore.extrudeTwist(outerXS, p.height, twistSlices, p.twist, scaleTop));
            const innerRadius = Math.max(footPolyRadius - p.wallThickness, 0.5);
            const innerXS = track(ManifoldCore.circleXS(innerRadius, p.crossection));
            // 속 압출을 0.1mm 더 높게 잡아 윗면은 확실히 뚫리고, 바닥(z=0)은 겉/속이 딱
            // 맞닿아 막힌 채로 남는다 — 원본의 "height=TZT_HT+.1" 그대로.
            const innerWall = track(ManifoldCore.extrudeTwist(innerXS, p.height + 0.1, twistSlices, p.twist, scaleTop));
            const hollowBody = track(ManifoldCore.subtract(outerWall, innerWall));
            const body = track(ManifoldCore.translate(hollowBody, 0, 0, 4));

            const combined = ManifoldCore.union(foot, body);
            ManifoldCore.dispose.apply(ManifoldCore, toDispose);
            const yUp = ManifoldCore.toYUp(combined);
            combined.delete();
            return yUp;
        }

        function meshFromSolid(solid, color) {
            if (!solid) return null;
            const buf = ManifoldCore.toBufferGeometry(solid);
            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({
                color: color, metalness: 0.2, roughness: 0.45, envMapIntensity: 0.55
            }));
            mesh.castShadow = false;
            mesh.receiveShadow = false;
            return mesh;
        }

        function disposeCurrentMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentMesh) return;
            scene.remove(currentMesh);
            currentMesh.geometry.dispose();
            currentMesh.material.dispose();
            currentMesh = null;
        }

        function readParams() {
            return {
                baseDiameter: parseFloat(document.getElementById('baseDiameter').value),
                topDiameter: parseFloat(document.getElementById('topDiameter').value),
                height: parseFloat(document.getElementById('height').value),
                crossection: parseInt(document.getElementById('crossection').value, 10),
                twist: parseFloat(document.getElementById('twist').value),
                wallThickness: parseFloat(document.getElementById('wallThickness').value),
                col: document.getElementById('col').value
            };
        }

        function updateModel() {
            if (!manifoldReady) return;
            const p = readParams();

            [
                ['valBaseDiameter', p.baseDiameter], ['valTopDiameter', p.topDiameter], ['valHeight', p.height],
                ['valTwist', p.twist], ['valWallThickness', p.wallThickness]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });

            let solid;
            try {
                solid = buildVaseSolid(p, PREVIEW_TWIST_SLICES);
            } catch (err) {
                console.error('연필꽂이 생성 실패:', err);
                solid = null;
            }

            disposeCurrentMesh();
            if (!solid) return;

            currentMesh = meshFromSolid(solid, p.col);
            solid.delete();
            scene.add(currentMesh);
            ParametricCore.updateDimensionOverlay(scene, currentMesh);
        }

        function downloadSTL() {
            if (!manifoldReady) return;
            const p = readParams();

            let solid;
            try {
                solid = buildVaseSolid(p, EXPORT_TWIST_SLICES);
            } catch (err) {
                console.error('STL 생성 실패:', err);
                return;
            }
            if (!solid) return;

            const buf = ManifoldCore.toBufferGeometry(solid);
            solid.delete();

            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({ color: p.col }));
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            ParametricCore.exportSTL(exportGroup, '꼬임_연필꽂이.stl');

            mesh.geometry.dispose();
            mesh.material.dispose();
        }

        function download3MF() {
            if (!manifoldReady) return;
            const p = readParams();

            let solid;
            try {
                solid = buildVaseSolid(p, EXPORT_TWIST_SLICES);
            } catch (err) {
                console.error('3MF 생성 실패:', err);
                return;
            }
            if (!solid) return;

            const buf = ManifoldCore.toBufferGeometry(solid);
            solid.delete();

            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({ color: p.col }));
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            ThreeMFCore.export3MF(exportGroup, '꼬임_연필꽂이.3mf');

            mesh.geometry.dispose();
            mesh.material.dispose();
        }

        window.scheduleUpdate = scheduleUpdate;
        window.downloadSTL = downloadSTL;
        window.download3MF = download3MF;
        // 메인화면 카드 미리보기(GLB)를 구울 때 바깥에서 완성된 모델을 꺼내가기 위한 훅.
        // 실제 사용자 기능은 아니고, index.html의 미리보기 파일을 다시 구울 때만 쓴다.
        window.__getPreviewGroup = function () { return currentMesh; };

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            updateModel();
        }
        main();
    </script>
</body>
</html>
