<!DOCTYPE html>

    <!-- 모바일에서 실제 기기 폭 기준으로 레이아웃을 잡게 한다(index.html과 동일한 이유). -->

         외부 파일 로딩을 기다리지 않도록 일부러 인라인으로 중복해뒀다. -->

    <title data-i18n-en="Gallery 4 - Screw-Top Container - Parametric Design Studio for Beginners">갤러리4 - 돌려 닫는 보관통 (Manifold-3D) - 초보자를 위한 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>

    <script src="../assets/js/lang-core.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/threemf-core.js"></script>
    <!-- 회전 압출/꼬임 압출 조합 → Manifold-3D 솔리드 → three.js 변환 공용 브릿지. ES 모듈이라
         로딩이 비동기다 — 그래서 아래 페이지 로직 스크립트도 type="module"로 만들어서
         ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->

            async src="//gc.zgo.at/count.js"></script>

<body>

    <script type="module">
        // 갤러리4: 돌려서 여닫는 나사 뚜껑 보관통. DrJones(printables.com/@DrJones,
        // makerworld.com/@DrJones)의 오픈소스 OpenSCAD "Customizable/Parametric cylindric
        // screw container v2"(CC-BY 라이선스) 설계를 이 프로젝트의 three.js + Manifold-3D
        // 스택으로 포팅했다.
        //
        // 원본은 원형/각형 널링(knurl, 손잡이 그립 홈)에 몸체/뚜껑 각각 1·2차 무늬를 독립
        // 설정(각도/방향/깊이/폭/간격/모양 6개 x 2 무늬 x 2부품 = 24개 파라미터)할 수 있게
        // 만들어져 있는데, 초등학생 대상 슬라이더 UI로는 너무 많아서 다음처럼 정리했다:
        //   - 무늬 모양(round/sharp/flat)은 원형(round)으로 고정
        //   - 몸체/뚜껑에 같은 무늬 설정을 적용 (원본처럼 따로 조절 불가)
        //   - 1차(시계방향)/2차(반시계방향)는 각각 켜고 끌 수 있게 노출(둘 다 켜면 원본
        //     기본값처럼 서로 교차하는 다이아몬드 무늬가 됨)
        //   - 최초 로딩 속도를 위해 1차/2차 무늬는 페이지를 처음 열었을 때는 둘 다 꺼진 상태로 시작
        //   - 무늬 각도/간격(%)만 슬라이더로 노출하고, 깊이(%)/폭(%)/적용 범위(%)는 이미 보기 좋은
        //     조합(KNURL_DEPTH_PCT/KNURL_WIDTH_PCT/KNURL_COVERAGE_PCT)으로 고정
        //   - bottomtop(바닥/뚜껑 두께)·tolerance(나사 헐거움)·threadlen(나사산 길이)은
        //     원본 기본값으로 고정(각각 1mm/0.25mm/6mm) — 출력 성공률에 영향을 주는 값이라
        //     잘못 만지면 나사가 안 맞물릴 수 있어서 뺐다
        //
        // 나사산: 처음엔 원본처럼 "편심 원을 꼬며 압출한 뒤 원뿔로 다듬는" 방식(cscrew)으로
        // 만들었는데, 실제 나사산 각도/피치를 정확히 반영하지 못하는 근사법이었다. 이후
        // Philipp Klostermann의 screw_extrude(나선을 따라 정점을 직접 이어붙여 폴리헤드론
        // 하나를 통째로 짓는 방식 — union이 필요 없어 더 가볍고 나사산 각도가 명확함)로
        // 교체해 확정했다. cscrew(d, threadLen, neckHeight)는 여전히 "평범한 원기둥(뿌리,
        // part1/part2/part3 — 목 부분을 몸체/뚜껑에 매끄럽게 잇는 미세한 테이퍼) + 나사산
        // 돌기"를 합친 하나의 솔리드를 돌려주고, 몸체에는 합치고(union) 뚜껑 구멍에는 그대로
        // 파낸다(subtract) — "돌기를 만드는 부분"만 screwExtrude()로 바뀌었다. 나사산 각도/
        // 피치가 몸체와 뚜껑에서 반드시 같아야 서로 맞물리므로, THREAD_PITCH·THREAD_TURNS는
        // 상수로 고정해 양쪽 호출에 동일하게 쓴다.
        //
        // 널링(knurl) 그립 홈은 나사산과 무관한 기능이라 원본 그대로 편심 원 꼬임 압출
        // (extrudeTwist)을 계속 쓴다.
        const shell = ParametricCore.mountEditorShell(document.body, null, {
            sourceUrl: 'https://www.printables.com/model/906507-customizable-screw-container-v2-openscad',
            licenseType: 'BY'
        });

        // ---- 해상도 상수 (원본 $fn=96보다 낮춤) — 미리보기/내보내기 자동 분리(갤러리2/3/5/6/8과
        // 동일한 방침). 나사산/그립 무늬는 꼬임 압출을 여러 번 계산해야 해서 이 갤러리들 중
        // 가장 무겁다 — 예전엔 항상 이 상수들(=원래 export 값)로 계산해서 슬라이더를 움직일
        // 때마다 매번 무거운 계산을 했었다. 지금은 setQuality()가 슬라이더 조작 중엔 'preview'로
        // 낮췄다가, STL 다운로드 직전에만 'export'(=원래 값 그대로, 인쇄 품질 변화 없음)로
        // 바꿔서 다시 계산한다. let으로 선언해서 buildContainer/cscrew/knurlGroove가 클로저로
        // 참조하는 값이 setQuality() 호출 시점마다 바뀌게 한다.
        let BODY_SEGMENTS, THREAD_CIRCLE_SEGMENTS, KNURL_CIRCLE_SEGMENTS, MAX_KNURL_N;
        let THREAD_TWIST_DIVISOR, THREAD_TWIST_MAX_NDIV, KNURL_TWIST_DIVISOR, KNURL_TWIST_MAX_NDIV;

        const QUALITY_PRESETS = {
            preview: {
                bodySegments: 32, threadCircleSegments: 12, knurlCircleSegments: 6, maxKnurlN: 36,
                threadTwistDivisor: 34, threadTwistMaxNDiv: 60, knurlTwistDivisor: 26, knurlTwistMaxNDiv: 70
            },
            // export 값: threadCircleSegments만 48로 올렸다(실제 나사산 원 해상도인
            // threadCircleSegments*2 = 96 — 원본 OpenSCAD의 전역 $fn=96과 동일한 면 수).
            export: {
                bodySegments: 48, threadCircleSegments: 48, knurlCircleSegments: 10, maxKnurlN: 60,
                threadTwistDivisor: 20, threadTwistMaxNDiv: 120, knurlTwistDivisor: 15, knurlTwistMaxNDiv: 150
            }
        };

        function setQuality(mode) {
            const q = QUALITY_PRESETS[mode];
            BODY_SEGMENTS = q.bodySegments;
            THREAD_CIRCLE_SEGMENTS = q.threadCircleSegments;
            KNURL_CIRCLE_SEGMENTS = q.knurlCircleSegments;
            MAX_KNURL_N = q.maxKnurlN;
            THREAD_TWIST_DIVISOR = q.threadTwistDivisor;
            THREAD_TWIST_MAX_NDIV = q.threadTwistMaxNDiv;
            KNURL_TWIST_DIVISOR = q.knurlTwistDivisor;
            KNURL_TWIST_MAX_NDIV = q.knurlTwistMaxNDiv;
        }

        // ---- 원본 기본값 그대로 고정한 값 (슬라이더로 노출하지 않음) ----
        const BOTTOMTOP = 1;      // 바닥/뚜껑 벽 두께
        const TOLERANCE = 0.25;   // 나사 틈새(헐거움 정도)
        const THREADLEN = 6;      // 나사산 길이(돌리는 회전 수를 결정)
        const WALL_MM = 3.7;      // 옆벽 두께 — 그립 홈 최대 깊이(maxdep)가 여기서 갈라지므로, 무늬가
                                  // 흐릿해지지 않도록 이전 기본값(3.7mm)으로 고정하고 조절바를 뺐다.
        // screw_extrude 나사산 전용 상수 — 몸체(합침)와 뚜껑(파냄)이 반드시 같은 피치를 써야
        // 맞물리므로 하나로 고정한다. THREADLEN(=6mm)을 3바퀴로 나눠 피치 2mm.
        const THREAD_TURNS = 3;
        const THREAD_PITCH = THREADLEN / THREAD_TURNS;

        // 그립 깊이/폭/적용 범위는 슬라이더로 조절하기보다 고정값이 나을 만큼 이미 보기 좋은
        // 조합이 나와서 고정하고 조절바를 뺐다. (각도/간격/방향만 계속 조절 가능)
        const KNURL_DEPTH_PCT = 40;
        const KNURL_WIDTH_PCT = 1.5;
        const KNURL_COVERAGE_PCT = 90;

        const DEFAULTS = {
            diameter: 30, height: 50, head: 10, chamfer: 1,
            knurl1On: false, knurl2On: false, angle: 35, distPct: 80,
            colBody: '#00ff88', colLid: '#d400ff'
        };

        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

        shell.controlsBodyEl.innerHTML = `
            <h3 data-i18n-en="Container Settings">보관통 설정</h3>
            <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 20px;" data-i18n-en="* Creates threads that really mesh between the body and the lid. You can twist the lid to open and close it.">* 몸체와 뚜껑에 진짜로 맞물리는 나사산을 만듭니다. 뚜껑을 돌려서 열고 닫을 수 있어요.</p>

            <div class="check-row"><input type="checkbox" id="assembledView" onchange="scheduleUpdate()"><label for="assembledView" data-i18n-en="Show assembled view">조립된 모습 보기</label></div>

            <div class="control-group"><label><span data-i18n-en="Inner diameter">안지름</span>: <span id="valDiameter">30</span>mm</label><input type="range" id="diameter" min="10" max="100" step="1" value="30" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Inner height">안쪽 높이</span>: <span id="valHeight">50</span>mm</label><input type="range" id="height" min="20" max="150" step="1" value="50" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Lid height">뚜껑 높이</span>: <span id="valHead">10</span>mm</label><input type="range" id="head" min="10" max="50" step="1" value="10" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Chamfer">모따기</span>: <span id="valChamfer">1</span>mm</label><input type="range" id="chamfer" min="0" max="3" step="0.2" value="1" oninput="scheduleUpdate()"></div>

            <div class="check-row"><input type="checkbox" id="knurl1On" onchange="scheduleUpdate()"><label for="knurl1On" data-i18n-en="Use primary pattern (clockwise)">1차 무늬 사용 (시계 방향)</label></div>
            <div class="check-row"><input type="checkbox" id="knurl2On" onchange="scheduleUpdate()"><label for="knurl2On" data-i18n-en="Use secondary pattern (counterclockwise)">2차 무늬 사용 (반시계 방향)</label></div>
            <div class="control-group"><label><span data-i18n-en="Grip angle">그립 각도</span>: <span id="valAngle">35</span>°</label><input type="range" id="angle" min="0" max="70" step="1" value="35" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Grip spacing">그립 간격</span>: <span id="valDistPct">80</span>%</label><input type="range" id="distPct" min="0" max="500" step="10" value="80" oninput="scheduleUpdate()"></div>

            <div class="color-row"><span data-i18n-en="Body color">몸체 색</span><input type="color" id="colBody" value="#00ff88" oninput="scheduleUpdate()"></div>
            <div class="color-row"><span data-i18n-en="Lid color">뚜껑 색</span><input type="color" id="colLid" value="#d400ff" oninput="scheduleUpdate()"></div>
        `;

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);

        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });
        if (window.LangCore) window.LangCore.applyTranslations(document);

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let currentGroup = null;
        let currentBodyGeo = null; // STL 내보내기용으로 보관해두는, 위치 이동 전 상태의 지오메트리
        let currentLidGeo = null;
        let currentD = 0;
        let manifoldReady = false;
        let updateTimer = null;

        // 이 디자인은 나사산/널링 홈이 매번 여러 번의 꼬임 압출(twist extrude)을 필요로 해서
        // 이름표 상자/보석보다 계산이 무겁다 — 슬라이더를 드래그하는 동안 매 픽셀마다 다시
        // 계산하면 버벅이므로, 짧은 디바운스를 둬서 손을 뗀 직후에만 다시 만든다.
        function scheduleUpdate() {
            updateLabels();
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 120);
        }

        function updateLabels() {
            document.getElementById('valDiameter').innerText = document.getElementById('diameter').value;
            document.getElementById('valHeight').innerText = document.getElementById('height').value;
            document.getElementById('valHead').innerText = document.getElementById('head').value;
            document.getElementById('valChamfer').innerText = document.getElementById('chamfer').value;
            document.getElementById('valAngle').innerText = document.getElementById('angle').value;
            document.getElementById('valDistPct').innerText = document.getElementById('distPct').value;
        }

        function resetToDefaults() {
            document.getElementById('assembledView').checked = false;
            document.getElementById('diameter').value = DEFAULTS.diameter;
            document.getElementById('height').value = DEFAULTS.height;
            document.getElementById('head').value = DEFAULTS.head;
            document.getElementById('chamfer').value = DEFAULTS.chamfer;
            document.getElementById('knurl1On').checked = DEFAULTS.knurl1On;
            document.getElementById('knurl2On').checked = DEFAULTS.knurl2On;
            document.getElementById('angle').value = DEFAULTS.angle;
            document.getElementById('distPct').value = DEFAULTS.distPct;
            document.getElementById('colBody').value = DEFAULTS.colBody;
            document.getElementById('colLid').value = DEFAULTS.colLid;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            updateLabels();
            updateModel();
        }

        // Philipp Klostermann의 screw_extrude() 포팅. P(다각형 단면, 바깥에서 봤을 때 시계
        // 방향)를 반지름 r에서 시작해 매 360도마다 p mm씩 높아지며 총 d도만큼 나선으로
        // 감아 돌린다. sr/er(도)만큼은 단면이 점으로 오므려지며 시작/끝난다(매끈한
        // 리드인/아웃). 정점/면 배열을 직접 지어 manifold-core.js의 polyhedron()으로
        // 넘긴다 — union이 전혀 필요 없는 통짜 폴리헤드론이라 가볍다.
        function screwExtrude(P, r, p, d, sr, er, fnSteps) {
            const anzPt = P.length;
            const steps = Math.round(d * fnSteps / 360);
            const mmPerDeg = p / 360;
            const deg2rad = Math.PI / 180;

            const VG = [[r, 0, 0]];
            const PG = [];
            for (let i = 0; i < anzPt; i++) {
                PG.push([0, 1 + i, 1 + ((i + 1) % anzPt)]);
            }

            for (let n = 1; n <= steps - 1; n++) {
                const w1 = n * d / steps;
                const h1 = mmPerDeg * w1;
                const c1 = Math.cos(w1 * deg2rad);
                const s1 = Math.sin(w1 * deg2rad);
                let faktor;
                if (w1 < sr) faktor = w1 / sr;
                else if (w1 > (d - er)) faktor = 1 - ((w1 - (d - er)) / er);
                else faktor = 1;
                for (let k = 0; k < anzPt; k++) {
                    const pt = P[k];
                    VG.push([
                        r * c1 + pt[0] * c1 * faktor,
                        r * s1 + pt[0] * s1 * faktor,
                        h1 + pt[1] * faktor
                    ]);
                }
            }

            for (let n = 0; n <= steps - 3; n++) {
                for (let i = 0; i < anzPt; i++) {
                    PG.push([
                        1 + (n * anzPt) + i,
                        1 + (n * anzPt) + anzPt + i,
                        1 + (n * anzPt) + anzPt + (i + 1) % anzPt
                    ]);
                    PG.push([
                        1 + (n * anzPt) + i,
                        1 + (n * anzPt) + anzPt + (i + 1) % anzPt,
                        1 + (n * anzPt) + (i + 1) % anzPt
                    ]);
                }
            }

            const dRad = d * deg2rad;
            VG.push([r * Math.cos(dRad), r * Math.sin(dRad), mmPerDeg * d]);
            const endIdx = VG.length - 1;
            for (let i = 0; i < anzPt; i++) {
                PG.push([
                    endIdx,
                    1 + (steps - 2) * anzPt + (i + 1) % anzPt,
                    1 + (steps - 2) * anzPt + i
                ]);
            }

            return ManifoldCore.polyhedron(VG, PG);
        }

        // ---------- 실제 모델링 ----------
        // OpenSCAD 원본과 동일하게 Z축이 "위"인 좌표계에서 몸체/뚜껑을 각각 조립하고,
        // 마지막에 ManifoldCore.toYUp()으로 딱 한 번씩만 three.js Y-up으로 바꾼다.
        function buildContainer(p, track) {
            const diameter = p.diameter, height = p.height, wall = WALL_MM, chamfer = p.chamfer;
            const D = diameter + 2 * wall;
            const H = height + 2 * BOTTOMTOP;
            // 뚜껑 높이(head)를 몸체 높이(height)와 별개로 넉넉하게 조절할 수 있게 되면서,
            // 뚜껑이 몸체의 나사 목 아래 곧은 벽 구간보다 커지는 조합(예: 안쪽 높이 최소값 +
            // 뚜껑 높이 최대값)이 가능해졌다 — 이 경우 곧은 벽 높이(H-chamfer-head)가 0 이하가
            // 되어 몸체가 통째로 사라진다. 곧은 벽이 최소 5mm는 남도록 뚜껑 높이를 제한한다.
            const head = Math.max(8.5, Math.min(p.head, H - chamfer - 5));
            const maxdep = wall - 0.7 - 1 - TOLERANCE - 0.7;
            const hasChamfer = chamfer > 0.001;

            const DscrewRaw = Math.min(
                D - 2 * (KNURL_DEPTH_PCT / 100) * maxdep - 1.4 - 2 - 2 * TOLERANCE,
                D - wall - 1 - TOLERANCE
            );
            const Dscrew = Math.max(diameter + 1.4, DscrewRaw);

            // 나사산 하나 — 몸체(돌출)/뚜껑(파냄, 살짝 더 큰 지름) 양쪽에서 재사용한다.
            // "뿌리 원기둥(part1/part2/part3, 목 부분을 매끈하게 잇는 미세한 테이퍼)"은 그대로
            // 두고, "돌기를 만드는 부분"만 screwExtrude()로 만든다.
            function cscrew(d, threadLen, neckHeight) {
                const hh = Math.min(threadLen, neckHeight);
                const part1 = track(ManifoldCore.rawCylinder(d, d, neckHeight - 0.25, THREAD_CIRCLE_SEGMENTS * 2));
                const part2raw = track(ManifoldCore.rawCylinder(d, d - 0.5, 0.25, THREAD_CIRCLE_SEGMENTS * 2));
                const part2 = track(part2raw.translate([0, 0, neckHeight - 0.25]));
                const part3 = track(ManifoldCore.rawCylinder(d + 2, d, 1, THREAD_CIRCLE_SEGMENTS * 2));
                let solid = track(ManifoldCore.union(part1, part2));
                solid = track(ManifoldCore.union(solid, part3));

                if (hh > 0.05) {
                    // 나사산 돌기 하나의 단면(삼각형) — 안쪽으로 TOLERANCE만큼, 바깥으로
                    // threadThickness만큼 튀어나온 뾰족한 V자 모양(screw_extrude의 P 인자와
                    // 완전히 동일한 관례).
                    const threadThickness = THREAD_PITCH / 2;
                    const P = [
                        [-TOLERANCE, threadThickness - TOLERANCE],
                        [threadThickness, 0],
                        [-TOLERANCE, -(threadThickness - TOLERANCE)]
                    ];
                    const turns = hh / THREAD_PITCH;
                    const ridge = track(screwExtrude(P, d / 2, THREAD_PITCH, 360 * turns, 0, 45, THREAD_CIRCLE_SEGMENTS * 2));
                    solid = track(ManifoldCore.union(solid, ridge));
                }
                return solid;
            }

            // 널링 그루브 — 1차(시계)/2차(반시계) 무늬를 각각 독립적으로 켜고 끌 수 있다.
            // 둘 다 켜면 서로 반대 방향으로 꼬여 교차하는 다이아몬드 무늬가 된다. 몸체/뚜껑 공용.
            function knurlGroove(R, totalHeight, centerZ, coverage) {
                if (!p.knurl1On && !p.knurl2On) return null;
                const angleRad = p.angle * Math.PI / 180;
                const w = (KNURL_WIDTH_PCT / 100) * D;
                const r = (KNURL_DEPTH_PCT / 100) * maxdep;
                if (r <= 0.01 || w <= 0.01) return null;
                const distFrac = p.distPct / 100;
                const n = clamp(Math.round(2 * Math.PI * R / ((distFrac + 1) * 2 * w) * Math.cos(angleRad)), 3, MAX_KNURL_N);
                const ellipseRY = w / Math.cos(angleRad);

                function buildRing(dirSign) {
                    let ring = null;
                    for (let i = 0; i < n; i++) {
                        const base = track(ManifoldCore.circleXS(1, KNURL_CIRCLE_SEGMENTS));
                        const scaled = track(base.scale([r, ellipseRY]));
                        const moved = track(scaled.translate([R + 0.02, 0]));
                        const rotated = track(moved.rotate(i * 360 / n));
                        ring = ring ? track(ring.add(rotated)) : rotated;
                    }
                    const twistDeg = dirSign * totalHeight * Math.tan(angleRad) / (2 * Math.PI * R) * 360;
                    const nDiv = clamp(Math.round(Math.abs(twistDeg) / KNURL_TWIST_DIVISOR), 6, KNURL_TWIST_MAX_NDIV);
                    return track(ManifoldCore.extrudeTwist(ring, totalHeight, nDiv, twistDeg, [1, 1]));
                }

                let grooves = null;
                if (p.knurl1On) grooves = buildRing(1);
                if (p.knurl2On) {
                    const secondary = buildRing(-1);
                    grooves = grooves ? track(ManifoldCore.union(grooves, secondary)) : secondary;
                }

                if (coverage < 99.5) {
                    const hh = totalHeight * coverage / 100 - 2 * maxdep;
                    if (hh <= 0.5) return null;
                    const maskCyl = track(ManifoldCore.rawCylinder(D * 2, D * 2, hh, 24));
                    const maskPositioned = track(maskCyl.translate([0, 0, centerZ - hh / 2]));
                    grooves = track(ManifoldCore.intersect(grooves, maskPositioned));
                }
                return grooves;
            }

            // ---- 몸체 ----
            let bodyUnion = null;
            if (hasChamfer) {
                const bodyChamfer = track(ManifoldCore.rawCylinder(D - 2 * chamfer, D, chamfer, BODY_SEGMENTS));
                bodyUnion = bodyChamfer;
            }
            const bodyWallRaw = track(ManifoldCore.rawCylinder(D, D, H - chamfer - head, BODY_SEGMENTS));
            const bodyWall = track(bodyWallRaw.translate([0, 0, chamfer]));
            bodyUnion = bodyUnion ? track(ManifoldCore.union(bodyUnion, bodyWall)) : bodyWall;

            const neckHeight = Math.min(THREADLEN + 1.5, head - BOTTOMTOP);
            const bodyThreadRaw = cscrew(Dscrew, THREADLEN, neckHeight);
            const bodyThread = track(bodyThreadRaw.translate([0, 0, H - head]));
            bodyUnion = track(ManifoldCore.union(bodyUnion, bodyThread));

            const bodyHollowRaw = track(ManifoldCore.rawCylinder(diameter, diameter, height + 1, BODY_SEGMENTS));
            const bodyHollow = track(bodyHollowRaw.translate([0, 0, BOTTOMTOP]));
            let bodySolid = track(ManifoldCore.subtract(bodyUnion, bodyHollow));

            const bodyGrooves = knurlGroove(D / 2, H, (H - head + chamfer) / 2, KNURL_COVERAGE_PCT);
            if (bodyGrooves) bodySolid = track(ManifoldCore.subtract(bodySolid, bodyGrooves));

            // ---- 뚜껑 ----
            const lidWall = track(ManifoldCore.rawCylinder(D, D, head - chamfer, BODY_SEGMENTS));
            let lidUnion = lidWall;
            if (hasChamfer) {
                const lidCapRaw = track(ManifoldCore.rawCylinder(D, D - 2 * chamfer, chamfer, BODY_SEGMENTS));
                const lidCap = track(lidCapRaw.translate([0, 0, head - chamfer]));
                lidUnion = track(ManifoldCore.union(lidUnion, lidCap));
            }

            const lidThreadRaw = cscrew(Dscrew + 2 * TOLERANCE, THREADLEN + 0.2, head - BOTTOMTOP);
            const lidThread = track(lidThreadRaw.translate([0, 0, -0.01]));
            let lidSolid = track(ManifoldCore.subtract(lidUnion, lidThread));

            const lidGrooves = knurlGroove(D / 2, head, (head - chamfer) / 2, KNURL_COVERAGE_PCT);
            if (lidGrooves) lidSolid = track(ManifoldCore.subtract(lidSolid, lidGrooves));

            return { bodySolid: bodySolid, lidSolid: lidSolid, D: D, H: H, head: head };
        }

        function disposeCurrentThreeMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (currentGroup) {
                scene.remove(currentGroup);
                currentGroup.traverse(function (obj) {
                    if (obj.material) obj.material.dispose();
                });
                currentGroup = null;
            }
            if (currentBodyGeo) { currentBodyGeo.dispose(); currentBodyGeo = null; }
            if (currentLidGeo) { currentLidGeo.dispose(); currentLidGeo = null; }
        }

        function readParams() {
            return {
                diameter: parseFloat(document.getElementById('diameter').value),
                height: parseFloat(document.getElementById('height').value),
                head: parseFloat(document.getElementById('head').value),
                chamfer: parseFloat(document.getElementById('chamfer').value),
                knurl1On: document.getElementById('knurl1On').checked,
                knurl2On: document.getElementById('knurl2On').checked,
                angle: parseFloat(document.getElementById('angle').value),
                distPct: parseFloat(document.getElementById('distPct').value)
            };
        }

        // buildContainer() 결과(Manifold 솔리드)를 three.js 지오메트리로 바꾼다. 뚜껑 위치는
        // 여기서 정하지 않고(뒤집힌 채로 y=0에 두는 원래 위치 그대로 반환) 호출부가
        // positionLidForPrint()/positionLidForAssembled() 중 하나를 골라 적용한다.
        // updateModel(미리보기)과 downloadSTL(내보내기)이 이 함수를 각자 다른 해상도
        // (setQuality)로 호출해서 공유한다 — 실패하면 예외를 그대로 던지므로 호출부에서
        // 각자 에러 메시지를 남기고 처리한다.
        function buildGeometries(params) {
            const scratch = [];
            function track(m) { scratch.push(m); return m; }

            let result;
            try {
                result = buildContainer(params, track);
            } catch (err) {
                scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); });
                throw err;
            }

            const bodyYUp = ManifoldCore.toYUp(result.bodySolid);
            const lidYUp = ManifoldCore.toYUp(result.lidSolid);

            const bodyBuf = ManifoldCore.toBufferGeometry(bodyYUp);
            const lidBuf = ManifoldCore.toBufferGeometry(lidYUp);

            scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); });
            bodyYUp.delete();
            lidYUp.delete();

            // bodyGeo: 바닥(모따기 없는 쪽)이 y=0에 오는 원래 위치 그대로 둔다.
            // lidGeo: 아직 위치를 정하지 않은 원래 상태(열리는 面=나사산 쪽이 y=0) 그대로 둔다.
            return { bodyGeo: bodyBuf.geo, lidGeo: lidBuf.geo, D: result.D, H: result.H, head: result.head };
        }

        // 출력용 배치: 뚜껑을 뒤집어서(열리는 面이 위로 오게) 몸체 옆 바닥에 놓는다 — 원본의
        // for_printing 레이아웃과 동일하게, 서포트 없이 그대로 출력할 수 있게 하기 위함이다.
        // STL 다운로드는 화면에 "조립된 모습"이 떠 있어도 항상 이 배치로 내보낸다.
        function positionLidForPrint(lidGeo, D) {
            lidGeo.rotateX(Math.PI);
            lidGeo.computeBoundingBox();
            const minY = lidGeo.boundingBox.min.y;
            lidGeo.translate(D + 15, -minY, 0);
        }

        // 조립된 모습: 뚜껑을 뒤집지 않고(열리는 面=나사산 쪽이 아래로 향한 채) 몸체의 나사 목
        // 높이(H-head)까지 그대로 들어올린다 — 몸체 나사 목의 바깥지름과 뚜껑 안쪽 나사산이
        // 같은 지름(Dscrew 계열)으로 만들어지므로, 이 높이만큼만 올리면 실제로 돌려서 씌운
        // 것처럼 뚜껑이 몸체 위쪽을 정확히 감싸는 모습이 된다.
        function positionLidForAssembled(lidGeo, liftY) {
            lidGeo.translate(0, liftY, 0);
        }

        function updateModel() {
            if (!manifoldReady) return;
            const params = readParams();
            const colBody = document.getElementById('colBody').value;
            const colLid = document.getElementById('colLid').value;

            setQuality('preview');
            let g;
            try {
                g = buildGeometries(params);
            } catch (err) {
                console.error('보관통 생성 실패:', err);
                return;
            }

            if (document.getElementById('assembledView').checked) {
                positionLidForAssembled(g.lidGeo, g.H - g.head);
            } else {
                positionLidForPrint(g.lidGeo, g.D);
            }

            disposeCurrentThreeMesh();
            currentBodyGeo = g.bodyGeo;
            currentLidGeo = g.lidGeo;
            currentD = g.D;

            const bodyMesh = new THREE.Mesh(currentBodyGeo, new THREE.MeshStandardMaterial({
                color: colBody, metalness: 0.15, roughness: 0.4, envMapIntensity: 0.55
            }));
            const lidMesh = new THREE.Mesh(currentLidGeo, new THREE.MeshStandardMaterial({
                color: colLid, metalness: 0.15, roughness: 0.4, envMapIntensity: 0.55
            }));

            currentGroup = new THREE.Group();
            currentGroup.add(bodyMesh);
            currentGroup.add(lidMesh);
            currentGroup.traverse(function (obj) { obj.castShadow = false; obj.receiveShadow = false; });
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
        }

        // 미리보기와 달리, 다운로드할 때는 setQuality('export')로 나사산/그립 무늬를 인쇄
        // 품질로 다시 계산한다 — 슬라이더를 움직이는 동안엔 이 무거운 계산을 피하기 위함
        // (갤러리2/3/5/6/8과 동일한 방침). 화면에 보이는 미리보기(currentGroup)는 건드리지 않는다.
        function downloadSTL() {
            if (!manifoldReady) return;
            const params = readParams();

            setQuality('export');
            let g;
            try {
                g = buildGeometries(params);
            } catch (err) {
                console.error('STL 생성 실패:', err);
                return;
            }

            // 화면에서 "조립된 모습"을 보고 있어도, 실제로 찍을 STL은 항상 서포트 없이
            // 출력할 수 있는 분리 배치(뚜껑을 뒤집어 옆에 놓기)로 내보낸다.
            positionLidForPrint(g.lidGeo, g.D);

            const bodyMesh = new THREE.Mesh(g.bodyGeo, new THREE.MeshBasicMaterial());
            const lidMesh = new THREE.Mesh(g.lidGeo, new THREE.MeshBasicMaterial());
            const exportGroup = new THREE.Group();
            exportGroup.add(bodyMesh);
            exportGroup.add(lidMesh);
            ParametricCore.exportSTL(exportGroup, LangCore.pick(`보관통_${Math.round(g.D)}mm.stl`, `container_${Math.round(g.D)}mm.stl`));

            g.bodyGeo.dispose();
            g.lidGeo.dispose();
            bodyMesh.material.dispose();
            lidMesh.material.dispose();
        }

        // STL과 달리 3MF는 색을 담을 수 있으므로, MeshBasicMaterial() 대신 실제 몸체/뚜껑 색을
        // 입힌다 — 그 외 지오메트리 준비 과정(export 품질로 재계산, 출력용 배치)은 downloadSTL과 동일.
        function download3MF() {
            if (!manifoldReady) return;
            const params = readParams();
            const colBody = document.getElementById('colBody').value;
            const colLid = document.getElementById('colLid').value;

            setQuality('export');
            let g;
            try {
                g = buildGeometries(params);
            } catch (err) {
                console.error('3MF 생성 실패:', err);
                return;
            }

            positionLidForPrint(g.lidGeo, g.D);

            const bodyMesh = new THREE.Mesh(g.bodyGeo, new THREE.MeshStandardMaterial({ color: colBody }));
            const lidMesh = new THREE.Mesh(g.lidGeo, new THREE.MeshStandardMaterial({ color: colLid }));
            const exportGroup = new THREE.Group();
            exportGroup.add(bodyMesh);
            exportGroup.add(lidMesh);
            ThreeMFCore.export3MF(exportGroup, LangCore.pick(`보관통_${Math.round(g.D)}mm.3mf`, `container_${Math.round(g.D)}mm.3mf`));

            g.bodyGeo.dispose();
            g.lidGeo.dispose();
            bodyMesh.material.dispose();
            lidMesh.material.dispose();
        }

        window.scheduleUpdate = scheduleUpdate;
        window.downloadSTL = downloadSTL;
        window.download3MF = download3MF;
        // 메인화면 카드 미리보기(GLB)를 구울 때 바깥에서 완성된 모델을 꺼내가기 위한 훅.
        // 실제 사용자 기능은 아니고, index.html의 미리보기 파일을 다시 구울 때만 쓴다.
        window.__getPreviewGroup = function () { return currentGroup; };

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            updateModel();
        }
        main();
    </script>
</body>
</html>
