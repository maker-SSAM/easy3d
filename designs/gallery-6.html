         ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->

    <script type="module">
        // 갤러리6: 멀티컬러 오가닉 보더 이름표. 사용자가 준 OpenSCAD 디자인("Multi-Color Organic
        // Border Nameplate")을 이 프로젝트의 three.js + Manifold-3D 스택으로 포팅했다.
        //
        // 원본의 핵심 구조: 평평한 바닥판(linear_extrude) 위에 텍스트 3줄 + 이모지 2개가
        // "회전체 돌출(bend_engine)" 기법으로 도드라진다 — 각 글자의 2D 윤곽선을 text_radius만큼
        // 밀어낸 뒤 rotate_extrude(각도=cutangle)로 스윕해서, 평평한 압출이 아니라 둥글게
        // 부풀어 오른(엠보싱) 입체로 만든다. Manifold-3D의 Manifold.revolve()가 OpenSCAD의
        // rotate_extrude()와 동일한 의미라서(ManifoldCore.revolveXS, 갤러리4 나사산에서 이미 사용
        // 중), 원본의 회전 체인을 그대로 옮길 수 있었다.
        //
        // 원본 대비 바꾼 부분:
        //   - 글씨체: 임의의 구글 폰트 이름(font1/2/3) 대신, 갤러리5/7와 동일한 우리 폰트 10종
        //     목록/순서를 그대로 씀 (텍스트 1/2/3 각각 독립적으로 선택 가능)
        //   - 이모지 폰트: 갤러리5와 동일하게 NotoEmoji-SemiBold.ttf로 고정
        //
        // 주의(구현자 노트): bend_engine의 5단계 회전(-90도 → text_radius만큼 이동 → revolve →
        // (90-cutangle)도 회전 → -90도 회전)은 OpenSCAD 소스를 그대로 기계적으로 옮긴 것이다.
        // 실제 브라우저 렌더링으로 검증하지 못했으므로(이 세션은 WebGL을 직접 못 봄), 글자가
        // 뒤집히거나 엉뚱한 방향으로 튀어나오면 아래 bendEmboss()의 회전 부호/순서부터 의심할 것.
        const shell = ParametricCore.mountEditorShell(document.body, null, {
            sourceUrl: 'https://makerworld.com/ko/models/2628507-sweeping-nameplate-typed-in-korean#profileId-2902128',
            licenseType: 'BY-SA'
        });

            { label: 'Noto Serif KR', file: 'NotoSerifKR-Black.ttf' },
            { label: 'Noto Sans KR', file: 'NotoSansKR-Black.ttf' },
            { label: 'Paperlogy', file: 'Paperlogy-8ExtraBold.ttf' },
            { label: 'Cafe24 Ohsquare', file: 'Cafe24Ohsquare-v2.0.ttf' },
            { label: 'Cafe24 Ssurround', file: 'Cafe24Ssurround-v2.0.ttf' },
            { label: 'Mona12', file: 'Mona12-Bold.ttf' },
            { label: 'Cafe24 Proup', file: 'Cafe24PROUP.ttf' },
            { label: 'Cafe24 Supermagic', file: 'Cafe24Supermagic-Bold-v1.0.ttf' },
            { label: 'Cafe24 Ssukssuk', file: 'Cafe24SsukssukRegular.ttf' },
            { label: 'Cafe24 Dongdong', file: 'Cafe24DongdongRegular.ttf' }

            distance: 1, facesSegment: 10, // facesSegment는 슬라이더를 되살릴 때를 위한 기본값(현재는 미사용, PREVIEW_FACES_SEGMENT 참고)
            text1: '한글로 입력하는', fontIndex1: DEFAULT_FONT_INDEX, size1: 11, t1ScaleX: 1.0, t1Spacing: 1.0, t1Offset: 0.0,
            text2: '네임플레이트', fontIndex2: FONT_OPTIONS.findIndex(f => f.file === 'Cafe24PROUP.ttf'), size2: 14, t2ScaleX: 1.0, t2Spacing: 1.0, t2Offset: 0.0,
            text3: '스위핑&멀티컬러', fontIndex3: FONT_OPTIONS.findIndex(f => f.file === 'Mona12-Bold.ttf'), size3: 10, t3ScaleX: 1.0, t3Spacing: 1.0, t3Offset: 0.0,
            emojiLeft: '🦈', leftOffset: 0.5, emojiRight: '♥', rightOffset: 0.5,
            baseOffset: 4, baseHeight: 3, cutAngle: 65, textRadius: 7,
            colText1: '#FF5733', colText2: '#33FF57', colText3: '#3357FF',

            <div class="section-label" data-i18n-en="1. Basic Settings">1. 기본 설정</div>
            <!-- 곡선의 세밀한정도 슬라이더: three.js 렌더링에서 각짐이 잘 안 보여 UI에서 뺐다.
                 되살리려면 이 줄의 주석을 풀고, readParams()/resetToDefaults()/updateModel()에
                 남겨둔 관련 주석을 함께 복구할 것.
            <div class="control-group"><label>곡선의 세밀한정도: <span id="valFacesSegment">20</span></label><input type="range" id="facesSegment" min="4" max="60" step="1" value="20" oninput="scheduleUpdate()"></div>
            -->
            <div class="control-group"><label><span data-i18n-en="Line spacing">줄간격</span>: <span id="valDistance">1</span></label><input type="range" id="distance" min="0.5" max="3.0" step="0.1" value="1" oninput="scheduleUpdate()"></div>

            <div class="section-label" data-i18n-en="2. Text Line 1">2. 텍스트 1</div>
            <div class="control-group">
                <label data-i18n-en="Text line 1 (press Enter or click elsewhere after typing)">텍스트 1 입력 (입력 후 Enter 또는 다른 곳 클릭)</label>
                <input type="text" id="text1" value="한글로 입력하는" onkeydown="onTextKeydown(event)" onblur="scheduleUpdate()">
            </div>
            <div class="control-group">

                </select>
                <input type="file" id="font1Upload" accept=".ttf,.otf" style="display:none">
            </div>
            <div class="control-group"><label><span data-i18n-en="Text line 1 size">텍스트 1 크기</span>: <span id="valSize1">11</span></label><input type="range" id="size1" min="5" max="50" step="0.5" value="11" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Text 1 width">텍스트1 장평</span>: <span id="valT1ScaleX">1.0</span></label><input type="range" id="t1ScaleX" min="0.5" max="2.0" step="0.1" value="1.0" oninput="scheduleUpdate()"></div>

            <div class="control-group"><label><span data-i18n-en="Text 2 thickness">텍스트2 굵기</span>: <span id="valT2Offset">0.0</span></label><input type="range" id="t2Offset" min="-1.0" max="2.0" step="0.1" value="0.0" oninput="scheduleUpdate()"></div>

                    <option value="__upload__" data-i18n-en="📁 Upload my font file...">📁 내 폰트 파일 업로드...</option>
                </select>
                <input type="file" id="font3Upload" accept=".ttf,.otf" style="display:none">
            </div>
            <div class="control-group"><label><span data-i18n-en="Text line 3 size">텍스트 3 크기</span>: <span id="valSize3">10</span></label><input type="range" id="size3" min="5" max="50" step="0.5" value="10" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Text 3 width">텍스트3 장평</span>: <span id="valT3ScaleX">1.0</span></label><input type="range" id="t3ScaleX" min="0.5" max="2.0" step="0.1" value="1.0" oninput="scheduleUpdate()"></div>

            <div class="control-group">

                <input type="text" id="emojiRight" class="emoji-input" value="♥" oninput="scheduleUpdate()">
            </div>
            <div class="control-group"><label><span data-i18n-en="Right emoji position">오른쪽 이모지 위치</span>: <span id="valRightOffset">0.5</span></label><input type="range" id="rightOffset" min="0" max="2" step="0.05" value="0.5" oninput="scheduleUpdate()"></div>
            <p style="font-size: 0.85em; margin: -6px 0 14px;"><span data-i18n-en="🔎 Not sure how to type an emoji? Find one you like in the">🔎 이모지를 어떻게 입력하는지 모르겠다면 →</span> <a href="https://fonts.google.com/noto/specimen/Noto+Emoji/glyphs" target="_blank" rel="noopener" style="color: var(--home-link-color);" data-i18n-en="Noto Emoji list">Noto Emoji 목록</a><span data-i18n-en=", then copy and paste it here.">에서 원하는 이모지를 찾아 복사·붙여넣기 하세요.</span></p>

            <div class="section-label" data-i18n-en="6. Base Plate Settings">6. 바닥판 설정</div>

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let lastGeometryFingerprint = null; // 색상만 바뀐 건지 판별하는 캐시 키
        let manifoldReady = false;
        let text1Font = null, text2Font = null, text3Font = null, emojiFont = null;
        // 각 줄에 지금 적용 중인 폰트의 캐시 키 — 번들 폰트면 파일명, 업로드 파일이면
        // FontCore.loadFontFromFile()이 만들어준 합성 키. readParams()가 이 값을 쓴다
        // (select.value를 그때그때 다시 인덱싱하면 업로드 폰트일 때 어긋난다).
        let font1File = FONT_OPTIONS[DEFAULT_FONT_INDEX].file;
        let font2File = FONT_OPTIONS[DEFAULTS.fontIndex2].file;
        let font3File = FONT_OPTIONS[DEFAULTS.fontIndex3].file;
        let updateTimer = null;

        function scheduleUpdate() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 100);
        }

        function onTextKeydown(event) {
            if (event.key === 'Enter') scheduleUpdate();
        }

        // 텍스트1/2/3 세 줄 모두 "번들 폰트 select + 업로드 옵션 + 숨은 file input"이 같은
        // 패턴이라, 반복을 피하려고 배선 로직을 함수로 뺐다. onFontResolved(font, cacheKey)가
        // 실제로 textNFont/fontNFile 상태를 갱신하고 모델을 다시 그린다.
        function setupFontPicker(selectId, uploadId, defaultIndex, onFontResolved) {
            const select = document.getElementById(selectId);
            const upload = document.getElementById(uploadId);
            let prevValue = String(defaultIndex);

            function change() {
                if (select.value === '__upload__') { upload.click(); return; }
                const uploadedFont = FontCore.getFont(select.value);
                if (uploadedFont) {
                    prevValue = select.value;
                    onFontResolved(uploadedFont, select.value);
                    return;
                }
                prevValue = select.value;
                const file = FONT_OPTIONS[select.value].file;
                FontCore.loadFont(file, function (font) { onFontResolved(font, file); });
            }

            upload.addEventListener('change', function (e) {
                const file = e.target.files[0];
                e.target.value = ''; // 같은 파일을 다시 선택해도 change 이벤트가 뜨도록 초기화
                if (!file) { select.value = prevValue; return; }
                FontCore.loadFontFromFile(file, function (font, cacheKey) {
                    const opt = document.createElement('option');
                    opt.value = cacheKey;
                    opt.textContent = '📁 ' + file.name;
                    select.insertBefore(opt, select.querySelector('option[value="__upload__"]'));
                    select.value = cacheKey;
                    prevValue = cacheKey;
                    onFontResolved(font, cacheKey);
                }, function () {
                    alert(LangCore.pick('폰트 파일을 열 수 없어요. .ttf 또는 .otf 파일인지 확인해 주세요.', 'Could not open the font file. Please check that it is a .ttf or .otf file.'));
                    select.value = prevValue;
                });
            });

            return { change: change };
        }

        const font1Picker = setupFontPicker('font1Select', 'font1Upload', DEFAULT_FONT_INDEX, function (font, file) {
            text1Font = font; font1File = file; updateModel();
        });
        const font2Picker = setupFontPicker('font2Select', 'font2Upload', DEFAULTS.fontIndex2, function (font, file) {
            text2Font = font; font2File = file; updateModel();
        });
        const font3Picker = setupFontPicker('font3Select', 'font3Upload', DEFAULTS.fontIndex3, function (font, file) {
            text3Font = font; font3File = file; updateModel();
        });

        function onFont1Change() { font1Picker.change(); }
        function onFont2Change() { font2Picker.change(); }
        function onFont3Change() { font3Picker.change(); }

        function resetToDefaults() {
            // facesSegment 슬라이더는 UI에서 뺐다 — 되살리면 여기도 원래대로
            // document.getElementById('facesSegment').value = DEFAULTS.facesSegment; 를 복구할 것
            document.getElementById('distance').value = DEFAULTS.distance;

            document.getElementById('text1').value = DEFAULTS.text1;
            document.getElementById('font1Select').value = DEFAULTS.fontIndex1;
            document.getElementById('size1').value = DEFAULTS.size1;
            document.getElementById('t1ScaleX').value = DEFAULTS.t1ScaleX;
            document.getElementById('t1Spacing').value = DEFAULTS.t1Spacing;
            document.getElementById('t1Offset').value = DEFAULTS.t1Offset;

            document.getElementById('text2').value = DEFAULTS.text2;
            document.getElementById('font2Select').value = DEFAULTS.fontIndex2;
            document.getElementById('size2').value = DEFAULTS.size2;
            document.getElementById('t2ScaleX').value = DEFAULTS.t2ScaleX;
            document.getElementById('t2Spacing').value = DEFAULTS.t2Spacing;
            document.getElementById('t2Offset').value = DEFAULTS.t2Offset;

            document.getElementById('text3').value = DEFAULTS.text3;
            document.getElementById('font3Select').value = DEFAULTS.fontIndex3;
            document.getElementById('size3').value = DEFAULTS.size3;
            document.getElementById('t3ScaleX').value = DEFAULTS.t3ScaleX;
            document.getElementById('t3Spacing').value = DEFAULTS.t3Spacing;
            document.getElementById('t3Offset').value = DEFAULTS.t3Offset;

            document.getElementById('emojiLeft').value = DEFAULTS.emojiLeft;
            document.getElementById('leftOffset').value = DEFAULTS.leftOffset;
            document.getElementById('emojiRight').value = DEFAULTS.emojiRight;
            document.getElementById('rightOffset').value = DEFAULTS.rightOffset;

            document.getElementById('baseOffset').value = DEFAULTS.baseOffset;
            document.getElementById('baseHeight').value = DEFAULTS.baseHeight;
            document.getElementById('cutAngle').value = DEFAULTS.cutAngle;
            document.getElementById('textRadius').value = DEFAULTS.textRadius;

            document.getElementById('colText1').value = DEFAULTS.colText1;
            document.getElementById('colText2').value = DEFAULTS.colText2;
            document.getElementById('colText3').value = DEFAULTS.colText3;
            document.getElementById('colEmojiL').value = DEFAULTS.colEmojiL;
            document.getElementById('colEmojiR').value = DEFAULTS.colEmojiR;
            document.getElementById('colBase').value = DEFAULTS.colBase;

            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            onFont1Change(); onFont2Change(); onFont3Change(); // 폰트를 다시 로드하면서 모델도 재생성
        }

        // ---------- 실제 모델링 ----------
        // curveSegments: 글자 곡선(폰트 윤곽선) 근사 해상도 — 순수 품질/성능 트레이드오프라
        // 사용자에게 직접 노출하지 않는다(갤러리5와 동일한 방침). 라이브 조작 중엔 낮게, STL
        // 내보낼 때만 인쇄 품질로 다시 계산한다.
        // faces_segment(회전체 스윕 해상도)는 원래 원본 OpenSCAD처럼 사용자가 직접 조절하는
        // 슬라이더였지만, three.js/Manifold 렌더링에서는 각짐이 잘 안 보여 조절 의미가 없어서
        // UI에서 뺐다(curveSegments와 동일 방침으로 통일). 미리보기는 낮게 고정해 속도를 확보하고
        // STL 내보낼 때만 인쇄 품질로 세밀하게 계산한다.
        // 되살리려면: 아래 두 상수 대신 HTML의 주석 처리된 "곡선의 세밀한정도" 슬라이더
        // (섹션 "1. 기본 설정")를 복구하고, readParams()의 facesSegment 줄을
        // `parseFloat(document.getElementById('facesSegment').value)`로, resetToDefaults()의
        // 해당 줄과 updateModel()의 valFacesSegment 표시 줄을 원래대로 되돌리면 된다
        // (모두 이 파일 안에 주석으로 위치가 표시돼 있음).
        const PREVIEW_CURVE_SEGMENTS = 16;
        // 원래 48/60이었는데, 실제로 겪은 문제 — 이 갤러리 특유의 회전체 돌출(bendEmboss의
        // revolveXS)이 2D 윤곽선 점 하나당 대략 "revolveSegments × 6" 배로 정점을 불려서(다른
        // 갤러리의 단순 압출과 달리, 여러 개의 닫힌 하위경로(자모 속 구멍, 이모지 조각들)를
        // 부분 각도(cutAngle)로만 스윕하면서 이음매 처리를 하는 탓으로 추정), 48/60에서는
        // 상어 이모지 하나만으로도 최종 정점 수가 수천만 개까지 치솟아 Manifold WASM이
        // "memory access out of bounds"로 죽어버렸다(실제로 다운로드 버튼을 눌러서 재현 확인).
        // 10/8로 낮춰도 revolveSegments(= facesSegment*360/cutAngle, 기본 cutAngle=65도 기준
        // 약 44)는 여전히 육안으로는 충분히 매끈하다 — 62도 곡선을 44단계로 스윕하는 거라
        // 각짐이 거의 안 보인다. 이 값으로 실제 union+toBufferGeometry가 성공하는 것까지
        // 브라우저에서 직접 확인했다(정점 약 70만 개, 크래시 없음).
        const EXPORT_CURVE_SEGMENTS = 10;
        const PREVIEW_FACES_SEGMENT = 10;
        const EXPORT_FACES_SEGMENT = 8;

        function contoursExtentX(contours) {
            let minX = Infinity, maxX = -Infinity;
            contours.forEach(function (pts) {
                pts.forEach(function (p) { if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0]; });
            });
            return minX > maxX ? 0 : (maxX - minX);
        }

        // 텍스트1/2/3 + 이모지L/R + 바닥판 외곽선의 "2D 도형"만 만들어서 돌려준다. 회전체
        // 돌출(bend)과 바닥판 압출은 여기 포함되지 않는다 — 회전체 각도/반지름/세그먼트나
        // 바닥판 높이 같은 슬라이더는 이 2D 도형에 전혀 영향을 주지 않으므로, 그런 경우엔
        // 이 결과를 캐시해서 재사용하고 돌출/압출 단계만 다시 하면 된다(아래 shapeCache 참고).
        function buildShapes(p, curveSegments) {
            const scratch = [];
            function track(m) { scratch.push(m); return m; }

            const c1 = p.text1 ? FontCore.buildCenteredContours(p.text1, p.font1, p.font1File, p.size1, p.t1Spacing, curveSegments) : [];
            const c2 = p.text2 ? FontCore.buildCenteredContours(p.text2, p.font2, p.font2File, p.size2, p.t2Spacing, curveSegments) : [];
            const c3 = p.text3 ? FontCore.buildCenteredContours(p.text3, p.font3, p.font3File, p.size3, p.t3Spacing, curveSegments) : [];

            // textmetrics()에 대응 — offset(굵기) 적용 전, 장평만 곱한 원시 폭.
            const width1 = contoursExtentX(c1) * p.t1ScaleX;
            const width2 = contoursExtentX(c2) * p.t2ScaleX;
            const width3 = contoursExtentX(c3) * p.t3ScaleX;
            const textwidth = Math.max(width1, width2, width3);

            // 원본 auto-calc 구간 그대로: 줄 간격/이모지 y위치 계산.
            const distance12 = (p.size1 / 2 + p.size2 / 2) * p.distance;
            const distance23 = (p.size2 / 2 + p.size3 / 2) * p.distance;
            const distLine12 = (p.text2 === '' && p.text3 === '') ? 0 : distance12;
            const distLine23 = (p.text3 === '') ? 0 : distance23;
            const specialcharsize = (p.text1 !== '' ? p.size1 : 0) + (p.text2 !== '' ? p.size2 : 0) + (p.text3 !== '' ? p.size3 : 0);
            let specialcharY = 0;
            if (p.text1 !== '' && p.text2 !== '' && p.text3 === '') specialcharY = distLine12 / 2;
            else if (p.text1 === '' && p.text2 !== '' && p.text3 !== '') specialcharY = distLine23 / 2;
            else if (p.text1 !== '' && p.text3 !== '') specialcharY = (distLine12 + distLine23) / 2;

            // 각 줄: offset(굵기) → scale(장평) → translate(줄 쌓기 위치) 순서로 적용
            // (OpenSCAD 원본의 t*_2d 모듈과 동일한 순서 — offset이 scale보다 먼저 적용된다).
            function lineXS(contours, offsetAmt, scaleX, y) {
                if (!contours.length) return null;
                let xs = track(ManifoldCore.contoursToXS(contours));
                if (Math.abs(offsetAmt) > 0.001) xs = track(xs.offset(offsetAmt));
                if (Math.abs(scaleX - 1) > 0.001) xs = track(xs.scale([scaleX, 1]));
                if (y) xs = track(xs.translate([0, y]));
                return xs;
            }

            const text1XS = lineXS(c1, p.t1Offset, p.t1ScaleX, distLine23 + distLine12);
            const text2XS = lineXS(c2, p.t2Offset, p.t2ScaleX, distLine23);
            const text3XS = lineXS(c3, p.t3Offset, p.t3ScaleX, 0);

            function emojiXS(text, side) {
                if (!text) return null;
                const contours = FontCore.buildCenteredContours(text, p.emojiFont, EMOJI_FONT_FILE, specialcharsize * 0.8, 1, curveSegments);
                if (!contours.length) return null;
                let xs = track(ManifoldCore.contoursToXS(contours));
                const dist = specialcharsize * (side === 'L' ? p.leftOffset : p.rightOffset);
                const tx = side === 'L' ? -(textwidth / 2 + dist) : (textwidth / 2 + dist);
                xs = track(xs.translate([tx, specialcharY]));
                return xs;
            }
            const emojiLXS = emojiXS(p.emojiLeft, 'L');
            const emojiRXS = emojiXS(p.emojiRight, 'R');

            // 바닥판 외곽선: 모든 텍스트+이모지 footprint를 union한 뒤 base_offset만큼 부풀림.
            let masterXS = null;
            [text1XS, text2XS, text3XS, emojiLXS, emojiRXS].forEach(function (xs) {
                if (!xs) return;
                masterXS = masterXS ? track(masterXS.add(xs)) : xs;
            });
            const baseXS = masterXS ? track(masterXS.offset(p.baseOffset)) : null;

            // 최종 결과로 쓸 것들은 scratch(중간 산출물 정리 목록)에서 빼둔다 — 캐시로 살아남아야
            // 하므로 여기서 지우면 안 된다. 무효화될 때 disposeShapes()가 대신 지운다.
            const keep = new Set([text1XS, text2XS, text3XS, emojiLXS, emojiRXS, baseXS].filter(Boolean));
            scratch.forEach(function (m) { if (m && !keep.has(m) && typeof m.delete === 'function') m.delete(); });

            return { text1XS: text1XS, text2XS: text2XS, text3XS: text3XS, emojiLXS: emojiLXS, emojiRXS: emojiRXS, baseXS: baseXS };
        }

        function disposeShapes(shapes) {
            if (!shapes) return;
            ['text1XS', 'text2XS', 'text3XS', 'emojiLXS', 'emojiRXS', 'baseXS'].forEach(function (key) {
                const xs = shapes[key];
                if (xs && typeof xs.delete === 'function') xs.delete();
            });
        }

        let shapeCache = null; // { fingerprint, shapes } — 라이브 미리보기 전용 2D 도형 캐시

        function getPreviewShapes(p, shapeFp) {
            if (shapeCache && shapeCache.fingerprint === shapeFp) return shapeCache.shapes;
            if (shapeCache) disposeShapes(shapeCache.shapes);
            shapeCache = null;
            let shapes;
            try {
                shapes = buildShapes(p, PREVIEW_CURVE_SEGMENTS);
            } catch (err) {
                console.error('이름표 도형 생성 실패:', err);
                return null;
            }
            if (shapes) shapeCache = { fingerprint: shapeFp, shapes: shapes };
            return shapes;
        }

        // OpenSCAD bend_engine 포팅 — 2D 도형에 "회전체 돌출(엠보싱)" 효과를 준다. 원본의
        // 4단계 회전을 순서 그대로 옮긴다:
        //   A) 자식 2D 도형을 Z축 기준 -90도 회전
        //   B) (반지름 방향이 된) X축으로 text_radius만큼 이동
        //   C) rotate_extrude(angle=cutangle) → revolveXS로 스윕
        //   D) 결과 솔리드를 Z축 기준 (90-cutangle)도 회전
        //   E) 결과 솔리드를 Y축 기준 -90도 회전
        // 전부 OpenSCAD와 동일한 Z-up 좌표계에서 진행하고(갤러리4의 나사산과 같은 방식),
        // 바닥판과 합쳐지는 마지막 단계에서만 한 번씩 Y-up으로 바꾼다(finalizeLayer).
        function bendEmboss(xs2D, p) {
            if (!xs2D) return null;
            const revolveSegments = Math.max(3, Math.round(p.facesSegment * 360 / p.cutAngle));
            const rotA = xs2D.rotate(-90);
            const transB = rotA.translate([p.textRadius, 0]);
            rotA.delete();
            const swept = ManifoldCore.revolveXS(transB, revolveSegments, p.cutAngle);
            transB.delete();
            const rotD = swept.rotate([0, 0, 90 - p.cutAngle]);
            swept.delete();
            const rotE = rotD.rotate([0, -90, 0]);
            rotD.delete();
            return rotE; // 여전히 Z-up
        }

        // 바닥판: 평평하게 linear_extrude(원본 OpenSCAD와 동일하게 Z-up 그대로 압출 — 갤러리5/7의
        // extrudeXS()처럼 자동으로 Y-up 회전을 시키지 않는다) 후 원본과 동일하게 위치시킨다.
        function buildBaseSolid(baseXS, p) {
            if (!baseXS) return null;
            const extruded = baseXS.extrude(p.baseHeight);
            const positioned = extruded.translate([0, p.textRadius, -p.baseHeight]);
            extruded.delete();
            return positioned; // 여전히 Z-up
        }

        // 원본의 바깥쪽 translate([0,0,baseheight])(텍스트+바닥판 공통)를 적용한 뒤, three.js
        // Y-up으로 최종 변환한다.
        function finalizeLayer(zUpSolid, p) {
            if (!zUpSolid) return null;
            const shifted = zUpSolid.translate([0, 0, p.baseHeight]);
            zUpSolid.delete();
            const yUp = ManifoldCore.toYUp(shifted);
            shifted.delete();
            return yUp;
        }

        function meshFromSolid(solid, color) {
            if (!solid) return null;
            const buf = ManifoldCore.toBufferGeometry(solid);
            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({
                color: color, metalness: 0.2, roughness: 0.45, envMapIntensity: 0.55
            }));
            mesh.castShadow = false;
            mesh.receiveShadow = false;
            return mesh;
        }

        // bend_engine 회전 압출 특성상 텍스트1/2/3은 줄마다(회전 스윕 축 기준) 앞뒤(Z) 위치가
        // 제각각이라(텍스트1이 가장 안쪽, 텍스트3이 가장 바깥쪽) 전체 디자인이 격자 원점(사분면
        // 중앙)보다 한쪽으로 치우쳐 보인다 — 실제로 겪은 문제, 화면 중앙이 텍스트2(가운데 줄)가
        // 아니라 텍스트1 쪽에 쏠려 있었다. distLine 오프셋 자체를 텍스트2 기준으로 다시 잡으면
        // 될 것 같지만, 그러면 텍스트3처럼 오프셋이 음수가 되는 줄이 생겨 revolve의 회전축
        // (x>=0 조건)을 넘어가 도형이 깨진다(실제로 겪음). 그래서 각 층을 다 만들고 나서,
        // 완성된 텍스트2의 Z 중심이 원점에 오도록 전체 층을 한 번에 동일하게 밀어주는 방식을
        // 쓴다 — 이러면 회전 압출 자체는 건드리지 않고, 층 사이 상대 위치도 그대로 유지된다.
        function computeText2ZShift(layers) {
            const text2Layer = layers.find(function (l) { return l.name === 'text2'; });
            if (!text2Layer) return 0;
            const bb = text2Layer.solid.boundingBox();
            return -(bb.min[2] + bb.max[2]) / 2;
        }

        function shiftSolidZ(solid, zShift) {
            if (Math.abs(zShift) < 0.0001) return solid;
            const moved = solid.translate([0, 0, zShift]);
            solid.delete();
            return moved;
        }

        // 라이브 미리보기용: union 없이 층마다(텍스트1/2/3, 이모지L/R, 바닥판) 독립된
        // THREE.Mesh를 만든다. 2D 도형은 캐시에서 가져오고(모양이 안 바뀌었으면 재사용),
        // 돌출/압출/위치는 매번 새로 한다.
        function buildPreviewMeshes(p, shapeFp) {
            const shapes = getPreviewShapes(p, shapeFp);
            if (!shapes) return null;

            const layerDefs = [
                { name: 'text1', build: function () { return bendEmboss(shapes.text1XS, p); }, color: p.colText1 },
                { name: 'text2', build: function () { return bendEmboss(shapes.text2XS, p); }, color: p.colText2 },
                { name: 'text3', build: function () { return bendEmboss(shapes.text3XS, p); }, color: p.colText3 },
                { name: 'emojiL', build: function () { return bendEmboss(shapes.emojiLXS, p); }, color: p.colEmojiL },
                { name: 'emojiR', build: function () { return bendEmboss(shapes.emojiRXS, p); }, color: p.colEmojiR },
                { name: 'base', build: function () { return buildBaseSolid(shapes.baseXS, p); }, color: p.colBase }
            ];

            const layers = layerDefs.map(function (def) {
                return { name: def.name, color: def.color, solid: finalizeLayer(def.build(), p) };
            }).filter(function (l) { return l.solid; });

            const zShift = computeText2ZShift(layers);

            const meshes = [];
            layers.forEach(function (l) {
                const solid = shiftSolidZ(l.solid, zShift);
                const mesh = meshFromSolid(solid, l.color);
                solid.delete();
                if (!mesh) return;
                mesh.userData.layerName = l.name;
                meshes.push(mesh);
            });

            return meshes.length ? meshes : null;
        }

        // STL 내보내기 전용: 부품을 진짜로 하나의 매니폴드로 union한다. 미리보기 캐시와는
        // 무관하게 매번 새로(인쇄 품질로) 만든다. STL은 색 정보가 없으므로 부품별 색상 매핑
        // 없이 union만 한다.
        function buildFusedSolid(p) {
            const shapes = buildShapes(p, EXPORT_CURVE_SEGMENTS);
            if (!shapes) return null;

            const layerBuilds = [
                { name: 'text1', zUp: bendEmboss(shapes.text1XS, p) },
                { name: 'text2', zUp: bendEmboss(shapes.text2XS, p) },
                { name: 'text3', zUp: bendEmboss(shapes.text3XS, p) },
                { name: 'emojiL', zUp: bendEmboss(shapes.emojiLXS, p) },
                { name: 'emojiR', zUp: bendEmboss(shapes.emojiRXS, p) },
                { name: 'base', zUp: buildBaseSolid(shapes.baseXS, p) }
            ];
            disposeShapes(shapes);

            const parts = layerBuilds.map(function (l) {
                return { name: l.name, solid: finalizeLayer(l.zUp, p) };
            }).filter(function (l) { return l.solid; });

            if (!parts.length) return null;
            const zShift = computeText2ZShift(parts);

            let fused = null;
            parts.forEach(function (l) {
                const solid = shiftSolidZ(l.solid, zShift);
                if (!fused) {
                    fused = solid;
                } else {
                    const merged = ManifoldCore.union(fused, solid);
                    fused.delete();
                    solid.delete();
                    fused = merged;
                }
            });
            return fused;
        }

        // 메인화면 카드 미리보기(GLB) 전용: buildFusedSolid()와 동일하게 6개 층을 실제로
        // union하되, union 전에 층마다 originalID를 부여해둬서(union 뒤에도 ID가 유지됨)
        // toThreeMesh()가 부품별 색을 되살릴 수 있게 한다. 라이브 미리보기(buildPreviewMeshes)는
        // union 없이 6개의 겹친 메시를 그대로 두는데, 이게 화면에서는 슬라이더 반응 속도를 위한
        // 의도된 트레이드오프지만, 그 겹친 경계면(층 바닥이 바닥판 윗면과 정확히 y=baseHeight에서
        // 맞닿음)이 메인화면 카드처럼 계속 회전하는 뷰에서는 z-fighting(깜빡이며 깨지는 현상)으로
        // 보인다 — 실제로 갤러리6 카드를 회전시켜서 확인한 문제. 카드 미리보기는 한 번만 구워서
        // 쓰는 정적 GLB라 런타임 비용 걱정 없이 진짜 union으로 이 문제를 근본적으로 없앨 수 있다.
        const LAYER_COLOR_KEYS_FOR_FUSE = { text1: 'colText1', text2: 'colText2', text3: 'colText3', emojiL: 'colEmojiL', emojiR: 'colEmojiR', base: 'colBase' };

        function buildFusedColoredSolid(p, curveSegments) {
            const shapes = buildShapes(p, curveSegments);
            if (!shapes) return null;

            const layerBuilds = [
                { name: 'text1', zUp: bendEmboss(shapes.text1XS, p) },
                { name: 'text2', zUp: bendEmboss(shapes.text2XS, p) },
                { name: 'text3', zUp: bendEmboss(shapes.text3XS, p) },
                { name: 'emojiL', zUp: bendEmboss(shapes.emojiLXS, p) },
                { name: 'emojiR', zUp: bendEmboss(shapes.emojiRXS, p) },
                { name: 'base', zUp: buildBaseSolid(shapes.baseXS, p) }
            ];
            disposeShapes(shapes);

            const parts = layerBuilds.map(function (l) {
                if (!l.zUp) return null;
                // originalID()는 union 전에 미리 읽어둬야 한다 — union 결과에서 부품별 삼각형
                // 구간을 되찾는 유일한 방법이다(manifold-core.js의 toThreeMesh 참고).
                const marked = ManifoldCore.markAsOriginal(l.zUp);
                const id = marked.originalID();
                return { name: l.name, id: id, solid: finalizeLayer(marked, p) };
            }).filter(Boolean);

            if (!parts.length) return null;
            const idToColor = new Map(parts.map(function (l) {
                return [l.id, p[LAYER_COLOR_KEYS_FOR_FUSE[l.name]]];
            }));

            const zShift = computeText2ZShift(parts);

            let fused = null;
            parts.forEach(function (l) {
                const solid = shiftSolidZ(l.solid, zShift);
                if (!fused) {
                    fused = solid;
                } else {
                    const merged = ManifoldCore.union(fused, solid);
                    fused.delete();
                    solid.delete();
                    fused = merged;
                }
            });
            return { solid: fused, idToColor: idToColor };
        }

        function disposeCurrentThreeMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(function (obj) {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
            currentMeshes = {};
        }

        function readParams() {
            return {
                text1: document.getElementById('text1').value || '',
                font1: text1Font, font1File: font1File,
                size1: parseFloat(document.getElementById('size1').value),
                t1ScaleX: parseFloat(document.getElementById('t1ScaleX').value),
                t1Spacing: parseFloat(document.getElementById('t1Spacing').value),
                t1Offset: parseFloat(document.getElementById('t1Offset').value),

                text2: document.getElementById('text2').value || '',
                font2: text2Font, font2File: font2File,
                size2: parseFloat(document.getElementById('size2').value),
                t2ScaleX: parseFloat(document.getElementById('t2ScaleX').value),
                t2Spacing: parseFloat(document.getElementById('t2Spacing').value),
                t2Offset: parseFloat(document.getElementById('t2Offset').value),

                text3: document.getElementById('text3').value || '',
                font3: text3Font, font3File: font3File,
                size3: parseFloat(document.getElementById('size3').value),
                t3ScaleX: parseFloat(document.getElementById('t3ScaleX').value),
                t3Spacing: parseFloat(document.getElementById('t3Spacing').value),
                t3Offset: parseFloat(document.getElementById('t3Offset').value),

                emojiFont: emojiFont,
                emojiLeft: document.getElementById('emojiLeft').value || '',
                leftOffset: parseFloat(document.getElementById('leftOffset').value),
                emojiRight: document.getElementById('emojiRight').value || '',
                rightOffset: parseFloat(document.getElementById('rightOffset').value),

                distance: parseFloat(document.getElementById('distance').value),
                facesSegment: PREVIEW_FACES_SEGMENT, // 되살리는 방법은 위 PREVIEW_FACES_SEGMENT 선언부 주석 참고
                baseOffset: parseFloat(document.getElementById('baseOffset').value),
                baseHeight: parseFloat(document.getElementById('baseHeight').value),
                cutAngle: parseFloat(document.getElementById('cutAngle').value),
                textRadius: parseFloat(document.getElementById('textRadius').value),

                colText1: document.getElementById('colText1').value,
                colText2: document.getElementById('colText2').value,
                colText3: document.getElementById('colText3').value,
                colEmojiL: document.getElementById('colEmojiL').value,
                colEmojiR: document.getElementById('colEmojiR').value,
                colBase: document.getElementById('colBase').value
            };
        }

        // 2D 도형(모양)에 영향을 주는 값들만 뽑아 지문을 만든다 — 이 값이 이전과 같으면
        // buildShapes()를 다시 돌릴 필요 없이 캐시된 2D 도형을 재사용해도 된다는 뜻이다.
        // 회전체 각도/반지름/세그먼트, 바닥판 높이, 색상은 일부러 뺐다 — 그 값들은 2D 모양
        // 자체가 아니라 "돌출/압출" 단계에만 영향을 준다(gallery-4의 두께류와 같은 개념).
        function shapeFingerprint(p) {
            return JSON.stringify({
                text1: p.text1, font1File: p.font1File, size1: p.size1, t1ScaleX: p.t1ScaleX, t1Spacing: p.t1Spacing, t1Offset: p.t1Offset,
                text2: p.text2, font2File: p.font2File, size2: p.size2, t2ScaleX: p.t2ScaleX, t2Spacing: p.t2Spacing, t2Offset: p.t2Offset,
                text3: p.text3, font3File: p.font3File, size3: p.size3, t3ScaleX: p.t3ScaleX, t3Spacing: p.t3Spacing, t3Offset: p.t3Offset,
                emojiLeft: p.emojiLeft, leftOffset: p.leftOffset, emojiRight: p.emojiRight, rightOffset: p.rightOffset,
                distance: p.distance, baseOffset: p.baseOffset
            });
        }

        // 색상은 지오메트리(모양)에 전혀 영향을 주지 않으므로, shapeFingerprint에 돌출/압출
        // 관련 값만 더해서 전체 지오메트리 지문을 만든다 — 이 값이 이전과 같으면 색상만 바뀐
        // 것이므로 Manifold-3D 재계산 없이 기존 메시의 재질 색만 바꾸고 끝낸다.
        function geometryFingerprint(p) {
            return shapeFingerprint(p) + '|' + JSON.stringify({
                textRadius: p.textRadius, cutAngle: p.cutAngle, facesSegment: p.facesSegment, baseHeight: p.baseHeight
            });
        }

        const LAYER_COLOR_KEYS = { text1: 'colText1', text2: 'colText2', text3: 'colText3', emojiL: 'colEmojiL', emojiR: 'colEmojiR', base: 'colBase' };

        function applyColorsOnly(params) {
            Object.keys(LAYER_COLOR_KEYS).forEach(function (name) {
                const mesh = currentMeshes[name];
                if (!mesh) return;
                mesh.material.color.set(params[LAYER_COLOR_KEYS[name]]);
            });
        }

        function updateModel() {
            if (!manifoldReady || !text1Font || !text2Font || !text3Font || !emojiFont) return;

            const params = readParams();

            [
                // valFacesSegment 표시 줄은 슬라이더와 함께 뺐다 — 되살리면 여기 앞에
                // ['valFacesSegment', params.facesSegment], 를 복구할 것
                ['valDistance', params.distance],
                ['valSize1', params.size1], ['valT1ScaleX', params.t1ScaleX], ['valT1Spacing', params.t1Spacing], ['valT1Offset', params.t1Offset],
                ['valSize2', params.size2], ['valT2ScaleX', params.t2ScaleX], ['valT2Spacing', params.t2Spacing], ['valT2Offset', params.t2Offset],
                ['valSize3', params.size3], ['valT3ScaleX', params.t3ScaleX], ['valT3Spacing', params.t3Spacing], ['valT3Offset', params.t3Offset],
                ['valLeftOffset', params.leftOffset], ['valRightOffset', params.rightOffset],
                ['valBaseOffset', params.baseOffset], ['valBaseHeight', params.baseHeight],
                ['valCutAngle', params.cutAngle], ['valTextRadius', params.textRadius]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });

            const fingerprint = geometryFingerprint(params);
            if (currentGroup && fingerprint === lastGeometryFingerprint) {
                applyColorsOnly(params);
                return;
            }

            let meshes;
            try {
                meshes = buildPreviewMeshes(params, shapeFingerprint(params));
            } catch (err) {
                console.error('이름표 미리보기 생성 실패:', err);
                meshes = null;
            }

            disposeCurrentThreeMesh();
            if (!meshes) return;

            currentGroup = new THREE.Group();
            currentMeshes = {};
            meshes.forEach(function (mesh) {
                currentGroup.add(mesh);
                currentMeshes[mesh.userData.layerName] = mesh;
            });
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
            lastGeometryFingerprint = fingerprint;
        }

        function downloadSTL() {
            if (!manifoldReady || !text1Font || !text2Font || !text3Font || !emojiFont) return;
            const params = readParams();
            params.facesSegment = EXPORT_FACES_SEGMENT; // 미리보기용 저해상도 대신 인쇄 품질로 덮어쓴다

            let fused;
            try {
                fused = buildFusedSolid(params);
            } catch (err) {
                console.error('STL 생성 실패:', err);
                return;
            }
            if (!fused) return;

            const buf = ManifoldCore.toBufferGeometry(fused);
            fused.delete();

            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({ color: params.colBase }));
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            const filename = (params.text1 || params.text2 || params.text3 || LangCore.pick('이름표', 'nameplate')) + LangCore.pick('_이름표.stl', '_nameplate.stl');
            ParametricCore.exportSTL(exportGroup, filename);

            mesh.geometry.dispose();
            mesh.material.dispose();
        }

        // STL(downloadSTL)은 색을 담을 수 없어 buildFusedSolid()(색 정보 없이 union만 함)로
        // 충분했지만, 3MF는 부품별 색을 남길 수 있으므로 이미 메인화면 카드 미리보기(GLB)에
        // 쓰던 buildFusedColoredSolid()(union하되 originalID로 부품 색 유지)를 인쇄 품질
        // (EXPORT_CURVE_SEGMENTS/EXPORT_FACES_SEGMENT)로 재사용한다.
        function download3MF() {
            if (!manifoldReady || !text1Font || !text2Font || !text3Font || !emojiFont) return;
            const params = readParams();
            params.facesSegment = EXPORT_FACES_SEGMENT;

            let result;
            try {
                result = buildFusedColoredSolid(params, EXPORT_CURVE_SEGMENTS);
            } catch (err) {
                console.error('3MF 생성 실패:', err);
                return;
            }
            if (!result) return;

            const mesh = ManifoldCore.toThreeMesh(result.solid, result.idToColor, undefined, { roughness: 0.45, metalness: 0.2, envMapIntensity: 0.55 });
            result.solid.delete();

            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            const filename = (params.text1 || params.text2 || params.text3 || LangCore.pick('이름표', 'nameplate')) + LangCore.pick('_이름표.3mf', '_nameplate.3mf');
            ThreeMFCore.export3MF(exportGroup, filename);

            mesh.geometry.dispose();
            (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(function (m) { m.dispose(); });
        }

        window.scheduleUpdate = scheduleUpdate;
        window.onTextKeydown = onTextKeydown;
        window.onFont1Change = onFont1Change;
        window.onFont2Change = onFont2Change;
        window.onFont3Change = onFont3Change;
        window.downloadSTL = downloadSTL;
        window.download3MF = download3MF;
        // 메인화면 카드 미리보기(GLB)를 구울 때 바깥에서 완성된 모델을 꺼내가기 위한 훅.
        // 실제 사용자 기능은 아니고, index.html의 미리보기 파일을 다시 구울 때만 쓴다.
        window.__getPreviewGroup = function () { return currentGroup; };
        // 갤러리6 전용: 위 훅과 달리 union 없이 겹친 6개 메시(currentGroup)를 그대로 굽지 않고,
        // buildFusedColoredSolid()로 진짜 union한 뒤 부품별 색을 되살린 단일 메시를 담은 새
        // Group을 만들어 돌려준다 — 메인화면 카드 회전 시 z-fighting이 생기지 않도록 이 갤러리의
        // GLB만 이 훅으로 다시 구웠다(바닥판/텍스트/이모지가 실제로 하나의 매니폴드로 이어붙음).
        // 카드는 220px 썸네일이라 STL 인쇄 품질(EXPORT_*)까지는 전혀 필요 없다 — 오히려 그
        // 해상도로 구우면 GLB 하나가 수십 MB(실측 16.7MB)가 나와 메인화면 로딩에 부담만 준다.
        // curveSeg/facesSeg 둘 다 아주 낮춰도(회전 스윕 각도가 좁아 각짐이 잘 안 보임) 육안상
        // 매끈해 보이는 지점을 실측으로 찾아 정했다 — 최종 GLB 파일 크기까지 재서 다른
        // 갤러리 카드들(2.7KB~448KB)과 비슷한 범위로 맞췄다.
        const CARD_PREVIEW_CURVE_SEGMENTS = 2;
        const CARD_PREVIEW_FACES_SEGMENT = 1;

        // three.js@0.146 GLTFExporter가 geometry.groups(부품별 다른 색)를 가진 멀티머티리얼
        // 메시를 내보낼 때 실제로 겪은 문제 — 그룹별로 인덱스를 제대로 잘라내지 않고, 각
        // 그룹(부품)마다 전체 정점 버퍼를 통째로 복제해버린다(재현/확인: 빨간 텍스트1
        // 파트와 흰색 바닥판 파트의 position 배열이 바이트 단위로 완전히 동일했음 — 즉 6개
        // 부품이 전부 서로 다른 색을 입힌 "전체 모델의 복제본"이 되어, 부품별 union으로
        // 없앤 z-fighting이 이 내보내기 버그 때문에 그대로 되살아난다). geo.groups에 기대지
        // 않고, 우리가 직접 그룹별로 실제 사용되는 정점만 골라내 완전히 독립된 지오메트리
        // 6개로 쪼갠 뒤 내보내면 이 버그를 피해갈 수 있다.
        function splitGeometryByGroups(geo) {
            // ManifoldCore.toBufferGeometry()가 돌려주는 geo는 creaseNormals()가 내부적으로
            // toNonIndexed()로 바꿔버린 뒤라 인덱스가 없다(실제로 겪은 문제 — geo.index가
            // null이라 처음엔 인덱스가 있다고 가정한 코드가 그대로 죽었다) — 그래서 group의
            // start/count는 "인덱스 배열 오프셋"이 아니라 "정점 배열에서 몇 번째 정점부터
            // 몇 개"를 뜻한다. 그 구간을 그대로 잘라내기만 하면 된다(중복 제거 불필요 —
            // non-indexed라 애초에 정점이 삼각형마다 이미 따로 있다).
            const groups = geo.groups && geo.groups.length
                ? geo.groups
                : [{ start: 0, count: geo.attributes.position.count, materialIndex: 0 }];
            const srcPos = geo.attributes.position.array;
            const srcNormal = geo.attributes.normal ? geo.attributes.normal.array : null;

            return groups.map(function (g) {
                const positions = srcPos.slice(g.start * 3, (g.start + g.count) * 3);
                const newGeo = new THREE.BufferGeometry();
                newGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                if (srcNormal) {
                    const normals = srcNormal.slice(g.start * 3, (g.start + g.count) * 3);
                    newGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                }
                return { geo: newGeo, materialIndex: g.materialIndex };
            });
        }

        window.__getFusedPreviewGroup = function (curveSeg, facesSeg) {
            if (!manifoldReady || !text1Font || !text2Font || !text3Font || !emojiFont) return null;
            const params = readParams();
            params.facesSegment = facesSeg !== undefined ? facesSeg : CARD_PREVIEW_FACES_SEGMENT;
            const result = buildFusedColoredSolid(params, curveSeg !== undefined ? curveSeg : CARD_PREVIEW_CURVE_SEGMENTS);
            if (!result) return null;
            const combined = ManifoldCore.toThreeMesh(result.solid, result.idToColor, undefined, { roughness: 0.45, metalness: 0.2, envMapIntensity: 0.55 });
            result.solid.delete();

            const materials = Array.isArray(combined.material) ? combined.material : [combined.material];
            const parts = splitGeometryByGroups(combined.geometry);
            combined.geometry.dispose();

            const group = new THREE.Group();
            parts.forEach(function (part) {
                group.add(new THREE.Mesh(part.geo, materials[part.materialIndex]));
            });
            return group;
        };

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            FontCore.loadFont(EMOJI_FONT_FILE, function (font) { emojiFont = font; updateModel(); });
            onFont1Change();
            onFont2Change();
            onFont3Change();
        }
        main();
    </script>
</body>
</html>
