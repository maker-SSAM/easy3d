<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>갤러리6 - 물결무늬 꽃병 (Manifold-3D) - 초등 파라메트릭 디자인 스튜디오</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/exporters/STLExporter.js"></script>
    <!-- core.js가 PMREMGenerator로 굽는 가상의 방 환경(IBL 반사광) — 재질에 은은한 반사를 준다 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="../assets/js/core.js"></script>
    <!-- 2D 단면 → Manifold-3D 회전체(revolve) → three.js 변환 공용 브릿지. ES 모듈이라
         로딩이 비동기다 — 그래서 아래 페이지 로직 스크립트도 type="module"로 만들어서
         ManifoldCore.ready를 안전하게 await할 수 있게 했다. -->
    <script type="module" src="../assets/js/manifold-core.js"></script>
    <style>
        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: #333; }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .section-label { font-weight: bold; font-size: 0.95em; margin: 18px 0 10px; padding-top: 12px; border-top: 1px solid #e5e5e5; color: #333; }
        .section-label:first-of-type { margin-top: 8px; padding-top: 0; border-top: none; }
    </style>
</head>
<body>

    <script type="module">
        // 갤러리6: 물결무늬 꽃병. thingiverse의 사인파 꽃병 OpenSCAD 디자인(jamcultur, 2021)을
        // 이 프로젝트의 three.js + Manifold-3D 스택으로 포팅했다.
        //
        // 원본 구조: 세로 단면(속이 빈 벽 두께만큼의 리본 모양 + 바닥 사각형)을 하나의 2D
        // 프로파일로 만들고, rotate_extrude()로 360도 통째로 회전시켜 입체로 만든다. 프로파일의
        // x좌표(반지름 방향)에 "높이에 따른 선형 테이퍼 + 사인파" 오프셋을 더해서 물결치는
        // 벽면을 만든다. 갤러리5의 bend_engine과 달리 별도의 축 재배치 회전이 필요 없다 —
        // 원본 프로파일이 이미 (반지름, 높이) 좌표로 짜여 있어서 ManifoldCore.revolveXS()에
        // 그대로 넣을 수 있다(갤러리3 나사통과 동일한 방식). 주의: OpenSCAD의 sin()은 도(degree)
        // 단위라서 JS의 Math.sin(라디안)으로 옮길 때 반드시 (값 * Math.PI/180) 변환이 필요하다.
        //
        // 텍스트나 여러 파츠가 없는 단일 색상 단일 솔리드 디자인이라, 갤러리4/5의
        // "레이어 분리 + 모양/두께 캐시 분리" 같은 최적화 장치는 필요 없다 — 슬라이더가
        // 바뀔 때마다 프로파일을 다시 계산해서 한 번에 revolve하면 충분히 가볍다. 세로/가로
        // 분할 수(slices/circleSegments, 원본의 $fn)는 갤러리2/3/5의 면(facet) 개수 슬라이더와
        // 같은 방침으로 사용자가 직접 조절하는 디자인 파라미터로 노출한다(미리보기/내보내기
        // 해상도를 자동으로 낮추지 않음).
        const shell = ParametricCore.mountEditorShell(document.body);

        const DEFAULTS = {
            height: 100, radius: 25, wallThickness: 2, baseThickness: 2.4,
            scaleTop: 0.7, waves: 1, waveAmplitude: 8, waveStartAngle: 0,
            slices: 100, circleSegments: 180,
            col: '#4fc3f7'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3>물결무늬 꽃병 설정</h3>
            <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;">* 사인파로 물결치는 벽면을 가진 회전체 꽃병입니다. 위쪽이 뚫려있어요.</p>

            <div class="section-label">1. 기본 설정</div>
            <div class="control-group"><label>높이: <span id="valHeight">100</span>mm</label><input type="range" id="height" min="10" max="400" step="1" value="100" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>반지름: <span id="valRadius">25</span>mm</label><input type="range" id="radius" min="10" max="150" step="0.5" value="25" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>벽 두께: <span id="valWallThickness">2</span>mm</label><input type="range" id="wallThickness" min="1" max="10" step="0.1" value="2" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>바닥 두께: <span id="valBaseThickness">2.4</span>mm</label><input type="range" id="baseThickness" min="0" max="10" step="0.1" value="2.4" oninput="scheduleUpdate()"></div>

            <div class="section-label">2. 물결 모양</div>
            <div class="control-group"><label>위쪽 배율: <span id="valScaleTop">0.7</span></label><input type="range" id="scaleTop" min="0.25" max="4" step="0.05" value="0.7" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>물결 개수: <span id="valWaves">1</span></label><input type="range" id="waves" min="0" max="10" step="0.1" value="1" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>물결 진폭: <span id="valWaveAmplitude">8</span>mm</label><input type="range" id="waveAmplitude" min="0" max="25" step="0.1" value="8" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>물결 시작 각도: <span id="valWaveStartAngle">0</span>°</label><input type="range" id="waveStartAngle" min="0" max="360" step="1" value="0" oninput="scheduleUpdate()"></div>

            <div class="section-label">3. 해상도</div>
            <div class="control-group"><label>세로 분할 수: <span id="valSlices">100</span></label><input type="range" id="slices" min="4" max="300" step="1" value="100" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label>가로 분할 수(원 둘레): <span id="valCircleSegments">180</span></label><input type="range" id="circleSegments" min="3" max="180" step="1" value="180" oninput="scheduleUpdate()"></div>

            <div class="section-label">4. 색상</div>
            <div class="color-row"><span>꽃병</span><input type="color" id="col" value="#4fc3f7" oninput="scheduleUpdate()"></div>
        `;

        shell.controlsFooterEl.innerHTML = `
            <button class="download-btn" onclick="downloadSTL()">파일(STL) 다운로드</button>
        `;

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        let currentMesh = null;
        let manifoldReady = false;
        let updateTimer = null;

        function scheduleUpdate() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 100);
        }

        function resetToDefaults() {
            document.getElementById('height').value = DEFAULTS.height;
            document.getElementById('radius').value = DEFAULTS.radius;
            document.getElementById('wallThickness').value = DEFAULTS.wallThickness;
            document.getElementById('baseThickness').value = DEFAULTS.baseThickness;
            document.getElementById('scaleTop').value = DEFAULTS.scaleTop;
            document.getElementById('waves').value = DEFAULTS.waves;
            document.getElementById('waveAmplitude').value = DEFAULTS.waveAmplitude;
            document.getElementById('waveStartAngle').value = DEFAULTS.waveStartAngle;
            document.getElementById('slices').value = DEFAULTS.slices;
            document.getElementById('circleSegments').value = DEFAULTS.circleSegments;
            document.getElementById('col').value = DEFAULTS.col;
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            updateModel();
        }

        // ---------- 실제 모델링 ----------
        // 원본 draw_profile()의 point 생성 로직을 그대로 옮긴 것 — i=0..slices는 안쪽 벽(아래→위),
        // i=slices+1..slices*2+1은 바깥쪽 벽(위→아래)을 그려서 벽 두께만큼의 리본 모양 폐곡선을
        // 만든다. offset()이 테이퍼(선형)+사인파를 더해 물결치는 반지름을 만든다.
        function buildProfileContours(p) {
            const slicesPerMm = p.slices / p.height;
            const offsetPerMm = (p.scaleTop - 1) * p.radius / p.height;

            function offsetAt(y) {
                const wavePhaseDeg = (y / p.height) * (360 * p.waves) + p.waveStartAngle;
                return y * offsetPerMm + Math.sin(wavePhaseDeg * Math.PI / 180) * p.waveAmplitude;
            }
            function xAt(i) { return i > p.slices ? p.wallThickness : 0; }
            function yAt(i) { return i > p.slices ? p.height - ((i - p.slices - 1) / slicesPerMm) : i / slicesPerMm; }

            const shiftX = p.radius - p.wallThickness; // 원본의 translate([radius-wall_thickness,0,0])
            const wallPoints = [];
            for (let i = 0; i <= p.slices * 2 + 1; i++) {
                const y = yAt(i);
                const x = xAt(i) + offsetAt(y);
                wallPoints.push([x + shiftX, y]);
            }

            const contours = [wallPoints];
            if (p.baseThickness > 0) {
                // 원본의 square([radius+x(0)+offset(0), base_thickness]) — x(0)은 항상 0.
                const baseWidth = p.radius + offsetAt(0);
                contours.push([[0, 0], [baseWidth, 0], [baseWidth, p.baseThickness], [0, p.baseThickness]]);
            }
            return contours;
        }

        // 여러 폐곡선을 한 CrossSection에 함께 넣으면(NonZero 규칙) 자동으로 합쳐진다 — 글자
        // 윤곽선(자모별 여러 하위경로)을 다룰 때와 동일한 방식이라 별도 union 호출이 필요 없다.
        function buildVaseSolid(p) {
            const contours = buildProfileContours(p);
            const xs = ManifoldCore.contoursToXS(contours);
            if (!xs) return null;
            const revolved = ManifoldCore.revolveXS(xs, p.circleSegments, 360);
            xs.delete();
            const yUp = ManifoldCore.toYUp(revolved);
            revolved.delete();
            return yUp;
        }

        function meshFromSolid(solid, color) {
            if (!solid) return null;
            const buf = ManifoldCore.toBufferGeometry(solid);
            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({
                color: color, metalness: 0.2, roughness: 0.45, envMapIntensity: 0.55
            }));
            mesh.castShadow = false;
            mesh.receiveShadow = false;
            return mesh;
        }

        function disposeCurrentMesh() {
            if (!currentMesh) return;
            scene.remove(currentMesh);
            currentMesh.geometry.dispose();
            currentMesh.material.dispose();
            currentMesh = null;
        }

        function readParams() {
            return {
                height: parseFloat(document.getElementById('height').value),
                radius: parseFloat(document.getElementById('radius').value),
                wallThickness: parseFloat(document.getElementById('wallThickness').value),
                baseThickness: parseFloat(document.getElementById('baseThickness').value),
                scaleTop: parseFloat(document.getElementById('scaleTop').value),
                waves: parseFloat(document.getElementById('waves').value),
                waveAmplitude: parseFloat(document.getElementById('waveAmplitude').value),
                waveStartAngle: parseFloat(document.getElementById('waveStartAngle').value),
                slices: parseInt(document.getElementById('slices').value, 10),
                circleSegments: parseInt(document.getElementById('circleSegments').value, 10),
                col: document.getElementById('col').value
            };
        }

        function updateModel() {
            if (!manifoldReady) return;
            const p = readParams();

            [
                ['valHeight', p.height], ['valRadius', p.radius], ['valWallThickness', p.wallThickness], ['valBaseThickness', p.baseThickness],
                ['valScaleTop', p.scaleTop], ['valWaves', p.waves], ['valWaveAmplitude', p.waveAmplitude], ['valWaveStartAngle', p.waveStartAngle],
                ['valSlices', p.slices], ['valCircleSegments', p.circleSegments]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });

            let solid;
            try {
                solid = buildVaseSolid(p);
            } catch (err) {
                console.error('꽃병 생성 실패:', err);
                solid = null;
            }

            disposeCurrentMesh();
            if (!solid) return;

            currentMesh = meshFromSolid(solid, p.col);
            solid.delete();
            scene.add(currentMesh);
        }

        function downloadSTL() {
            if (!manifoldReady) return;
            const p = readParams();

            let solid;
            try {
                solid = buildVaseSolid(p);
            } catch (err) {
                console.error('STL 생성 실패:', err);
                return;
            }
            if (!solid) return;

            const buf = ManifoldCore.toBufferGeometry(solid);
            solid.delete();

            const mesh = new THREE.Mesh(buf.geo, new THREE.MeshStandardMaterial({ color: p.col }));
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            ParametricCore.exportSTL(exportGroup, 'wave_vase.stl');

            mesh.geometry.dispose();
            mesh.material.dispose();
        }

        window.scheduleUpdate = scheduleUpdate;
        window.downloadSTL = downloadSTL;

        async function main() {
            await ManifoldCore.ready;
            manifoldReady = true;
            updateModel();
        }
        main();
    </script>
</body>
</html>
