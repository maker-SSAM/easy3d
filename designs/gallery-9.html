           넓어진다(width: max-content, 칸보다 짧으면 min-width로 칸을 채움). 이렇게 해야 긴 줄이
           칸 밖으로 넘칠 때도 정렬이 "보이는 칸 너비"가 아니라 "가장 긴 줄" 기준이 되어,
           측정용 상자(#layoutProbe)·입체와 같은 모양이 된다. */
        .text-box-wrap {
            min-height: 90px; max-height: 260px; overflow: auto;
            box-sizing: border-box; width: 100%;
            border: 1px solid var(--input-border); border-radius: 6px;

        }
        .text-box-wrap:focus-within { border-color: #1e88e5; }
        .text-box {
            width: max-content; min-width: 100%; min-height: 88px;

            color: var(--text-color);

        .align-row { display: flex; gap: 6px; margin-bottom: 14px; }

        }

        /* 측정용 상자: 화면 밖에 두고, 글자 위치(배치)를 읽는 데만 쓴다. */

    <script type="module">
        // 갤러리9(시험판, 2026-11-23): "글상자" 이름표. 갤러리5는 한 줄 입력이지만, 여기서는
        // 여러 줄을 입력하고 정렬(왼쪽·가운데·오른쪽)·줄 간격·자간을 정할 수 있게 한다.
        //
        // 핵심 방법 — 배치는 브라우저에게 맡긴다:
        //   1) 같은 TTF 파일을 CSS 글꼴(FontFace)로도 불러온다.
        //   2) 화면 밖의 측정용 상자(#layoutProbe)에 같은 글을 1mm = PROBE_PX_PER_MM px 비율로 그린다.
        //      줄마다 맨 앞에 높이 0짜리 표시(.bl)를 둬서 그 줄의 기준선 위치를 읽는다.
        //   3) 글자 하나하나의 실제 위치(Range.getClientRects)를 읽어, 그 자리에 opentype.js로 뽑은
        //      그 글자의 윤곽선을 놓는다. → 줄바꿈·정렬·자간·커닝이 화면과 같은 규칙으로 들어간다.
        //   4) 그 뒤(바닥판·외곽선·테두리·층 쌓기·내보내기)는 갤러리5와 같다.
        // 다음 단계(블록별 크기·글씨체)도 같은 방법으로 넓힐 수 있는지 보려는 시험판이다.
        const shell = ParametricCore.mountEditorShell(document.body, null, {
            sourceUrl: 'https://makerworld.com/ko/models/2640504-parametric-name-tag-keychain-with-korean-input#profileId-2917401',
            licenseType: 'BY-SA'
        });

        const FONT_OPTIONS = FontList.OPTIONS;
        const DEFAULT_FONT_INDEX = FONT_OPTIONS.findIndex(f => f.file === 'Cafe24PROUP.ttf');
        const EMOJI_FONT_FILE = FontList.EMOJI_FILE;
        const FONTS_BASE = '../assets/fonts/';
        const PROBE_PX_PER_MM = 10; // 측정용 상자 배율 — 크게 그려서 반올림 오차를 줄인다

        const DEFAULTS = {
            text: '이름표\n두 줄도 돼요 🙂', fontIndex: DEFAULT_FONT_INDEX, align: 'center',
            fontSize: 8, lineHeight: 1.2, letterSpacing: 0, fontWeight: 0,
            outlineW: 0.3, borderW: 1.0, innerMargin: 1.5, outerMargin: 1.0,
            keyringOn: false, keyringX: -25, keyringY: 0, keyringHoleSize: 3.5, keyringRim: 1.0,
            baseThick: 3.0, outlineThick: 0.4, borderThick: 0.6, textThick: 0.8,
            colBase: '#ffffff', colOutline: '#ff9a5b', colBorder: '#000000', colText: '#ff5703'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3 data-i18n-en="Text Box Name Tag (test)">글상자 이름표 (시험판)</h3>
            <p class="test-note" data-i18n-en="Test version: type several lines in the box, then choose alignment, line spacing and letter spacing. Press Enter to start a new line.">시험판입니다. 글상자에 여러 줄을 입력하고 정렬·줄 간격·자간을 골라 보세요. 줄은 Enter로 바꿉니다.</p>

            <div class="section-label" data-i18n-en="1. Text box">1. 글상자</div>
            <div class="control-group">
                <div class="text-box-wrap" id="textBoxWrap"><div id="textBox" class="text-box" contenteditable="plaintext-only" spellcheck="false"></div></div>
            </div>
            <div class="align-row" id="alignRow">
                <button type="button" data-align="left" data-i18n-en="Left">왼쪽</button>
                <button type="button" data-align="center" data-i18n-en="Center">가운데</button>
                <button type="button" data-align="right" data-i18n-en="Right">오른쪽</button>
            </div>
            <div class="control-group">
                <label data-i18n-en="Choose font">글씨체 선택</label>
                <select id="fontSelect" onchange="onFontChange()">
                    ${FONT_OPTIONS.map((f, i) => `<option value="${i}"${i === DEFAULT_FONT_INDEX ? ' selected' : ''}>${f.label}</option>`).join('')}
                </select>
            </div>
            <div class="control-group"><label><span data-i18n-en="Font size">글자 크기</span>: <span id="valFontSize">8</span>mm</label><input type="range" id="fontSize" min="3" max="30" step="0.5" value="8" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Line spacing">줄 간격</span>: <span id="valLineHeight">1.2</span></label><input type="range" id="lineHeight" min="0.7" max="2.5" step="0.05" value="1.2" oninput="onLayoutStyleChange()"></div>
            <div class="control-group"><label><span data-i18n-en="Letter spacing">자간</span>: <span id="valLetterSpacing">0</span></label><input type="range" id="letterSpacing" min="-0.2" max="0.8" step="0.02" value="0" oninput="onLayoutStyleChange()"></div>
            <div class="control-group"><label><span data-i18n-en="Font weight">글자 굵기</span>: <span id="valFontWeight">0</span></label><input type="range" id="fontWeight" min="-1" max="2" step="0.1" value="0" oninput="scheduleUpdate()"></div>

            <div class="section-label" data-i18n-en="2. Design details">2. 디자인 디테일</div>
            <div class="control-group"><label><span data-i18n-en="Text outline thickness">글자 외곽선 두께</span>: <span id="valOutlineW">0.3</span>mm</label><input type="range" id="outlineW" min="0" max="2" step="0.05" value="0.3" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Border thickness">테두리 두께</span>: <span id="valBorderW">1.0</span>mm</label><input type="range" id="borderW" min="0" max="5" step="0.1" value="1.0" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Text-to-border gap">글자-테두리 간격</span>: <span id="valInnerMargin">1.5</span>mm</label><input type="range" id="innerMargin" min="0" max="5" step="0.1" value="1.5" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Outer margin">바깥 여백</span>: <span id="valOuterMargin">1.0</span>mm</label><input type="range" id="outerMargin" min="0" max="5" step="0.1" value="1.0" oninput="scheduleUpdate()"></div>

            <div class="section-label" data-i18n-en="3. Keyring hole">3. 키링 구멍</div>
            <div class="check-row"><input type="checkbox" id="keyringOn" onchange="scheduleUpdate()"><label for="keyringOn" data-i18n-en="Enable keyring hole">키링 구멍 사용</label></div>
            <div class="control-group"><label><span data-i18n-en="Hole X position">구멍 X 위치</span>: <span id="valKeyringX">-25</span>mm</label><input type="range" id="keyringX" min="-60" max="60" step="0.5" value="-25" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Hole Y position">구멍 Y 위치</span>: <span id="valKeyringY">0</span>mm</label><input type="range" id="keyringY" min="-40" max="40" step="0.5" value="0" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Hole diameter">구멍 지름</span>: <span id="valKeyringHoleSize">3.5</span>mm</label><input type="range" id="keyringHoleSize" min="2" max="8" step="0.5" value="3.5" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Hole rim thickness">구멍 테두리 두께</span>: <span id="valKeyringRim">1.0</span>mm</label><input type="range" id="keyringRim" min="0.5" max="3" step="0.1" value="1.0" oninput="scheduleUpdate()"></div>

            <div class="section-label" data-i18n-en="4. Layer heights">4. 층 높이</div>
            <div class="control-group"><label><span data-i18n-en="Base plate thickness">바닥판 두께</span>: <span id="valBaseThick">3.0</span>mm</label><input type="range" id="baseThick" min="1" max="6" step="0.2" value="3.0" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Outline layer height">외곽선 층 높이</span>: <span id="valOutlineThick">0.4</span>mm</label><input type="range" id="outlineThick" min="0.1" max="2" step="0.1" value="0.4" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Border layer height">테두리 층 높이</span>: <span id="valBorderThick">0.6</span>mm</label><input type="range" id="borderThick" min="0.1" max="2" step="0.1" value="0.6" oninput="scheduleUpdate()"></div>
            <div class="control-group"><label><span data-i18n-en="Text height">글자 높이</span>: <span id="valTextThick">0.8</span>mm</label><input type="range" id="textThick" min="0.1" max="3" step="0.1" value="0.8" oninput="scheduleUpdate()"></div>

            <div class="section-label" data-i18n-en="5. Colors">5. 색상</div>
            <div class="color-row"><span data-i18n-en="Base plate">바닥판</span><input type="color" id="colBase" value="#ffffff" oninput="scheduleUpdate()"></div>
            <div class="color-row"><span data-i18n-en="Outline">외곽선</span><input type="color" id="colOutline" value="#ff9a5b" oninput="scheduleUpdate()"></div>
            <div class="color-row"><span data-i18n-en="Border">테두리</span><input type="color" id="colBorder" value="#000000" oninput="scheduleUpdate()"></div>
            <div class="color-row"><span data-i18n-en="Text">글자</span><input type="color" id="colText" value="#ff5703" oninput="scheduleUpdate()"></div>
        `;

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);
        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });
        if (window.LangCore) window.LangCore.applyTranslations(document);

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        const textBox = document.getElementById('textBox');
        const probe = document.createElement('div');
        probe.id = 'layoutProbe';
        probe.setAttribute('aria-hidden', 'true');
        document.body.appendChild(probe);

        let currentGroup = null;
        let currentMeshes = {};
        let lastGeometryFingerprint = null;
        let manifoldReady = false;
        let textFont = null;
        let emojiFont = null;
        let cssFontReady = false; // 글상자·측정용 상자에 쓸 CSS 글꼴(FontFace)이 준비됐는지
        let currentFontFile = FONT_OPTIONS[DEFAULT_FONT_INDEX].file;
        let currentAlign = DEFAULTS.align;
        let updateTimer = null;
        let fontLoadSeq = 0; // 글씨체를 빠르게 여러 번 바꿀 때 늦게 끝난 옛 요청을 무시하려고

        function scheduleUpdate() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 120);
        }

        // 글상자 자체도 정렬·줄 간격·자간을 그대로 보여 준다(입력하는 모습 = 결과 배치).
        function applyBoxStyle() {
            textBox.style.textAlign = currentAlign;
            textBox.style.lineHeight = document.getElementById('lineHeight').value;
            textBox.style.letterSpacing = document.getElementById('letterSpacing').value + 'em';
            document.querySelectorAll('#alignRow button').forEach(function (b) {
                b.classList.toggle('active', b.dataset.align === currentAlign);
            });
        }
        function onLayoutStyleChange() { applyBoxStyle(); scheduleUpdate(); }

        document.querySelectorAll('#alignRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentAlign = b.dataset.align; onLayoutStyleChange(); });
        });
        textBox.addEventListener('input', scheduleUpdate);
        // 틀의 빈 곳(스크롤 막대 옆 등)을 눌러도 입력칸으로 들어가게
        document.getElementById('textBoxWrap').addEventListener('mousedown', function (e) {
            if (e.target === this) { e.preventDefault(); textBox.focus(); }
        });

        // 같은 TTF를 CSS 글꼴로 등록한다 — opentype.js(윤곽선)와 브라우저(배치)가 같은 파일을 쓰게.
        // 'G9Text' 이름에는 지금 고른 글씨체 하나만 올려 둔다(전에 고른 것과 섞이지 않게).
        // 한 번 불러온 글꼴은 저장해 두고 다시 고르면 바꿔 끼우기만 한다.
        const textFaceCache = {};
        let activeTextFace = null;
        function setTextCssFont(file) {
            if (!textFaceCache[file]) {
                textFaceCache[file] = new FontFace('G9Text', 'url(' + FONTS_BASE + encodeURI(file) + ')').load();
            }
            return textFaceCache[file].then(function (face) {
                if (activeTextFace && activeTextFace !== face) document.fonts.delete(activeTextFace);
                if (!document.fonts.has(face)) document.fonts.add(face);
                activeTextFace = face;
                return face;
            });
        }
        const emojiCssFontReady = new FontFace('G9Emoji', 'url(' + FONTS_BASE + encodeURI(EMOJI_FONT_FILE) + ')').load()
            .then(function (face) { document.fonts.add(face); return face; });

        function onFontChange() {
            const select = document.getElementById('fontSelect');
            currentFontFile = FONT_OPTIONS[select.value].file;
            const seq = ++fontLoadSeq;
            cssFontReady = false;
            let gotGlyphFont = false, gotCssFont = false, glyphFont = null;
            function done() {
                if (seq !== fontLoadSeq || !gotGlyphFont || !gotCssFont) return;
                textFont = glyphFont;
                cssFontReady = true;
                lastGeometryFingerprint = null;
                updateModel();
            }
            FontCore.loadFont(currentFontFile, function (font) { glyphFont = font; gotGlyphFont = true; done(); });
            Promise.all([setTextCssFont(currentFontFile), emojiCssFontReady]).then(function () { gotCssFont = true; done(); })
                .catch(function (err) { console.error('CSS 글꼴 로딩 실패:', err); });
        }

        function setBoxText(text) {
            textBox.textContent = text;
        }

        // contenteditable의 글을 줄 배열로 읽는다. 브라우저가 끝에 덧붙이는 빈 줄 하나는 버린다.
        function readLines() {
            let t = textBox.innerText.replace(/\r/g, '');
            if (t.endsWith('\n')) t = t.slice(0, -1);
            return t.split('\n');
        }

        function resetToDefaults() {
            setBoxText(DEFAULTS.text);
            currentAlign = DEFAULTS.align;
            document.getElementById('fontSelect').value = DEFAULTS.fontIndex;
            ['fontSize', 'lineHeight', 'letterSpacing', 'fontWeight', 'outlineW', 'borderW', 'innerMargin', 'outerMargin',
             'keyringX', 'keyringY', 'keyringHoleSize', 'keyringRim', 'baseThick', 'outlineThick', 'borderThick', 'textThick',
             'colBase', 'colOutline', 'colBorder', 'colText'].forEach(function (id) {
                document.getElementById(id).value = DEFAULTS[id];
            });
            document.getElementById('keyringOn').checked = DEFAULTS.keyringOn;
            applyBoxStyle();
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            onFontChange();
        }

        // ---------- 배치: 측정용 상자에서 글자 위치 읽기 ----------
        // 돌려주는 값: [{ ch, x, y }] — x는 글자 원점(왼쪽), y는 기준선. 단위 mm, y는 위쪽이 +.
        function measureLayout(p) {
            const px = PROBE_PX_PER_MM;
            probe.style.fontSize = (p.fontSize * px) + 'px';
            probe.style.lineHeight = String(p.lineHeight);
            probe.style.letterSpacing = p.letterSpacing + 'em';
            probe.style.textAlign = p.align;
            probe.textContent = '';
            const lineEls = p.lines.map(function (line) {
                const div = document.createElement('div');
                const marker = document.createElement('span');
                marker.className = 'bl';
                div.appendChild(marker);
                const tn = document.createTextNode(line);
                div.appendChild(tn);
                probe.appendChild(div);
                return { marker: marker, tn: tn, text: line };
            });
            const box = probe.getBoundingClientRect();
            const placed = [];
            const range = document.createRange();
            lineEls.forEach(function (le) {
                const baseline = le.marker.getBoundingClientRect().bottom;
                let i = 0;
                const s = le.text;
                while (i < s.length) {
                    const cp = s.codePointAt(i);
                    const len = cp > 0xffff ? 2 : 1;
                    const ch = s.substr(i, len);
                    range.setStart(le.tn, i);
                    range.setEnd(le.tn, i + len);
                    const rects = range.getClientRects();
                    if (rects.length && !/\s/.test(ch)) {
                        placed.push({
                            ch: ch,
                            x: (rects[0].left - box.left) / px,
                            y: -(baseline - box.top) / px
                        });
                    }
                    i += len;
                }
            });
            return placed;
        }

        // 이모지의 모양 바꿈 기호(U+FE0E/FE0F)·잇기 기호(U+200D)처럼 그릴 모양이 없는 글자는 건너뛴다.
        function isInvisibleMark(ch) {
            const cp = ch.codePointAt(0);
            return (cp >= 0xfe00 && cp <= 0xfe0f) || cp === 0x200d || cp === 0x20e3;
        }

        function buildTextContours(p, curveSegments) {
            const placed = measureLayout(p);
            const fallback = { file: EMOJI_FONT_FILE, font: emojiFont };
            const contours = [];
            placed.forEach(function (g) {
                if (isInvisibleMark(g.ch)) return;
                const shape = FontCore.getGlyphShape(p.fontFile, textFont, g.ch, p.fontSize, curveSegments, fallback);
                shape.contours.forEach(function (pts) {
                    contours.push(pts.map(function (q) { return [q[0] + g.x, q[1] + g.y]; }));
                });
            });
            if (!contours.length) return contours;
            // 전체를 가운데(0,0)로 옮긴다 — 키링 구멍 위치 기준을 갤러리5와 같게.
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            contours.forEach(function (pts) {
                pts.forEach(function (q) {
                    if (q[0] < minX) minX = q[0]; if (q[0] > maxX) maxX = q[0];
                    if (q[1] < minY) minY = q[1]; if (q[1] > maxY) maxY = q[1];
                });
            });
            const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            contours.forEach(function (pts) { pts.forEach(function (q) { q[0] -= cx; q[1] -= cy; }); });
            return contours;
        }

        // ---------- 모델링 (갤러리5와 같은 층 구조) ----------
        const PREVIEW_CURVE_SEGMENTS = 16;
        const EXPORT_CURVE_SEGMENTS = 48;

        function buildShapes(p, curveSegments) {
            const scratch = [];
            function track(m) { scratch.push(m); return m; }

            let textXS = null;
            const textContours = buildTextContours(p, curveSegments);
            if (textContours.length) {
                textXS = track(ManifoldCore.contoursToXS(textContours));
                if (Math.abs(p.fontWeight) > 0.001) textXS = track(textXS.offset(p.fontWeight));
            }
            const masterXS = textXS;

            let masterWithRing = masterXS;
            if (p.keyringOn) {
                let ringXS = track(ManifoldCore.circleXS(p.keyringHoleSize / 2 + p.keyringRim, 48));
                ringXS = track(ringXS.translate([p.keyringX, p.keyringY]));
                masterWithRing = masterXS ? track(masterXS.add(ringXS)) : ringXS;
            }
            if (!masterWithRing) return null;

            // 둥근 모서리 조각 수(원 한 바퀴 기준) — 갤러리5와 같음. 미리보기는 덜, 내보내기는 촘촘하게.
            const offsetSegs = curveSegments >= EXPORT_CURVE_SEGMENTS ? 256 : 96;
            function grow(xs, delta) { return track(xs.offset(delta, 'Round', 2, offsetSegs)); }

            const outlineXS = masterXS ? grow(masterXS, p.outlineW) : null;

            // 바닥판·테두리는 바깥 실루엣 한 바퀴만 따라간다(갤러리5 2026-11-23 고침과 같음):
            // 안쪽 구멍 윤곽선(넓이 −)은 버려 메운다.
            function signedArea(poly) {
                let s = 0;
                for (let i = 0; i < poly.length; i++) {
                    const a = poly[i], b = poly[(i + 1) % poly.length];
                    s += a[0] * b[1] - b[0] * a[1];
                }
                return s / 2;
            }
            function fillHoles(xs) {
                if (!xs || xs.isEmpty()) return xs;
                const outers = xs.toPolygons().filter(function (poly) { return signedArea(poly) > 0; });
                if (!outers.length) return xs;
                return track(ManifoldCore.contoursToXS(outers));
            }

            // 테두리 = 안쪽을 메운 바깥 실루엣 − 그 실루엣을 테두리 두께만큼 안으로 줄인 것(갤러리5와 같음,
            // 안쪽에서 바깥으로 쌓는 방식을 쓰지 않은 이유도 갤러리5 주석 참고). 바닥판은 글자에서 한 번에.
            const borderOuterXS = fillHoles(grow(masterWithRing, p.outlineW + p.innerMargin + p.borderW));
            const borderInnerXS = p.borderW > 0 ? grow(borderOuterXS, -p.borderW) : borderOuterXS;
            const borderRingXS = track(borderOuterXS.subtract(borderInnerXS));
            const baseXS = fillHoles(grow(masterWithRing, p.outlineW + p.innerMargin + p.borderW + p.outerMargin));

            let holeXS = null;
            if (p.keyringOn) {
                holeXS = track(ManifoldCore.circleXS(p.keyringHoleSize / 2, 48));
                holeXS = track(holeXS.translate([p.keyringX, p.keyringY]));
            }

            const keep = new Set([textXS, outlineXS, baseXS, borderRingXS, holeXS].filter(Boolean));
            scratch.forEach(function (m) { if (m && !keep.has(m) && typeof m.delete === 'function') m.delete(); });
            return { textXS: textXS, outlineXS: outlineXS, baseXS: baseXS, borderRingXS: borderRingXS, holeXS: holeXS };
        }

        function disposeShapes(shapes) {
            if (!shapes) return;
            ['textXS', 'outlineXS', 'baseXS', 'borderRingXS', 'holeXS'].forEach(function (key) {
                const xs = shapes[key];
                if (xs && typeof xs.delete === 'function') xs.delete();
            });
        }

        let shapeCache = null;
        function getPreviewShapes(p, shapeFp) {
            if (shapeCache && shapeCache.fingerprint === shapeFp) return shapeCache.shapes;
            if (shapeCache) disposeShapes(shapeCache.shapes);
            shapeCache = null;
            let shapes;
            try {
                shapes = buildShapes(p, PREVIEW_CURVE_SEGMENTS);
            } catch (err) {
                console.error('도형 생성 실패:', err);
                return null;
            }
            if (shapes) shapeCache = { fingerprint: shapeFp, shapes: shapes };
            return shapes;
        }

        function buildPreviewMeshes(p, shapeFp) {
            const shapes = getPreviewShapes(p, shapeFp);
            if (!shapes) return null;
            const layerDefs = [
                { name: 'base', xs: shapes.baseXS, height: p.baseThick, color: p.colBase, skipY: true },
                { name: 'outline', xs: shapes.outlineXS, height: p.outlineThick, color: p.colOutline },
                { name: 'border', xs: shapes.borderRingXS, height: p.borderThick, color: p.colBorder },
                { name: 'text', xs: shapes.textXS, height: p.textThick, color: p.colText }
            ];
            const owned = [];
            function own(m) { owned.push(m); return m; }
            let holeCylPositioned = null;
            if (shapes.holeXS) {
                const holeCyl = own(ManifoldCore.extrudeXS(shapes.holeXS, p.baseThick + p.borderThick + 2));
                holeCylPositioned = own(ManifoldCore.translateY(holeCyl, -1));
            }
            const meshes = [];
            layerDefs.forEach(function (def) {
                if (!def.xs || def.xs.isEmpty()) return;
                let solid = own(ManifoldCore.extrudeXS(def.xs, def.height));
                if (!def.skipY) solid = own(ManifoldCore.translateY(solid, p.baseThick));
                const idToColor = new Map([[solid.originalID(), def.color]]);
                let finalSolid = solid;
                let cutResult = null;
                if (holeCylPositioned) {
                    idToColor.set(holeCylPositioned.originalID(), def.color);
                    cutResult = ManifoldCore.subtract(solid, holeCylPositioned);
                    finalSolid = cutResult;
                }
                const mesh = ManifoldCore.toThreeMesh(finalSolid, idToColor, def.color);
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                mesh.userData.layerName = def.name;
                meshes.push(mesh);
                if (cutResult) cutResult.delete();
            });
            owned.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); });
            return meshes.length ? meshes : null;
        }

        function buildFusedSolid(p, track) {
            const shapes = buildShapes(p, EXPORT_CURVE_SEGMENTS);
            if (!shapes) return null;
            const idToColor = new Map();
            const parts = [];
            function extrudeAndStack(xs, height, color) {
                // 빈 단면을 압출하면 Manifold가 InvalidConstruction을 내서 union 전체가 비므로 건너뛴다.
                if (!xs || xs.isEmpty()) return;
                const solid = track(ManifoldCore.extrudeXS(xs, height));
                idToColor.set(solid.originalID(), color);
                parts.push(track(ManifoldCore.translateY(solid, p.baseThick)));
            }
            if (shapes.baseXS && !shapes.baseXS.isEmpty()) {
                const baseSolid = track(ManifoldCore.extrudeXS(shapes.baseXS, p.baseThick));
                idToColor.set(baseSolid.originalID(), p.colBase);
                parts.push(baseSolid);
            }
            extrudeAndStack(shapes.outlineXS, p.outlineThick, p.colOutline);
            extrudeAndStack(shapes.borderRingXS, p.borderThick, p.colBorder);
            extrudeAndStack(shapes.textXS, p.textThick, p.colText);

            let holeCylPositioned = null;
            if (shapes.holeXS) {
                const holeCyl = track(ManifoldCore.extrudeXS(shapes.holeXS, p.baseThick + p.borderThick + 2));
                idToColor.set(holeCyl.originalID(), p.colBase);
                holeCylPositioned = track(ManifoldCore.translateY(holeCyl, -1));
            }
            disposeShapes(shapes);
            if (!parts.length) return null;
            let fused = parts[0];
            for (let i = 1; i < parts.length; i++) fused = track(ManifoldCore.union(fused, parts[i]));
            if (holeCylPositioned) fused = track(ManifoldCore.subtract(fused, holeCylPositioned));
            return { fused: fused, idToColor: idToColor };
        }

        function disposeCurrentThreeMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(function (obj) {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
            currentMeshes = {};
        }

        function num(id) { return parseFloat(document.getElementById(id).value); }

        function readParams() {
            return {
                lines: readLines(), align: currentAlign, fontFile: currentFontFile,
                fontSize: num('fontSize'), lineHeight: num('lineHeight'), letterSpacing: num('letterSpacing'),
                fontWeight: num('fontWeight'),
                outlineW: num('outlineW'), borderW: num('borderW'), innerMargin: num('innerMargin'), outerMargin: num('outerMargin'),
                keyringOn: document.getElementById('keyringOn').checked,
                keyringX: num('keyringX'), keyringY: num('keyringY'), keyringHoleSize: num('keyringHoleSize'), keyringRim: num('keyringRim'),
                baseThick: num('baseThick'), outlineThick: num('outlineThick'), borderThick: num('borderThick'), textThick: num('textThick'),
                colBase: document.getElementById('colBase').value,
                colOutline: document.getElementById('colOutline').value,
                colBorder: document.getElementById('colBorder').value,
                colText: document.getElementById('colText').value
            };
        }

        function shapeFingerprint(p) {
            return JSON.stringify({
                lines: p.lines, align: p.align, fontFile: p.fontFile,
                fontSize: p.fontSize, lineHeight: p.lineHeight, letterSpacing: p.letterSpacing, fontWeight: p.fontWeight,
                outlineW: p.outlineW, borderW: p.borderW, innerMargin: p.innerMargin, outerMargin: p.outerMargin,
                keyringOn: p.keyringOn, keyringX: p.keyringX, keyringY: p.keyringY, keyringHoleSize: p.keyringHoleSize, keyringRim: p.keyringRim
            });
        }
        function geometryFingerprint(p) {
            return shapeFingerprint(p) + '|' + JSON.stringify({
                baseThick: p.baseThick, outlineThick: p.outlineThick, borderThick: p.borderThick, textThick: p.textThick
            });
        }

        const LAYER_COLOR_KEYS = { base: 'colBase', outline: 'colOutline', border: 'colBorder', text: 'colText' };
        function applyColorsOnly(params) {
            Object.keys(LAYER_COLOR_KEYS).forEach(function (name) {
                const mesh = currentMeshes[name];
                if (!mesh) return;
                const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                mats.forEach(function (m) { m.color.set(params[LAYER_COLOR_KEYS[name]]); });
            });
        }

        function isReady() { return manifoldReady && textFont && emojiFont && cssFontReady; }

        function updateModel() {
            if (!isReady()) return;
            const params = readParams();
            [
                ['valFontSize', params.fontSize], ['valLineHeight', params.lineHeight],
                ['valLetterSpacing', params.letterSpacing], ['valFontWeight', params.fontWeight],
                ['valOutlineW', params.outlineW], ['valBorderW', params.borderW],
                ['valInnerMargin', params.innerMargin], ['valOuterMargin', params.outerMargin],
                ['valKeyringX', params.keyringX], ['valKeyringY', params.keyringY],
                ['valKeyringHoleSize', params.keyringHoleSize], ['valKeyringRim', params.keyringRim],
                ['valBaseThick', params.baseThick], ['valOutlineThick', params.outlineThick],
                ['valBorderThick', params.borderThick], ['valTextThick', params.textThick]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });

            const fingerprint = geometryFingerprint(params);
            if (currentGroup && fingerprint === lastGeometryFingerprint) {
                applyColorsOnly(params);
                return;
            }
            const meshes = buildPreviewMeshes(params, shapeFingerprint(params));
            disposeCurrentThreeMesh();
            if (!meshes) { lastGeometryFingerprint = null; return; }
            currentGroup = new THREE.Group();
            currentMeshes = {};
            meshes.forEach(function (mesh) {
                currentGroup.add(mesh);
                currentMeshes[mesh.userData.layerName] = mesh;
            });
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
            lastGeometryFingerprint = fingerprint;
        }

        function fileBaseName(params) {
            const first = (params.lines.find(function (l) { return l.trim(); }) || '').trim();
            return (first || LangCore.pick('글상자', 'textbox')).replace(/[\\/:*?"<>|]/g, '').slice(0, 20);
        }

        function exportWith(kind) {
            if (!isReady()) return;
            const params = readParams();
            const scratch = [];
            function track(m) { scratch.push(m); return m; }
            function cleanup() { scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); }); }
            let result;
            try {
                result = buildFusedSolid(params, track);
            } catch (err) {
                console.error(kind + ' 생성 실패:', err);
                cleanup();
                return;
            }
            if (!result) { cleanup(); return; }
            const mesh = ManifoldCore.toThreeMesh(result.fused, result.idToColor);
            cleanup();
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            const name = fileBaseName(params);
            if (kind === 'STL') ParametricCore.exportSTL(exportGroup, LangCore.pick(`${name}_이름표.stl`, `${name}_nametag.stl`));
            else ThreeMFCore.export3MF(exportGroup, LangCore.pick(`${name}_이름표.3mf`, `${name}_nametag.3mf`));
            mesh.geometry.dispose();
            (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(function (m) { m.dispose(); });
        }
        function downloadSTL() { exportWith('STL'); }
        function download3MF() { exportWith('3MF'); }

        window.scheduleUpdate = scheduleUpdate;
        window.onFontChange = onFontChange;
        window.onLayoutStyleChange = onLayoutStyleChange;
        window.download3MF = download3MF;
        window.downloadSTL = downloadSTL;
        window.__getPreviewGroup = function () { return currentGroup; };
        // 시험용: 측정한 글자 위치를 바깥에서 볼 수 있게(화면과 입체가 맞는지 확인할 때만 씀).
        window.__measureLayout = function () { return measureLayout(readParams()); };

        async function main() {
            setBoxText(DEFAULTS.text);
            applyBoxStyle();
            await ManifoldCore.ready;
            manifoldReady = true;
            FontCore.loadFont(EMOJI_FONT_FILE, function (font) {
                emojiFont = font;
                updateModel();
            });
            onFontChange();
        }
        main();
    </script>
