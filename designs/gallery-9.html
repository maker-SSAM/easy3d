        .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .color-row span { font-size: 0.9em; color: var(--text-color); }
        .color-row input[type="color"] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; }
        .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .check-row label { font-size: 0.95em; }
        .section-label { font-weight: bold; font-size: 0.95em; margin: 18px 0 10px; padding-top: 12px; border-top: 1px solid var(--panel-border); color: var(--text-color); }
        .section-label:first-of-type { margin-top: 8px; padding-top: 0; border-top: none; }
        /* 글상자: 여러 줄 입력. 자동 줄바꿈 없이 Enter로만 줄을 바꾼다(white-space: pre).
           바깥 틀(.text-box-wrap)이 테두리·스크롤을 맡고, 안쪽 입력칸(.text-box)은 가장 긴 줄만큼
           넓어진다(width: max-content, 칸보다 짧으면 min-width로 칸을 채움). 이렇게 해야 긴 줄이
           칸 밖으로 넘칠 때도 정렬이 "보이는 칸 너비"가 아니라 "가장 긴 줄" 기준이 되어,
           측정용 상자(#layoutProbe)·입체와 같은 모양이 된다. */
        .text-box-wrap {
            min-height: 90px; max-height: 260px; overflow: auto;
            box-sizing: border-box; width: 100%;
            border: 1px solid var(--input-border); border-radius: 6px;
            background: var(--input-bg); cursor: text;
        }
        .text-box-wrap:focus-within { border-color: #1e88e5; }
        /* 글상자 자동 맞춤 배율 표시(줄었을 때만). 글상자 틀(.text-box-wrap) 오른쪽 위에 겹쳐 둔다. */
        .text-box-holder { position: relative; }
        .box-zoom {
            /* 글자를 가리지 않게 글상자 틀 바로 위(오른쪽 끝)에 둔다 */
            position: absolute; right: 2px; top: -20px; pointer-events: none;
            font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 4px;
            color: var(--text-muted); background: var(--panel-accent-bg);
        }
        .text-box {
            width: max-content; min-width: 100%; min-height: 88px;
            padding: 10px; box-sizing: border-box;
            color: var(--text-color);
            /* 24px = 8mm(BOX_PX_PER_MM = 3). 줄 간격 기본 1.2 = 28.8px(줄 div가 따로 정하기 전의 글자에도 맞게) */
            font-size: 24px; line-height: 28.8px; white-space: pre; outline: none;
            /* 글씨체는 스크립트가 정한다(글씨체 파일마다 CSS 이름 'G9F<번호>'를 따로 둠, cssFamily()) */
            font-family: sans-serif;
            /* 글씨체 파일마다 굵은 글꼴이 따로 없으므로 '굵게'는 브라우저가 흉내 내게 둔다(측정용 상자도 같게) */
            font-synthesis: weight;
        }
        /* 줄마다 <div class="g9line">. 줄 간격은 줄마다 다를 수 있어 줄(div)에 둔다. */
        .text-box .g9line { min-height: 1px; }
        /* 블록 서식 도구 막대: 글자를 고른 뒤 글씨체·크기·줄 간격·자간·굵기·색을 바꾼다(고르지 않으면 전체).
           첫 줄 = 글씨체, 다음은 숫자 칸 넷(두 칸씩), 마지막 줄 = 굵게·색·지우기. */
        .fmt-row { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
        .fmt-row select { flex: 1; min-width: 0; height: 30px; }
        /* 숫자 칸: 칸 사이를 넉넉히(가로 18px·세로 10px) — 붙어 보여 구분이 어려웠다(2026-11-24 선생님) */
        .fmt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px 18px; margin-bottom: 12px; }
        .fmt-cell .fmt-label { display: block; margin-bottom: 4px; font-size: 0.82em; color: var(--text-muted); }
        .stepper { display: flex; align-items: center; gap: 6px; }
        /* −/+ 단추는 원형 — 네모난 숫자 칸과 구별되게(2026-11-24 선생님) */
        .stepper button {
            flex: none; width: 26px !important; min-width: 26px !important; height: 26px !important; padding: 0 !important;
            border-radius: 50% !important; line-height: 1; display: flex; align-items: center; justify-content: center;
            border: none !important; background: var(--panel-accent-bg) !important; color: var(--text-color); font-size: 1em !important;
        }
        .stepper button:hover { background: var(--input-border) !important; }
        .stepper input[type="number"] { text-align: center; height: 30px; }
        .align-label { display: block; margin-bottom: 2px; font-size: 0.82em; color: var(--text-muted); }
        .stepper input[type="number"] { flex: 1; min-width: 0; width: auto !important; -moz-appearance: textfield; }
        .stepper input[type="number"]::-webkit-inner-spin-button, .stepper input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fmt-row input[type="color"] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; }
        .fmt-cell .cell-color { display: block; width: 100%; height: 30px; padding: 0; box-sizing: border-box; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; background: var(--input-bg); }
        /* 도구 막대의 칸을 누르면 글상자 선택 표시가 사라지므로, 고른 글자를 따로 칠해 보여 준다(CSS Highlight). */
        ::highlight(g9sel) { background-color: rgba(30, 136, 229, 0.35); }
        /* 글씨체 목록(.fp-*)의 모양은 assets/js/font-picker.js(easy3D 공용)가 넣는다 */
        .fmt-row .fmt-label { font-size: 0.82em; color: var(--text-muted); margin-right: 2px; }

            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.9em;
        }
        .fmt-row button.active { background: #1e88e5; border-color: #1e88e5; color: #fff; }
        .fmt-grid button {
            height: 30px; border: 1px solid var(--input-border); border-radius: 4px;
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.9em;
        }
        .fmt-row input[type="number"], .fmt-grid input[type="number"] {
            width: 52px; height: 30px; box-sizing: border-box; text-align: center;
            border: 1px solid var(--input-border); border-radius: 4px; background: var(--input-bg); color: var(--text-color);
        }
        .fmt-hint { font-size: 0.78em; color: var(--text-muted); margin: 0 0 6px; }
        .base-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .base-row input[type="color"] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer; flex: none; }
        .base-row .align-row { flex: 1; margin: 0 0 0 6px; }
        .base-row .fmt-label { font-size: 0.82em; color: var(--text-muted); }
        .sub-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 0.82em; font-weight: bold; color: var(--text-muted); }
        .sub-head::before, .sub-head::after { content: ''; flex: 1; border-top: 1px solid var(--panel-border); }
        .align-row { display: flex; gap: 6px; margin-bottom: 14px; }

            flex: 1; padding: 6px 0; border: 1px solid var(--input-border); border-radius: 4px;
            background: var(--input-bg); color: var(--text-color); cursor: pointer; font-size: 0.9em;
        }
        .align-row button.active { background: #1e88e5; border-color: #1e88e5; color: #fff; }
        /* 측정용 상자: 화면 밖에 두고, 글자 위치(배치)를 읽는 데만 쓴다. */
        #layoutProbe {

        .test-note { font-size: 0.82em; color: var(--text-muted); background: rgba(30,136,229,0.08); border-radius: 6px; padding: 8px 10px; margin-bottom: 16px; }

    <script type="module">
        // 갤러리9 표지판(2026-11-23 시험판으로 시작, 11-24 첫 화면에 넣고 시험판 표시를 뗌): "글상자" 이름표. 갤러리5는 한 줄 입력이지만, 여기서는
        // 여러 줄을 입력하고 정렬(왼쪽·가운데·오른쪽)·줄 간격·자간을 정할 수 있게 한다.
        //
        // 핵심 방법 — 배치는 브라우저에게 맡긴다:
        //   1) 같은 TTF 파일을 CSS 글꼴(FontFace)로도 불러온다.
        //   2) 화면 밖의 측정용 상자(#layoutProbe)에 같은 글을 1mm = PROBE_PX_PER_MM px 비율로 그린다.
        //      줄마다 맨 앞에 높이 0짜리 표시(.bl)를 둬서 그 줄의 기준선 위치를 읽는다.
        //   3) 글자 하나하나의 실제 위치(Range.getClientRects)를 읽어, 그 자리에 opentype.js로 뽑은
        //      그 글자의 윤곽선을 놓는다. → 줄바꿈·정렬·자간·커닝이 화면과 같은 규칙으로 들어간다.
        //   4) 그 뒤(바닥판·외곽선·테두리·층 쌓기·내보내기)는 갤러리5와 같다.
        // 2단계(2026-11-23): 글상자에서 글자를 골라 크기(mm)·굵게를 블록마다 바꾼다. 측정용 상자에도 조각마다
        // 그 크기·굵기로 그려서 위치를 읽고, 입체는 글자마다 그 크기의 윤곽선을 놓는다(굵게는 부풀리기).
        // 3단계(2026-11-24): 고른 글자의 글씨체도 바꾼다. 글씨체 파일마다 CSS 이름(G9F<번호>)을 따로 두어
        // 글상자·측정용 상자에서 여러 글씨체가 함께 그려지고, 입체는 글자마다 그 글씨체 파일의 윤곽선을 쓴다.
        // 4단계(2026-11-24): 아래에 따로 있던 기본 글자 크기·줄 간격·자간·글자 굵기를 도구 막대로 옮겨 블록마다
        // 바꾼다(줄 간격은 줄마다). 글자 색도 블록마다 — 입체의 글자 층을 색마다 나눠 3MF에서 색이 나뉜다.
        // 글상자는 줄마다 <div>(줄 간격을 줄에 주려고)로 그린다.
        const shell = ParametricCore.mountEditorShell(document.body, null, {
            sourceUrl: 'https://makerworld.com/ko/models/2640504-parametric-name-tag-keychain-with-korean-input#profileId-2917401',
            licenseType: 'BY-SA'
        });

        const FONT_OPTIONS = FontList.OPTIONS;
        const DEFAULT_FONT_INDEX = FONT_OPTIONS.findIndex(f => f.file === 'NotoSerifKR-Black.ttf');
        const EMOJI_FONT_FILE = FontList.EMOJI_FILE;
        const FONTS_BASE = '../assets/fonts/';
        const PROBE_PX_PER_MM = 10; // 측정용 상자 배율 — 크게 그려서 반올림 오차를 줄인다

        // 글씨체 목록(사이트 글씨체 + 내 PC 글씨체)·불러오기·고르는 목록은 assets/js/font-picker.js(easy3D 공용, 2026-11-25에
        // 이 페이지에서 옮김). 이 페이지는 글상자에 글씨체마다 따로 그려야 해서 CSS 글꼴 이름 'G9F<번호>'로도 불러온다.
        FontPicker.configure({
            cssPrefix: 'G9F', cssFallback: "'G9Emoji', sans-serif",
            // 목록을 다시 만든 뒤(글씨체를 가져왔거나 화면 언어가 바뀜): 처음 글씨체 칸과 도구 막대를 다시 맞춘다
            onRefresh: function () { fontSelectEl.value = currentFontFile; updateFmtRow(); }
        });
        const fontLabel = FontPicker.label;

        const BOX_PX_PER_MM = 3;    // 글상자 화면 배율(24px = 8mm)
        // 서식 없는 글자의 값. 글상자 서식(블록마다): 크기 size(mm), 자간 ls(em = 글자 크기에 대한 비율),
        // 굵기 wt(mm, 윤곽선을 이만큼 부풀림/줄임), 높이 ht(mm, 글자 층 높이), 굵게 bold,
        // 글씨체 font(null = 기본 글씨체), 색 color(null = 글자 '기본 색'). 줄 간격 lh는 줄마다(그 줄 가장 큰 글자 크기의 배수).
        const RUN_DEFAULT = { size: 8, bold: false, font: null, ls: 0, wt: 0, ht: 0.8, color: null };
        const LH_DEFAULT = 1.2;
        // 도구 막대 숫자 칸: 단추 한 번에 바뀌는 양(step), 범위, 입력값 반올림 단위(round)
        const NUM_PROPS = {
            size: { step: 1, min: 2, max: 60, round: 0.5 },
            ht: { step: 0.1, min: 0.1, max: 3, round: 0.1 },
            lh: { step: 0.05, min: 0.7, max: 2.5, round: 0.05 },
            ls: { step: 0.02, min: -0.2, max: 0.8, round: 0.01 },
            wt: { step: 0.1, min: -1, max: 2, round: 0.05 }
        };
        function plainRun(text) { return Object.assign({ text: text }, RUN_DEFAULT); }

        const DEFAULTS = {
            // 글상자 내용 = 줄 배열 [{ lh, runs: [서식 조각…] }]. 처음에는 서식 없음(2026-11-24 선생님).
            // 기본 예시(2026-11-25 선생님 화면 그대로): 글씨마다 글씨체·크기·색을 달리 한 표지판 — 기본 글씨체 노토 세리프 KR,
            // 20mm, 검정, 사각형 테두리(둥글기 3·간격 5), 자석 홈(열린 홈 4개)
            model: [
                { lh: 0.75, runs: [
                    Object.assign(plainRun('표지판'), { size: 25, font: 'Paperlogy-8ExtraBold.ttf', color: '#ff0000' }),
                    Object.assign(plainRun(' 만'), { size: 20 }),
                    Object.assign(plainRun('들기'), { size: 20, font: 'NotoSerifKR-Black.ttf' })
                ] },
                { lh: 1, runs: [
                    Object.assign(plainRun('여러줄'), { size: 20, font: 'Cafe24Ssurround-v2.0.ttf', color: '#000000' }),
                    Object.assign(plainRun(' '), { size: 20, color: '#000000' }),
                    Object.assign(plainRun('가능'), { size: 23, font: 'KCCMurukmuruk.ttf', color: '#000000' })
                ] },
                { lh: 1, runs: [
                    Object.assign(plainRun('글'), { size: 20, font: 'Cafe24PROUP.ttf', color: '#00ffee' }),
                    Object.assign(plainRun('씨'), { size: 20, font: 'Cafe24Ohsquare-v2.0.ttf', color: '#ff8800' }),
                    Object.assign(plainRun('별'), { size: 20, font: 'Mulmaru.ttf', color: '#ff00f7' }),
                    Object.assign(plainRun(' '), { size: 20 }),
                    Object.assign(plainRun('세'), { size: 20, font: 'Hakgyoansim_EohangkkumigiB.ttf', color: '#04fa00' }),
                    Object.assign(plainRun('팅'), { size: 20, font: 'Ghanachocolate.ttf', color: '#6600ff' }),
                    Object.assign(plainRun('🙂'), { size: 20, wt: 0.5, color: '#0008ff' })
                ] }
            ],
            fontKey: FONT_OPTIONS[DEFAULT_FONT_INDEX].file, align: 'center',
            // 갤러리9에는 글자 외곽선이 없다(2026-11-24 선생님: 깔끔한 이름표). 글자 높이는 글상자 도구 막대(글씨별).
            // 테두리·바닥판 모양: 'outline'(글자 따라) | 'rect'(글자 전체를 감싸는 사각형, 모서리 둥글기 cornerR mm)
            frameShape: 'rect', cornerR: 3,
            borderW: 1.0, innerMargin: 5, outerMargin: 1.0,
            keyringOn: false, keyringX: -25, keyringY: 0, keyringHoleSize: 3.5, keyringRim: 1.0,
            // 자석 홈(assets/js/magnet-core.js): 열린 홈(open)·숨긴 홈(hidden), 개수 1~8(자리는 가장자리 쪽으로 자동)
            magnetOn: true, magnetMode: 'open', magnetCount: 4,
            baseThick: 3.0, borderThick: 0.6,
            colBase: '#ffffff', colBorder: '#000000', colText: '#000000'
        };

        shell.controlsBodyEl.innerHTML = `
            <h3 data-i18n-en="Sign Plate">표지판</h3>

            <!-- 왼쪽 옵션은 이름표의 부품별로 묶는다(2026-11-24 선생님): 1 글자 · 2 테두리 · 3 바닥판 · 4 키링 구멍 -->
            <div class="section-label" data-i18n-en="1. Text">1. 글자</div>

            <div class="fmt-grid" id="fmtGrid">

            <div class="section-label" data-i18n-en="2. Border">2. 테두리</div>
            <!-- 모양은 테두리와 바닥판에 함께 쓴다 -->
            <span class="align-label" data-i18n-en="Shape (border and base plate)">모양(테두리·바닥판)</span>
            <div class="align-row" id="frameShapeRow">

            <div class="control-group"><label><span data-i18n-en="Gap from text">글자와의 간격</span>: <span id="valInnerMargin">5</span>mm</label><input type="range" id="innerMargin" min="0" max="5" step="0.1" value="5" oninput="scheduleUpdate()"></div>

                <div class="control-group"><label><span data-i18n-en="Hole X position">구멍 X 위치</span>: <span id="valKeyringX">-25</span>mm</label><input type="range" id="keyringX" min="-60" max="60" step="0.5" value="-25" oninput="scheduleUpdate()"></div>
                <div class="control-group"><label><span data-i18n-en="Hole Y position">구멍 Y 위치</span>: <span id="valKeyringY">0</span>mm</label><input type="range" id="keyringY" min="-40" max="40" step="0.5" value="0" oninput="scheduleUpdate()"></div>

            <div class="check-row"><input type="checkbox" id="magnetOn" onchange="onMagnetToggle()"><label for="magnetOn" data-i18n-en="Add magnet pockets (6×2 mm)">자석 홈 사용 (6×2mm)</label></div>
            <!-- 켤 때만 보인다. 자석 자리는 바닥판 안쪽에 자동으로 놓는다. -->

                <div class="align-row" id="magnetModeRow">

                <div class="align-row" id="magnetCountRow" style="gap:4px">

                    <button type="button" data-count="3">3</button>
                    <button type="button" data-count="4">4</button>
                    <button type="button" data-count="5">5</button>
                    <button type="button" data-count="6">6</button>
                    <button type="button" data-count="7">7</button>
                    <button type="button" data-count="8">8</button>
                </div>
                <p class="fmt-hint" id="magnetNote"></p>
            </div>
        `;

        ParametricCore.enhanceRangeInputs(shell.controlsBodyEl);
        ParametricCore.mountDownloadPanel(shell.controlsFooterEl, { onSTL: downloadSTL, on3MF: download3MF });
        if (window.LangCore) window.LangCore.applyTranslations(document);

        const viewer = ParametricCore.initViewer(shell.viewerEl, {
            initialCameraPosition: ParametricCore.DEFAULT_CAMERA_PRESETS.ISO
        });
        const scene = viewer.scene;
        const camera = viewer.camera;
        const controls = viewer.controls;

        ParametricCore.setupResizer(shell.resizerEl, shell.controlsEl, viewer.onWindowResize);
        ParametricCore.bindViewCube(shell.cubeButtons, camera, controls);
        ParametricCore.bindDimensionToggle(shell.dimensionToggleBtn);
        ParametricCore.bindScreenshotButton(shell.screenshotBtn, viewer);
        shell.resetBtn.onclick = function () { resetToDefaults(); };

        const textBox = document.getElementById('textBox');
        const probe = document.createElement('div');
        probe.id = 'layoutProbe';
        probe.setAttribute('aria-hidden', 'true');
        document.body.appendChild(probe);

        let currentGroup = null;
        let currentMeshes = {};
        let lastGeometryFingerprint = null;
        let manifoldReady = false;
        let emojiFont = null;
        let emojiCssReady = false;
        let currentFontFile = FONT_OPTIONS[DEFAULT_FONT_INDEX].file;
        let currentAlign = DEFAULTS.align;
        let updateTimer = null;

        function scheduleUpdate() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(updateModel, 120);
        }

        // 글상자 정렬·기본 글자 색(입력하는 모습 = 결과 배치). 크기·간격 등은 조각·줄마다 따로 정한다.
        function applyBoxStyle() {
            textBox.style.textAlign = currentAlign;
            textBox.style.color = document.getElementById('colText').value;
            document.querySelectorAll('#alignRow button').forEach(function (b) {
                b.classList.toggle('active', b.dataset.align === currentAlign);
            });
        }
        function onLayoutStyleChange() { applyBoxStyle(); scheduleUpdate(); }
        function onTextColorChange() { applyBoxStyle(); updateFmtRow(); scheduleUpdate(); }
        // 키링 구멍: '사용'을 켤 때만 위치·지름·테두리 칸을 보인다
        function syncKeyringDetails() { document.getElementById('keyringDetails').hidden = !document.getElementById('keyringOn').checked; }
        function onKeyringToggle() { syncKeyringDetails(); scheduleUpdate(); }
        // 자석 홈: 켤 때만 홈 방식·개수를 보인다
        let currentMagnetMode = DEFAULTS.magnetMode;
        let currentMagnetCount = DEFAULTS.magnetCount;
        function syncMagnetUI() {
            document.getElementById('magnetDetails').hidden = !document.getElementById('magnetOn').checked;
            document.querySelectorAll('#magnetModeRow button').forEach(function (b) { b.classList.toggle('active', b.dataset.mode === currentMagnetMode); });
            document.querySelectorAll('#magnetCountRow button').forEach(function (b) { b.classList.toggle('active', +b.dataset.count === currentMagnetCount); });
        }
        function onMagnetToggle() { syncMagnetUI(); scheduleUpdate(); }
        document.querySelectorAll('#magnetModeRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentMagnetMode = b.dataset.mode; syncMagnetUI(); scheduleUpdate(); });
        });
        document.querySelectorAll('#magnetCountRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentMagnetCount = +b.dataset.count; syncMagnetUI(); scheduleUpdate(); });
        });
        syncMagnetUI();
        // 테두리·바닥판 모양(글자 따라 / 사각형). 사각형일 때만 '모서리 둥글기'를 보인다.
        let currentFrameShape = DEFAULTS.frameShape;
        function syncFrameShape() {
            document.querySelectorAll('#frameShapeRow button').forEach(function (b) { b.classList.toggle('active', b.dataset.shape === currentFrameShape); });
            document.getElementById('cornerRow').hidden = currentFrameShape !== 'rect';
        }
        document.querySelectorAll('#frameShapeRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentFrameShape = b.dataset.shape; syncFrameShape(); scheduleUpdate(); });
        });
        syncFrameShape();

        document.querySelectorAll('#alignRow button').forEach(function (b) {
            b.addEventListener('click', function () { currentAlign = b.dataset.align; onLayoutStyleChange(); });
        });
        // 입력할 때마다 줄(div)의 줄 간격을 내용에 맞춘다. 한글 조합 중에는 글상자를 건드리지 않는다.
        // 기록(되돌리기): 줄 나누기·붙여넣기는 한 번씩, 이어서 치는 글자는 묶어서.
        textBox.addEventListener('input', function (e) {
            if (!e.isComposing) {
                syncLineStyles();
                fitTextBoxSoon();
                recordChange(e.inputType === 'insertParagraph' || e.inputType === 'insertFromPaste' || e.inputType === 'insertText' && /\n/.test(e.data || '') ? 'block' : 'type');
            }
            scheduleUpdate();
        });
        textBox.addEventListener('compositionstart', function () { boxComposing = true; });
        textBox.addEventListener('compositionend', function () { boxComposing = false; syncLineStyles(); fitTextBoxSoon(); recordChange('type'); scheduleUpdate(); });

        // ---------- 글상자 자동 맞춤(2026-11-24 선생님) ----------
        // 글자를 크게 하면 글상자 밖으로 넘쳤다(글상자 화면은 1mm = 3px). 내용이 칸에 다 들어가도록 글상자 화면 배율을
        // 줄인다(CSS zoom — 글 내용·구조는 그대로라 한글 조합·커서에 영향이 적다). 넘칠 때만 줄이고 100%보다 키우지는 않는다.
        // 줄었을 때는 오른쪽 위에 '60%'처럼 배율을 보인다. 입체는 이 배율과 상관없이 실제 크기(mm)로 만든다.
        let boxZoom = 1;
        let boxComposing = false;
        let fitTimer = null;
        const BOX_PAD_PX = 10;        // .text-box의 padding(배율 1일 때)
        const BOX_MAX_H = 260;        // .text-box-wrap의 max-height
        const BOX_MIN_H = 88;         // .text-box의 min-height(배율 1일 때)
        function fitTextBox() {
            if (boxComposing) return; // 한글 조합 중에는 건드리지 않고, 조합이 끝나면 다시 맞춘다
            const wrap = document.getElementById('textBoxWrap');
            const r = document.createRange();
            let w = 0, top = Infinity, bottom = -Infinity;
            textBox.childNodes.forEach(function (n) {
                if (n.nodeType === 3) { if (!n.data) return; r.selectNode(n); }
                else if (n.nodeType === 1) r.selectNodeContents(n);
                else return;
                const tr = r.getBoundingClientRect();            // 글자가 차지하는 폭
                const br = n.nodeType === 1 ? n.getBoundingClientRect() : tr; // 줄 높이
                w = Math.max(w, tr.width);
                if (br.height) { top = Math.min(top, br.top); bottom = Math.max(bottom, br.bottom); }
            });
            // 지금 배율로 잰 값 → 배율 1일 때의 크기
            const contentW = w / boxZoom + 2 * BOX_PAD_PX + 12; // +12: 글자 획이 글자 칸 밖으로 조금 나오는 것·커서 자리
            const contentH = (bottom > top ? bottom - top : 0) / boxZoom + 2 * BOX_PAD_PX;
            const availW = wrap.clientWidth;
            const availH = BOX_MAX_H - 2;
            let z = Math.min(1, availW / contentW, availH / contentH);
            z = Math.max(0.15, Math.floor(z * 100) / 100);
            // 넘치면(줄여야 하면) 언제나 줄이고, 키울 때만 작은 차이(2%p 미만)는 무시한다(흔들림 방지)
            if (z === boxZoom || (z > boxZoom && z - boxZoom < 0.02 && z !== 1)) return;
            boxZoom = z;
            textBox.style.zoom = z === 1 ? '' : String(z);
            textBox.style.minHeight = z === 1 ? '' : (BOX_MIN_H / z) + 'px'; // 줄여도 칸 높이는 그대로 보이게
            const badge = document.getElementById('boxZoom');
            badge.hidden = z === 1;
            badge.textContent = Math.round(z * 100) + '%';
            badge.title = LangCore.pick('글상자 화면 배율 — 글자가 커서 칸에 맞게 줄여 보여 줍니다(입체는 실제 크기).', 'Text box view scale — shrunk to fit (the 3D model keeps the real size).');
        }
        function fitTextBoxSoon() {
            if (fitTimer) cancelAnimationFrame(fitTimer);
            fitTimer = requestAnimationFrame(function () { fitTimer = null; fitTextBox(); });
        }
        // 글상자 폭이 바뀌거나(왼쪽 판 크기 조절·창 크기) 글씨체 파일이 늦게 불러와져 글자 폭이 바뀌면 다시 맞춘다
        if ('ResizeObserver' in window) new ResizeObserver(fitTextBoxSoon).observe(document.getElementById('textBoxWrap'));
        if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitTextBoxSoon);
        // 틀의 빈 곳(스크롤 막대 옆 등)을 눌러도 입력칸으로 들어가게
        document.getElementById('textBoxWrap').addEventListener('mousedown', function (e) {
            if (e.target === this) { e.preventDefault(); textBox.focus(); }
        });
        // Enter는 브라우저 기본(새 줄 div, 앞 줄의 줄 간격·글자 서식을 이어받음). Shift+Enter(줄 안 <br>)도
        // Enter와 같게 한다 — 한 div 안에 줄이 둘이면 줄 간격을 줄마다 따로 줄 수 없어서.
        textBox.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.shiftKey && !e.isComposing) { e.preventDefault(); document.execCommand('insertParagraph'); }
            // Ctrl+B/I/U(브라우저의 굵게·기울임·밑줄)는 막는다 — 굵게 단추를 뺐고(2026-11-24), 기울임·밑줄은 입체에 없어서
            if ((e.ctrlKey || e.metaKey) && !e.altKey && /^[biu]$/i.test(e.key)) e.preventDefault();
        });
        // 붙여넣기는 글자만(다른 곳의 색·글꼴·링크 서식은 버린다). 여러 줄이면 줄 구조를 다시 그린다.
        textBox.addEventListener('paste', function (e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r/g, '');
            document.execCommand('insertText', false, text);
            if (text.indexOf('\n') >= 0) normalizeBox();
        });
        textBox.addEventListener('drop', function (e) { e.preventDefault(); });
        // 새 줄은 div로, 브라우저가 서식을 이어 줄 때는 <font> 대신 <span style>로(아래 runStyleOf가 읽는다)
        try { document.execCommand('defaultParagraphSeparator', false, 'div'); document.execCommand('styleWithCSS', false, true); } catch (err) { /* 무시 */ }

        // ---------- 글상자 내용(모델) ↔ 화면(DOM) ----------
        // 모델: [{ lh, runs: [{ text, size, bold, font, ls, wt, color }] }] — 줄 배열, 줄마다 서식 조각.
        // 화면: 줄마다 <div class="g9line" data-lh>, 조각마다 <span class="g9run" data-*>(값을 모두 적음).
        const RUN_KEYS = Object.keys(RUN_DEFAULT); // 서식 값 목록(size·bold·font·ls·wt·ht·color) — 기본값에서 바로 가져온다
        function isKnownFont(key) { return FontPicker.isKnown(key); }
        function round2(v) { return Math.round(v * 100) / 100; }
        function cssColorToHex(c) {
            const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || '');
            if (m) return '#' + [m[1], m[2], m[3]].map(function (v) { return (+v).toString(16).padStart(2, '0'); }).join('');
            return /^#[0-9a-f]{6}$/i.test(c || '') ? c.toLowerCase() : null;
        }
        function fontFromFamily(fam) { return FontPicker.keyFromFamily(fam); }

        // 글자(텍스트 노드)의 서식: 가까운 조상부터 올라가며 처음 만난 값을 쓴다. 우리가 만든 조각(span.g9run)은
        // data-*에서, 그 밖의 요소는 인라인 style에서 읽는다 — Enter 뒤 빈 줄에 글자를 치면 브라우저가 앞 글자의
        // 모양을 이어 주려고 <span style="font-size: 36px; ...">를 만들기 때문(굵기 wt는 style이 없어 이어지지 않음).
        function runStyleOf(node) {
            const st = {};
            let lsPx;
            function set(k, v) { if (!(k in st) && v !== undefined && !(typeof v === 'number' && !isFinite(v))) st[k] = v; }
            for (let el = node.parentNode; el && el !== textBox && el.nodeType === 1; el = el.parentNode) {
                if (el.nodeName === 'DIV' || el.nodeName === 'P') continue; // 줄 div의 style(줄 간격 px)은 글자 서식이 아님
                const d = el.dataset || {};
                if (el.classList.contains('g9run')) {
                    set('size', parseFloat(d.size));
                    set('bold', d.bold === '1');
                    set('font', d.font && isKnownFont(d.font) ? d.font : null);
                    set('ls', parseFloat(d.ls));
                    set('wt', parseFloat(d.wt));
                    set('ht', parseFloat(d.ht));
                    set('color', d.color || null);
                    continue;
                }
                const s = el.style;
                if (/px$/.test(s.fontSize)) set('size', round2(parseFloat(s.fontSize) / BOX_PX_PER_MM));
                if (/em$/.test(s.letterSpacing)) set('ls', parseFloat(s.letterSpacing));
                else if (/px$/.test(s.letterSpacing) && lsPx === undefined && !('ls' in st)) lsPx = parseFloat(s.letterSpacing);
                if (s.fontFamily) set('font', fontFromFamily(s.fontFamily));
                const col = s.color ? cssColorToHex(s.color) : (el.nodeName === 'FONT' ? cssColorToHex(el.getAttribute('color')) : null);
                if (col) set('color', col === document.getElementById('colText').value.toLowerCase() ? null : col);
                if (s.fontWeight) set('bold', parseInt(s.fontWeight, 10) >= 600 || s.fontWeight === 'bold');
                if (el.nodeName === 'B' || el.nodeName === 'STRONG') set('bold', true);
            }
            const out = {};
            RUN_KEYS.forEach(function (k) { out[k] = k in st ? st[k] : RUN_DEFAULT[k]; });
            if (!('ls' in st) && lsPx !== undefined) out.ls = round2(lsPx / (out.size * BOX_PX_PER_MM));
            return out;
        }

        // root(글상자 또는 그 일부를 복사한 조각) 안의 글을 줄·조각으로 읽는다. withEls면 줄마다 그 div(el)도.
        const BLOCK_TAGS = { DIV: 1, P: 1 };
        // 줄(div)·글상자 맨 끝의 <br>은 빈 줄을 보이게 하려는 자리표시라 줄을 만들지 않는다.
        function isTrailingBr(br) {
            for (let n = br; n && !n.nextSibling; n = n.parentNode) {
                const p = n.parentNode;
                if (!p || p.nodeType !== 1) return false;
                if (BLOCK_TAGS[p.nodeName] || p === textBox) return true;
            }
            return false;
        }
        function parseNodes(root, withEls) {
            const lines = [];
            let cur = null;
            function startLine(lh, el) { cur = { lh: lh, runs: [] }; if (withEls) cur.el = el || null; lines.push(cur); }
            function ensureLine() { if (!cur) startLine(LH_DEFAULT, null); }
            function lhOf(el) { const v = parseFloat(el.dataset && el.dataset.lh); return isFinite(v) ? v : LH_DEFAULT; }
            function walk(node) {
                node.childNodes.forEach(function (child) {
                    if (child.nodeType === 3) {
                        if (!child.data) return;
                        ensureLine();
                        const st = runStyleOf(child);
                        child.data.split('\n').forEach(function (part, i) {
                            if (i > 0) startLine(cur.lh, null);
                            if (part) cur.runs.push(Object.assign({ text: part }, st));
                        });
                    } else if (child.nodeName === 'BR') {
                        ensureLine();
                        if (!isTrailingBr(child)) startLine(cur.lh, null);
                    } else if (BLOCK_TAGS[child.nodeName]) {
                        startLine(lhOf(child), child);
                        walk(child);
                        cur = null; // div 뒤에 오는 글은 새 줄
                    } else if (child.nodeType === 1) {
                        walk(child);
                    }
                });
            }
            walk(root);
            return lines;
        }
        function sameStyle(a, b) { return RUN_KEYS.every(function (k) { return a[k] === b[k]; }); }
        function copyRun(r) { const o = { text: r.text }; RUN_KEYS.forEach(function (k) { o[k] = r[k]; }); return o; }
        function mergeRuns(runs) {
            const out = [];
            runs.forEach(function (r) {
                const last = out[out.length - 1];
                if (last && sameStyle(last, r)) last.text += r.text;
                else out.push(copyRun(r));
            });
            return out;
        }
        function readModel() {
            const lines = parseNodes(textBox, false).map(function (l) { return { lh: l.lh, runs: mergeRuns(l.runs) }; });
            return lines.length ? lines : [{ lh: LH_DEFAULT, runs: [] }];
        }
        function modelText(model) { return model.map(function (l) { return l.runs.map(function (r) { return r.text; }).join(''); }).join('\n'); }
        function cloneModel(model) { return model.map(function (l) { return { lh: l.lh, runs: l.runs.map(copyRun) }; }); }

        // 줄 높이 = 줄 간격 × 그 줄에서 가장 큰 글자 크기(빈 줄은 기본 크기). 줄 div에 px로 주면 그 줄의
        // 모든 글자가 같은 높이를 이어받아, 작은 글자만 있는 줄도 그만큼 좁아진다(측정용 상자도 같게).
        function lineMaxSize(line) {
            return line.runs.length ? Math.max.apply(null, line.runs.map(function (r) { return r.size; })) : RUN_DEFAULT.size;
        }
        function lineBoxPx(line, pxPerMm) { return line.lh * lineMaxSize(line) * pxPerMm; }
        function syncLineStyles() {
            parseNodes(textBox, true).forEach(function (l) {
                if (l.el) l.el.style.lineHeight = lineBoxPx(l, BOX_PX_PER_MM) + 'px';
            });
        }

        function applyRunStyle(span, r) {
            span.dataset.size = String(r.size);
            span.dataset.bold = r.bold ? '1' : '0';
            span.dataset.font = r.font || '';
            span.dataset.ls = String(r.ls);
            span.dataset.wt = String(r.wt);
            span.dataset.ht = String(r.ht);
            span.dataset.color = r.color || '';
            span.style.fontSize = (r.size * BOX_PX_PER_MM) + 'px';
            span.style.fontWeight = r.bold ? '700' : '';
            span.style.fontFamily = r.font ? cssFamily(r.font) : '';
            span.style.letterSpacing = r.ls ? r.ls + 'em' : '';
            span.style.color = r.color || '';
        }
        function renderModel(model) {
            textBox.textContent = '';
            model.forEach(function (line) {
                const div = document.createElement('div');
                div.className = 'g9line';
                div.dataset.lh = String(line.lh);
                div.style.lineHeight = lineBoxPx(line, BOX_PX_PER_MM) + 'px';
                line.runs.forEach(function (r) {
                    const span = document.createElement('span');
                    span.className = 'g9run';
                    applyRunStyle(span, r);
                    span.textContent = r.text;
                    div.appendChild(span);
                });
                if (!line.runs.length) div.appendChild(document.createElement('br'));
                textBox.appendChild(div);
            });
            fitTextBoxSoon();
        }
        // 화면 구조를 모델대로 다시 그린다(붙여넣기 뒤). 글자 위치(커서)는 글자 수로 되살린다.
        function normalizeBox() {
            const s = readSelection();
            renderModel(readModel());
            if (s) restoreSelection(s.end, s.end);
            scheduleUpdate();
        }

        // ---------- 고른 글자 위치(글자 수 기준, 줄바꿈 = 1글자) ----------
        // 도구 막대의 칸(숫자·글씨체·색)을 누르면 글상자 선택이 풀리므로 마지막 선택을 기억해 두고(lastSel),
        // 글상자 밖에 있는 동안은 그 자리를 따로 칠해 보여 준다(lastRange, CSS Highlight).
        let lastSel = null;
        let lastRange = null;
        function offsetAt(node, offset) {
            const r = document.createRange();
            r.setStart(textBox, 0);
            r.setEnd(node, offset);
            return modelText(parseNodes(r.cloneContents(), false)).length;
        }
        // 드래그가 글상자 밖에서 끝나도(전체를 끌어 고를 때 흔함) 글상자 안쪽만큼으로 잘라 읽는다.
        function readSelection() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            const r = sel.getRangeAt(0);
            const sIn = textBox.contains(r.startContainer), eIn = textBox.contains(r.endContainer);
            if (!sIn && !eIn && !r.intersectsNode(textBox)) return null;
            const clamped = document.createRange();
            if (sIn) clamped.setStart(r.startContainer, r.startOffset); else clamped.setStart(textBox, 0);
            if (eIn) clamped.setEnd(r.endContainer, r.endOffset); else clamped.setEnd(textBox, textBox.childNodes.length);
            return {
                start: sIn ? offsetAt(r.startContainer, r.startOffset) : 0,
                end: eIn ? offsetAt(r.endContainer, r.endOffset) : modelText(readModel()).length,
                range: clamped
            };
        }
        // renderModel로 그린 글상자에서 글자 수 위치 → (노드, 위치)
        function pointAt(off) {
            const lines = Array.prototype.filter.call(textBox.children, function (el) { return el.classList.contains('g9line'); });
            let acc = 0;
            for (let i = 0; i < lines.length; i++) {
                const texts = [];
                (function collect(n) { n.childNodes.forEach(function (c) { if (c.nodeType === 3) texts.push(c); else collect(c); }); })(lines[i]);
                const len = texts.reduce(function (s, t) { return s + t.data.length; }, 0);
                if (off <= acc + len) {
                    let rem = off - acc;
                    for (const t of texts) { if (rem <= t.data.length) return [t, rem]; rem -= t.data.length; }
                    return [lines[i], 0];
                }
                acc += len + 1;
            }
            return [textBox, textBox.childNodes.length];
        }
        function rangeFor(start, end) {
            const a = pointAt(start), b = pointAt(end);
            const r = document.createRange();
            r.setStart(a[0], a[1]);
            r.setEnd(b[0], b[1]);
            return r;
        }
        function restoreSelection(start, end) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(rangeFor(start, end));
        }
        const canHighlight = !!(window.CSS && CSS.highlights && window.Highlight);
        function showSavedSelection(show) {
            if (!canHighlight) return;
            if (show && lastSel && lastSel.start !== lastSel.end && lastRange) CSS.highlights.set('g9sel', new Highlight(lastRange));
            else CSS.highlights.delete('g9sel');
        }
        textBox.addEventListener('focusout', function () { showSavedSelection(true); });
        textBox.addEventListener('focusin', function () { showSavedSelection(false); });
        document.addEventListener('selectionchange', function () {
            const s = readSelection();
            if (!s) return;
            lastSel = { start: s.start, end: s.end };
            lastRange = s.range;
            if (document.activeElement !== textBox) showSavedSelection(true);
            updateFmtRow();
        });

        // ---------- 블록 서식 바꾸기 ----------
        // 모델을 글자 하나하나로 펼쳐 [start, end) 범위 글자의 서식만 바꾼 뒤 다시 묶는다.
        // 줄 간격은 줄의 값이라 lineLh(줄마다)에서 바꾼다.
        function explode(model) {
            const chars = [];
            model.forEach(function (line, li) {
                if (li > 0) chars.push({ br: true, line: li });
                line.runs.forEach(function (r) {
                    for (let i = 0; i < r.text.length; i++) {
                        const c = { ch: r.text[i], line: li };
                        RUN_KEYS.forEach(function (k) { c[k] = r[k]; });
                        chars.push(c);
                    }
                });
            });
            return chars;
        }
        function implode(chars, lineLh) {
            const lines = lineLh.map(function (lh) { return { lh: lh, runs: [] }; });
            chars.forEach(function (c) {
                if (c.br) return;
                const r = { text: c.ch };
                RUN_KEYS.forEach(function (k) { r[k] = c[k]; });
                lines[c.line].runs.push(r);
            });
            return lines.map(function (l) { return { lh: l.lh, runs: mergeRuns(l.runs) }; });
        }
        function selectedRange(total) {
            if (lastSel && lastSel.start !== lastSel.end) {
                return { start: Math.min(lastSel.start, lastSel.end), end: Math.max(lastSel.start, lastSel.end), whole: false };
            }
            return { start: 0, end: total, whole: true };
        }
        // 고른 글자(targets)와 그 글자가 있는 줄(lines). 고른 범위에 들어간 빈 줄도 줄 간격 대상이다.
        function selectionTargets(model) {
            const chars = explode(model);
            const sr = selectedRange(chars.length);
            const picked = chars.slice(sr.start, sr.end);
            const targets = picked.filter(function (c) { return !c.br; });
            const lineSet = new Set(targets.map(function (c) { return c.line; }));
            picked.forEach(function (c) { if (c.br && !model[c.line].runs.length) lineSet.add(c.line); });
            if (sr.whole) model.forEach(function (l, i) { lineSet.add(i); });
            return { chars: chars, sr: sr, targets: targets, lines: Array.from(lineSet).sort(function (a, b) { return a - b; }) };
        }
        // kind: 되돌리기 기록의 종류('format' 한 번씩, 'color'는 색 고르는 동안 하나로 묶음)
        function applyToSelection(change, kind) {
            const model = readModel();
            const t = selectionTargets(model);
            if (!t.targets.length && !t.lines.length) return;
            const lineLh = model.map(function (l) { return l.lh; });
            change(t.targets, lineLh, t.lines);
            const focused = document.activeElement === textBox;
            renderModel(implode(t.chars, lineLh));
            if (!t.sr.whole) {
                lastSel = { start: t.sr.start, end: t.sr.end };
                if (focused) restoreSelection(t.sr.start, t.sr.end);
                else { lastRange = rangeFor(t.sr.start, t.sr.end); showSavedSelection(true); }
            } else if (focused && lastSel) {
                restoreSelection(lastSel.start, lastSel.start);
            }
            recordChange(kind || 'format');
            updateFmtRow();
            scheduleUpdate();
        }

        // ---------- 되돌리기(Ctrl+Z)·다시 하기(Ctrl+Y, Ctrl+Shift+Z) ----------
        // 서식을 바꿀 때마다 글상자를 다시 그려서(renderModel) 브라우저의 되돌리기 기록이 맞지 않으므로,
        // 글상자 내용(모델)과 고른 위치를 직접 기록한다. 이어서 치는 글자·색 고르기는 1초 안이면 한 번으로 묶는다.
        const history = { undo: [], redo: [], cur: null, lastKind: '', lastTime: 0 };
        const HISTORY_MAX = 100;
        const COALESCE_KINDS = { type: 1, color: 1 };
        function resetHistory() {
            history.undo = []; history.redo = [];
            history.cur = { model: cloneModel(readModel()), sel: null };
            history.lastKind = '';
        }
        function recordChange(kind) {
            const model = readModel();
            if (history.cur && JSON.stringify(history.cur.model) === JSON.stringify(model)) return;
            const now = Date.now();
            const coalesce = COALESCE_KINDS[kind] && history.lastKind === kind && now - history.lastTime < 1000;
            if (history.cur && !coalesce) {
                history.undo.push(history.cur);
                if (history.undo.length > HISTORY_MAX) history.undo.shift();
            }
            history.redo = [];
            history.cur = { model: cloneModel(model), sel: lastSel ? { start: lastSel.start, end: lastSel.end } : null };
            history.lastKind = kind;
            history.lastTime = now;
        }
        function applySnapshot(s) {
            renderModel(cloneModel(s.model));
            history.lastKind = '';
            const total = modelText(s.model).length;
            const sel = s.sel ? { start: Math.min(s.sel.start, total), end: Math.min(s.sel.end, total) } : { start: total, end: total };
            lastSel = sel;
            if (document.activeElement === textBox) restoreSelection(sel.start, sel.end);
            else { lastRange = rangeFor(sel.start, sel.end); showSavedSelection(true); }
            updateFmtRow();
            scheduleUpdate();
        }
        function undo() {
            if (!history.undo.length) return;
            history.redo.push(history.cur);
            history.cur = history.undo.pop();
            applySnapshot(history.cur);
        }
        function redo() {
            if (!history.redo.length) return;
            history.undo.push(history.cur);
            history.cur = history.redo.pop();
            applySnapshot(history.cur);
        }
        // 고른 위치가 바뀌면 지금 상태에 적어 둔다(되돌렸을 때 그 자리로 돌아가게)
        document.addEventListener('selectionchange', function () {
            if (history.cur && lastSel) history.cur.sel = { start: lastSel.start, end: lastSel.end };
        });
        // 글상자 안이나 도구 막대 단추(숫자 칸 제외 — 숫자 칸은 그 칸의 되돌리기)에서 단축키를 쓴다
        document.addEventListener('keydown', function (e) {
            if (!(e.ctrlKey || e.metaKey) || e.altKey || e.isComposing) return;
            const inBox = textBox.contains(document.activeElement) || document.activeElement === textBox;
            const onToolbar = document.activeElement && document.activeElement.closest && document.activeElement.closest('#fmtGrid')
                && document.activeElement.tagName !== 'INPUT';
            if (!inBox && !onToolbar) return;
            const key = e.key.toLowerCase();
            if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); redo(); }
        });
        // 메뉴(오른쪽 단추 '실행 취소' 등)로 되돌릴 때도 같은 기록을 쓴다
        textBox.addEventListener('beforeinput', function (e) {
            if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
            else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
        });

        function clampProp(k, v) {
            const p = NUM_PROPS[k];
            v = Math.round(v / p.round) * p.round;
            return parseFloat(Math.min(p.max, Math.max(p.min, v)).toFixed(3));
        }
        function changeNum(k, fn) {
            applyToSelection(function (targets, lineLh, lines) {
                if (k === 'lh') lines.forEach(function (i) { lineLh[i] = clampProp('lh', fn(lineLh[i])); });
                else targets.forEach(function (c) { c[k] = clampProp(k, fn(c[k])); });
            });
        }

        const fmtGrid = document.getElementById('fmtGrid');
        const blockFont = document.getElementById('blockFont');
        const blockColor = document.getElementById('blockColor');
        function updateFmtRow() {
            const model = readModel();
            const t = selectionTargets(model);
            const first = t.targets[0] || RUN_DEFAULT;
            const firstLine = model[t.lines.length ? t.lines[0] : 0];
            fmtGrid.querySelectorAll('input[data-num]').forEach(function (inp) {
                if (document.activeElement === inp) return;
                const k = inp.dataset.num;
                inp.value = k === 'lh' ? (firstLine ? firstLine.lh : LH_DEFAULT) : first[k];
            });
            // 고른 글자의 서식이 섞여 있으면 첫 글자 것을 보여 준다
            blockFont.value = first.font || '';
            blockColor.value = first.color || document.getElementById('colText').value;
            syncFontPickers();
        }

        // 단추를 눌러도 글상자의 선택이 풀리지 않게
        fmtGrid.querySelectorAll('button').forEach(function (b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); });
        fmtGrid.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-step]');
            if (!btn) return;
            const k = btn.dataset.step, d = parseFloat(btn.dataset.dir) * NUM_PROPS[k].step;
            changeNum(k, function (v) { return v + d; });
        });
        fmtGrid.querySelectorAll('input[data-num]').forEach(function (inp) {
            inp.addEventListener('change', function () {
                const v = parseFloat(inp.value);
                if (!isFinite(v)) { updateFmtRow(); return; }
                changeNum(inp.dataset.num, function () { return v; });
            });
        });
        // 고른 글자의 색(3MF에서 색이 나뉨). 고르는 동안 바로 바뀐다.
        blockColor.addEventListener('input', function () {
            const col = this.value.toLowerCase();
            applyToSelection(function (t) { t.forEach(function (c) { c.color = col; }); }, 'color');
        });

        // 글씨체 불러오기 — 같은 글씨체 파일을 opentype.js(윤곽선)와 CSS 글꼴(배치, 'G9F' + id) 둘 다로(font-picker.js).
        // 한 글상자에 여러 글씨체가 섞여도 각 조각이 제 이름으로 그려지고, 글씨체에 없는 글자(이모지)는 'G9Emoji'로 넘어간다.
        const cssFamily = FontPicker.cssFamily;
        const ensureFont = FontPicker.ensure;
        const isFontReady = FontPicker.isReady;
        new FontFace('G9Emoji', 'url(' + FONTS_BASE + encodeURI(EMOJI_FONT_FILE) + ')').load()
            .then(function (face) { document.fonts.add(face); emojiCssReady = true; scheduleUpdate(); })
            .catch(function (err) { console.error('이모지 CSS 글꼴 로딩 실패:', err); });

        // 입체에 쓰이는 글씨체(기본 글씨체 + 조각마다 고른 글씨체)
        function neededFonts(p) {
            const files = new Set([p.fontFile]);
            p.lines.forEach(function (l) { l.runs.forEach(function (r) { if (r.font) files.add(r.font); }); });
            return Array.from(files);
        }

        // ---------- 글씨체 고르는 칸 두 개('처음 글씨체' 숨긴 칸, 도구 막대 '고른 글자') ----------
        // 값은 숨긴 <select>에 두고 목록·업로드·폴더 가져오기는 font-picker.js가 한다. 이 페이지는 고른 글씨체를 어디에
        // 적용할지만 정한다: 처음 글씨체 칸 = 글상자 전체의 기본, '고른 글자' 칸 = 글상자에서 고른 글자.
        // 목록에는 '(기본 글씨체)' 줄을 두지 않는다(2026-11-24 선생님) — 따로 고른 글씨체는 고른 글자 칸에 기본 글씨체 이름이 보임.
        const fontSelectEl = document.getElementById('fontSelect');
        const fontNoteEl = document.getElementById('fontNoteBlock');
        FontPicker.attach(fontSelectEl, null, {
            noteEl: fontNoteEl,
            onChoose: function (key) {
                currentFontFile = key;
                fontSelectEl.value = key;
                textBox.style.fontFamily = cssFamily(key);
                updateModel();
            },
            revert: function () { fontSelectEl.value = currentFontFile; }
        });
        FontPicker.attach(blockFont, document.getElementById('blockFontPicker'), {
            withBaseChoice: true,
            noteEl: fontNoteEl,
            // 글씨체를 따로 고르지 않은 글자(값 '')는 기본 글씨체를 따르므로 그 이름을 보여 준다
            shownValue: function (sel) { return sel.value || currentFontFile; },
            onChoose: function (key) { applyToSelection(function (t) { t.forEach(function (c) { c.font = key; }); }); },
            onClear: function () { applyToSelection(function (t) { t.forEach(function (c) { c.font = null; }); }); },
            revert: function () { updateFmtRow(); }
        });
        function syncFontPickers() { FontPicker.sync(); }
        function refreshFontSelects() { FontPicker.refresh(); }
        function onFontChange() { fontSelectEl.dispatchEvent(new Event('change')); }

        function resetToDefaults() {
            currentAlign = DEFAULTS.align;
            document.getElementById('fontSelect').value = DEFAULTS.fontKey;
            ['borderW', 'innerMargin', 'outerMargin',
             'keyringX', 'keyringY', 'keyringHoleSize', 'keyringRim', 'baseThick', 'borderThick',
             'colBase', 'colBorder', 'colText'].forEach(function (id) {
                document.getElementById(id).value = DEFAULTS[id];
            });
            document.getElementById('keyringOn').checked = DEFAULTS.keyringOn;
            syncKeyringDetails();
            document.getElementById('magnetOn').checked = DEFAULTS.magnetOn;
            currentMagnetMode = DEFAULTS.magnetMode;
            currentMagnetCount = DEFAULTS.magnetCount;
            syncMagnetUI();
            currentFrameShape = DEFAULTS.frameShape;
            document.getElementById('cornerR').value = DEFAULTS.cornerR;
            syncFrameShape();
            renderModel(cloneModel(DEFAULTS.model));
            lastSel = null;
            recordChange('block'); // 초기화도 되돌릴 수 있게(글상자 내용만)
            lastRange = null;
            showSavedSelection(false);
            updateFmtRow();
            applyBoxStyle();
            ParametricCore.resetCameraTo(camera, controls, ParametricCore.DEFAULT_CAMERA_PRESETS.ISO);
            onFontChange();
        }

        // ---------- 배치: 측정용 상자에서 글자 위치 읽기 ----------
        // 돌려주는 값: [{ ch, x, y, size, bold, fontFile, wt, color }] — x는 글자 원점(왼쪽), y는 그 줄의 기준선.
        // 단위 mm, y는 위쪽이 +. 글상자와 같은 구조(줄 div + 조각 span, 같은 서식)로 그려서 브라우저가 맞춘
        // 기준선·자간·줄 높이를 그대로 읽는다.
        function measureLayout(p) {
            const px = PROBE_PX_PER_MM;
            probe.style.fontSize = (RUN_DEFAULT.size * px) + 'px';
            probe.style.fontFamily = cssFamily(p.fontFile);
            probe.style.textAlign = p.align;
            probe.textContent = '';
            const lineEls = p.lines.map(function (line) {
                const div = document.createElement('div');
                div.style.lineHeight = lineBoxPx(line, px) + 'px';
                const marker = document.createElement('span');
                marker.className = 'bl';
                div.appendChild(marker);
                const parts = line.runs.map(function (r) {
                    const span = document.createElement('span');
                    span.style.fontSize = (r.size * px) + 'px';
                    if (r.bold) span.style.fontWeight = '700';
                    if (r.font) span.style.fontFamily = cssFamily(r.font);
                    if (r.ls) span.style.letterSpacing = r.ls + 'em';
                    const tn = document.createTextNode(r.text);
                    span.appendChild(tn);
                    div.appendChild(span);
                    return { tn: tn, text: r.text, run: r, fontFile: r.font || p.fontFile };
                });
                probe.appendChild(div);
                return { marker: marker, parts: parts };
            });
            const box = probe.getBoundingClientRect();
            const placed = [];
            const range = document.createRange();
            lineEls.forEach(function (le) {
                const baseline = le.marker.getBoundingClientRect().bottom;
                le.parts.forEach(function (part) {
                    let i = 0;
                    const s = part.text;
                    while (i < s.length) {
                        const cp = s.codePointAt(i);
                        const len = cp > 0xffff ? 2 : 1;
                        const ch = s.substr(i, len);
                        range.setStart(part.tn, i);
                        range.setEnd(part.tn, i + len);
                        const rects = range.getClientRects();
                        if (rects.length && !/\s/.test(ch)) {
                            placed.push({
                                ch: ch,
                                x: (rects[0].left - box.left) / px,
                                y: -(baseline - box.top) / px,
                                size: part.run.size, bold: part.run.bold, wt: part.run.wt, ht: part.run.ht, color: part.run.color,
                                fontFile: part.fontFile
                            });
                        }
                        i += len;
                    }
                });
            });
            return placed;
        }

        // 이모지의 모양 바꿈 기호(U+FE0E/FE0F)·잇기 기호(U+200D)처럼 그릴 모양이 없는 글자는 건너뛴다.
        function isInvisibleMark(ch) {
            const cp = ch.codePointAt(0);
            return (cp >= 0xfe00 && cp <= 0xfe0f) || cp === 0x200d || cp === 0x20e3;
        }

        // ---------- 모델링 (갤러리5와 같은 층 구조) ----------
        const PREVIEW_CURVE_SEGMENTS = 16;
        const EXPORT_CURVE_SEGMENTS = 48;
        const SIMPLIFY_EPS = 0.005; // mm — 글자 윤곽선 점 줄이기(프린터 노즐 0.4mm보다 80배 작음)
        const TIDY_EPS = 0.0001; // mm — 완성된 층의 아주 짧은 변 없애기(float32에서 점이 합쳐지지 않게)
        const KISS_JOIN_MM = 0.001; // mm — 꼭짓점 하나로만 맞닿은 곳 잇기(픽셀 글씨체, 갤러리5 주석 참고)
        // '굵게' 글자를 부풀리는 양(한쪽, 글자 크기에 대한 비율). 8mm 글자면 0.16mm씩 — 획이 0.32mm 굵어진다.
        // 0.03으로 하면 원래 굵은 글씨체(Noto Sans KR Black, Cafe24 Ssurround)의 12mm '름' 속 공간이 막혔다.
        // 글상자 화면은 브라우저가 흉내 낸 굵게라 두께가 완전히 같지는 않다.
        const BOLD_RATIO = 0.02;

        // 글자 윤곽선을 (색|높이) → 부풀릴 양(mm) 묶음으로 나눠 돌려준다. 부풀릴 양 = 굵게(크기 × BOLD_RATIO) + 굵기(wt).
        // 돌려주는 값: { '색|높이'(색 = 'default' 또는 '#rrggbb'): { 부풀릴 양: [윤곽선…] } } — 전체가 (0,0) 가운데로 옮겨진 상태.
        function buildTextContours(p, curveSegments) {
            const placed = measureLayout(p);
            const fallback = { file: EMOJI_FONT_FILE, font: emojiFont };
            const groups = {};
            const all = [];
            placed.forEach(function (g) {
                if (isInvisibleMark(g.ch)) return;
                const shape = FontCore.getGlyphShape(g.fontFile, FontCore.getFont(g.fontFile), g.ch, g.size, curveSegments, fallback);
                const partKey = (g.color || 'default') + '|' + g.ht; // 색과 높이가 같은 글자끼리 한 조각
                const grow = Math.round(((g.bold ? g.size * BOLD_RATIO : 0) + g.wt) * 10000) / 10000;
                const byGrow = groups[partKey] = groups[partKey] || {};
                const target = byGrow[grow] = byGrow[grow] || [];
                shape.contours.forEach(function (pts) {
                    const moved = pts.map(function (q) { return [q[0] + g.x, q[1] + g.y]; });
                    target.push(moved);
                    all.push(moved);
                });
            });
            if (!all.length) return null;
            // 전체를 가운데(0,0)로 옮긴다 — 키링 구멍 위치 기준을 갤러리5와 같게.
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            all.forEach(function (pts) {
                pts.forEach(function (q) {
                    if (q[0] < minX) minX = q[0]; if (q[0] > maxX) maxX = q[0];
                    if (q[1] < minY) minY = q[1]; if (q[1] > maxY) maxY = q[1];
                });
            });
            const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            all.forEach(function (pts) { pts.forEach(function (q) { q[0] -= cx; q[1] -= cy; }); });
            return groups;
        }
        // 글자 조각 키 '색|높이' → 색, 높이
        function textColorOf(key, p) { const c = key.split('|')[0]; return c === 'default' ? p.colText : c; }
        function textHeightOf(key) { const h = parseFloat(key.split('|')[1]); return isFinite(h) ? h : RUN_DEFAULT.ht; }
        // 키링 구멍을 뚫는 원기둥 높이: 바닥판 + (테두리·가장 높은 글자 중 높은 것) + 여유
        function holeCutHeight(p, shapes) {
            const tallest = shapes.textPieces.reduce(function (m, tp) { return Math.max(m, textHeightOf(tp.key)); }, p.borderThick);
            return p.baseThick + tallest + 2;
        }

        function buildShapes(p, curveSegments) {
            const scratch = [];
            function track(m) { scratch.push(m); return m; }

            // 글자: 색마다 한 단면(colorParts), 전체 글자 = masterXS
            let masterXS = null;
            const colorParts = [];
            const groups = buildTextContours(p, curveSegments);
            if (groups) {
                // 글자 윤곽선 점 줄이기 — 둥근 글씨체로 긴 글을 쓰면 점이 9만 개가 넘어 부풀리기·합치기가
                // 몇 분 걸렸다(갤러리5 SIMPLIFY_EPS 주석 참고).
                const toXS = function (contours) { return track(track(ManifoldCore.contoursToXS(contours)).simplify(SIMPLIFY_EPS)); };
                Object.keys(groups).sort().forEach(function (partKey) {
                    const pieces = [];
                    Object.keys(groups[partKey]).forEach(function (growKey) {
                        // 굵게·굵기: 글씨체 파일에 굵은 글꼴이 없으므로 윤곽선을 부풀린다(음수면 줄인다).
                        const d = parseFloat(growKey);
                        let xs = toXS(groups[partKey][growKey]);
                        if (Math.abs(d) > 1e-6) {
                            const segs = Math.min(64, Math.max(8, Math.ceil(2 * Math.PI * Math.abs(d) / 0.05)));
                            xs = track(xs.offset(d, 'Round', 2, segs));
                        }
                        pieces.push(xs);
                    });
                    let xs = pieces[0];
                    for (let i = 1; i < pieces.length; i++) xs = track(xs.add(pieces[i]));
                    // 꼭짓점 하나로만 맞닿은 곳(픽셀 글씨체)을 잇는다(KISS_JOIN_MM). 다른 층은 이 글자에서
                    // 만들어지므로 여기서 한 번만 한다(층마다 따로 하면 서로 미세하게 어긋남, 갤러리5 주석 참고).
                    xs = track(xs.offset(KISS_JOIN_MM, 'Miter', 2));
                    if (!xs.isEmpty()) colorParts.push({ key: partKey, xs: xs });
                });
                colorParts.forEach(function (cp) { masterXS = masterXS ? track(masterXS.add(cp.xs)) : cp.xs; });
            }
            // 글자 층은 색마다 한 조각. 색이 다른 글자가 겹치면(굵게·좁은 자간) 조각도 겹친 채로 둔다 —
            // 한쪽에서 다른 쪽을 빼서 딱 맞닿게 나누면, 맞닿은 벽이 파일(float32)에서 한 점으로 합쳐져
            // STL에 짝 안 맞는 모서리가 생겼다(2026-11-24, Mulmaru·Ssurround). 겹친 곳의 색은 합칠 때 한쪽으로 정해진다.
            const textPieces = colorParts;

            let masterWithRing = masterXS;
            let ringXS = null;
            if (p.keyringOn) {
                ringXS = track(ManifoldCore.circleXS(p.keyringHoleSize / 2 + p.keyringRim, 48));
                ringXS = track(ringXS.translate([p.keyringX, p.keyringY]));
                masterWithRing = masterXS ? track(masterXS.add(ringXS)) : ringXS;
            }
            if (!masterWithRing) return null;

            // 둥근 모서리 조각 수 — 갤러리5와 같음(조각 길이 기준: 미리보기 0.3mm, 내보내기 0.1mm).
            const arcEdgeMm = curveSegments >= EXPORT_CURVE_SEGMENTS ? 0.1 : 0.3;
            function grow(xs, delta) {
                const segs = Math.min(256, Math.max(8, Math.ceil(2 * Math.PI * Math.abs(delta) / arcEdgeMm)));
                return track(xs.offset(delta, 'Round', 2, segs));
            }

            // 바닥판·테두리는 바깥 실루엣 한 바퀴만 따라간다(갤러리5 2026-11-23 고침과 같음):
            // 안쪽 구멍 윤곽선(넓이 −)은 버려 메운다.
            function signedArea(poly) {
                let s = 0;
                for (let i = 0; i < poly.length; i++) {
                    const a = poly[i], b = poly[(i + 1) % poly.length];
                    s += a[0] * b[1] - b[0] * a[1];
                }
                return s / 2;
            }
            function fillHoles(xs) {
                if (!xs || xs.isEmpty()) return xs;
                const outers = xs.toPolygons().filter(function (poly) { return signedArea(poly) > 0; });
                if (!outers.length) return xs;
                return track(ManifoldCore.contoursToXS(outers));
            }

            // 테두리 = 글자에서 (외곽선+간격+테두리)만큼 부풀려 메운 것 − (외곽선+간격)만큼 부풀려 메운 것
            // (갤러리5와 같은 B 방식, 이유와 알려진 성질은 갤러리5 주석 참고). 바닥판도 글자에서 한 번에.
            let borderOuterXS, borderInnerXS, baseXS;
            if (p.frameShape === 'rect' && masterXS) {
                // 사각형(2026-11-24 선생님): 글자 전체를 감싸는 네모에서 (간격 → 두께 → 바깥 여백)만큼 넓힌 둥근 사각형.
                // 모서리 둥글기 R = 테두리 바깥 모서리의 반지름. 테두리 안쪽은 R − 두께(0 아래면 뾰족),
                // 바닥판은 R + 바깥 여백이라 테두리와 나란히 둥글다. 키링 고리는 글자 따라일 때처럼 붙인다.
                const bb = masterXS.bounds();
                const m = p.innerMargin, b = p.borderW, o = p.outerMargin, R = Math.max(0, p.cornerR);
                const roundedRect = function (pad, radius) {
                    const x0 = bb.min[0] - pad, y0 = bb.min[1] - pad, x1 = bb.max[0] + pad, y1 = bb.max[1] + pad;
                    const r = Math.max(0, Math.min(radius, (x1 - x0) / 2 - 0.001, (y1 - y0) / 2 - 0.001));
                    if (r < 0.001) return track(ManifoldCore.contoursToXS([[[x0, y0], [x1, y0], [x1, y1], [x0, y1]]]));
                    const segs = Math.max(2, Math.ceil((Math.PI / 2) * r / arcEdgeMm));
                    const pts = [];
                    [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]].forEach(function (c) {
                        for (let i = 0; i <= segs; i++) {
                            const a = c[2] + (Math.PI / 2) * i / segs;
                            pts.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]);
                        }
                    });
                    return track(ManifoldCore.contoursToXS([pts]));
                };
                borderOuterXS = roundedRect(m + b, R);
                // 간격 0이면 테두리 안쪽 선이 글자 끝점에 딱 맞닿아 STL에 짝 안 맞는 모서리가 생겼다(글씨체 12종 모두) →
                // 그때만 0.02mm 겹쳐서 글자와 한 덩어리로 붙게 한다.
                const innerPad = m > 0 ? m : -0.02;
                borderInnerXS = b > 0 ? roundedRect(innerPad, Math.max(0, R - b)) : borderOuterXS;
                baseXS = roundedRect(m + b + o, R + o);
                if (ringXS) {
                    borderOuterXS = track(borderOuterXS.add(grow(ringXS, m + b)));
                    borderInnerXS = b > 0 ? track(borderInnerXS.add(grow(ringXS, innerPad))) : borderOuterXS;
                    baseXS = track(baseXS.add(grow(ringXS, m + b + o)));
                }
            } else {
                borderOuterXS = fillHoles(grow(masterWithRing, p.innerMargin + p.borderW));
                borderInnerXS = p.borderW > 0 ? fillHoles(grow(masterWithRing, p.innerMargin)) : borderOuterXS;
                baseXS = fillHoles(grow(masterWithRing, p.innerMargin + p.borderW + p.outerMargin));
            }
            const borderRingXS = track(borderOuterXS.subtract(borderInnerXS));

            let holeXS = null;
            if (p.keyringOn) {
                holeXS = track(ManifoldCore.circleXS(p.keyringHoleSize / 2, 48));
                holeXS = track(holeXS.translate([p.keyringX, p.keyringY]));
            }

            // 층마다 0.0001mm보다 짧은 변을 없앤다(갤러리5 tidy 주석 참고). 부풀리기·합치기에서 거의 같은
            // 자리의 점 두 개(0.0000004mm 차이)가 생기면, 파일(float32)에 쓸 때 한 점으로 합쳐져 STL에
            // 폭 0인 벽과 여러 면이 함께 쓰는 모서리가 생겼다(2026-11-23 기본 예시 테두리 층).
            let magnetPoints = [];
            if (p.magnetOn) {
                const avoid = p.keyringOn ? [{ x: p.keyringX, y: p.keyringY, r: p.keyringHoleSize / 2 }] : [];
                magnetPoints = MagnetCore.placePoints(baseXS, avoid, p.magnetCount, MagnetCore.spec('open', 0).r);
            }

            const tidy = function (xs) { return xs && !xs.isEmpty() ? track(xs.simplify(TIDY_EPS)) : xs; };
            const out = {
                textPieces: textPieces.map(function (tp) { return { key: tp.key, xs: tidy(tp.xs) }; }),
                baseXS: tidy(baseXS), borderRingXS: tidy(borderRingXS), holeXS: holeXS, magnetPoints: magnetPoints
            };
            const keep = new Set([out.baseXS, out.borderRingXS, out.holeXS].concat(out.textPieces.map(function (tp) { return tp.xs; })).filter(Boolean));
            scratch.forEach(function (m) { if (m && !keep.has(m) && typeof m.delete === 'function') m.delete(); });
            return out;
        }

        function disposeShapes(shapes) {
            if (!shapes) return;
            const all = [shapes.baseXS, shapes.borderRingXS, shapes.holeXS].concat(shapes.textPieces.map(function (tp) { return tp.xs; }));
            new Set(all).forEach(function (xs) { if (xs && typeof xs.delete === 'function') xs.delete(); });
        }

        let shapeCache = null;
        function getPreviewShapes(p, shapeFp) {
            if (shapeCache && shapeCache.fingerprint === shapeFp) return shapeCache.shapes;
            if (shapeCache) disposeShapes(shapeCache.shapes);
            shapeCache = null;
            let shapes;
            try {
                shapes = buildShapes(p, PREVIEW_CURVE_SEGMENTS);
            } catch (err) {
                console.error('도형 생성 실패:', err);
                return null;
            }
            if (shapes) shapeCache = { fingerprint: shapeFp, shapes: shapes };
            return shapes;
        }

        // 자석 홈 입체: 바닥판 두께로 홈 깊이·높이를 정하고(MagnetCore.spec), 얇으면 만들지 않고 알린다.
        function magnetCut(p, shapes, track) {
            const noteEl = document.getElementById('magnetNote');
            if (!p.magnetOn) { noteEl.textContent = ''; return null; }
            const sp = MagnetCore.spec(p.magnetMode, p.baseThick);
            const pts = shapes.magnetPoints || [];
            noteEl.textContent = MagnetCore.note(p.magnetMode, sp, pts.length, p.magnetCount, LangCore.pick);
            if (!sp.ok || !pts.length) return null;
            return MagnetCore.pocketSolid(pts, sp, track);
        }

        function buildPreviewMeshes(p, shapeFp) {
            const shapes = getPreviewShapes(p, shapeFp);
            if (!shapes) return null;
            const layerDefs = [
                { name: 'base', xs: shapes.baseXS, height: p.baseThick, color: p.colBase, skipY: true },
                { name: 'border', xs: shapes.borderRingXS, height: p.borderThick, color: p.colBorder }
            ].concat(shapes.textPieces.map(function (tp, i) {
                // 색 조각이 겹친 곳에서 윗면이 같은 높이로 깜빡이지 않게 미리보기에서만 조금씩(0.002mm) 높인다
                return { name: 'text:' + tp.key, xs: tp.xs, height: textHeightOf(tp.key) + i * 0.002, color: textColorOf(tp.key, p) };
            }));
            const owned = [];
            function own(m) { owned.push(m); return m; }
            let holeCylPositioned = null;
            if (shapes.holeXS) {
                const holeCyl = own(ManifoldCore.extrudeXS(shapes.holeXS, holeCutHeight(p, shapes)));
                holeCylPositioned = own(ManifoldCore.translateY(holeCyl, -1));
            }
            const magnet = magnetCut(p, shapes, own);
            const meshes = [];
            layerDefs.forEach(function (def) {
                if (!def.xs || def.xs.isEmpty()) return;
                let solid = own(ManifoldCore.extrudeXS(def.xs, def.height));
                if (!def.skipY) solid = own(ManifoldCore.translateY(solid, p.baseThick));
                const idToColor = new Map([[solid.originalID(), def.color]]);
                let finalSolid = solid;
                let cutResult = null;
                let cut = holeCylPositioned;
                if (holeCylPositioned) idToColor.set(holeCylPositioned.originalID(), def.color);
                if (def.name === 'base' && magnet) {
                    magnet.ids.forEach(function (id) { idToColor.set(id, def.color); });
                    cut = cut ? own(ManifoldCore.union(cut, magnet.solid)) : magnet.solid;
                }
                if (cut) {
                    cutResult = ManifoldCore.subtract(solid, cut);
                    finalSolid = cutResult;
                }
                const mesh = ManifoldCore.toThreeMesh(finalSolid, idToColor, def.color);
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                mesh.userData.layerName = def.name;
                meshes.push(mesh);
                if (cutResult) cutResult.delete();
            });
            // 숨긴 홈은 판 속이라 안 보이므로 미리보기에만 자리를 색으로 표시(받는 파일에는 안 들어감)
            if (magnet && p.magnetMode === 'hidden') {
                MagnetCore.previewMarkers(shapes.magnetPoints, MagnetCore.spec(p.magnetMode, p.baseThick)).forEach(function (m) { meshes.push(m); });
            }
            owned.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); });
            return meshes.length ? meshes : null;
        }

        function buildFusedSolid(p, track) {
            const shapes = buildShapes(p, EXPORT_CURVE_SEGMENTS);
            if (!shapes) return null;
            const idToColor = new Map();
            const parts = [];
            function extrudeAndStack(xs, height, color) {
                // 빈 단면을 압출하면 Manifold가 InvalidConstruction을 내서 union 전체가 비므로 건너뛴다.
                if (!xs || xs.isEmpty()) return;
                const solid = track(ManifoldCore.extrudeXS(xs, height));
                idToColor.set(solid.originalID(), color);
                parts.push(track(ManifoldCore.translateY(solid, p.baseThick)));
            }
            if (shapes.baseXS && !shapes.baseXS.isEmpty()) {
                const baseSolid = track(ManifoldCore.extrudeXS(shapes.baseXS, p.baseThick));
                idToColor.set(baseSolid.originalID(), p.colBase);
                parts.push(baseSolid);
            }
            extrudeAndStack(shapes.borderRingXS, p.borderThick, p.colBorder);
            // 글자는 색마다 따로 쌓는다 → 3MF에서 색이 나뉜다
            // 글자는 (색, 높이)마다 따로 쌓는다 → 3MF에서 색이 나뉘고, 글씨마다 높이가 다르다
            shapes.textPieces.forEach(function (tp) { extrudeAndStack(tp.xs, textHeightOf(tp.key), textColorOf(tp.key, p)); });

            let holeCylPositioned = null;
            if (shapes.holeXS) {
                const holeCyl = track(ManifoldCore.extrudeXS(shapes.holeXS, holeCutHeight(p, shapes)));
                idToColor.set(holeCyl.originalID(), p.colBase);
                holeCylPositioned = track(ManifoldCore.translateY(holeCyl, -1));
            }
            const magnet = magnetCut(p, shapes, track);
            if (magnet) magnet.ids.forEach(function (id) { idToColor.set(id, p.colBase); });
            disposeShapes(shapes);
            if (!parts.length) return null;
            let fused = parts[0];
            for (let i = 1; i < parts.length; i++) fused = track(ManifoldCore.union(fused, parts[i]));
            if (holeCylPositioned) fused = track(ManifoldCore.subtract(fused, holeCylPositioned));
            if (magnet) fused = track(ManifoldCore.subtract(fused, magnet.solid));
            return { fused: fused, idToColor: idToColor };
        }

        function disposeCurrentThreeMesh() {
            ParametricCore.updateDimensionOverlay(scene, null);
            if (!currentGroup) return;
            scene.remove(currentGroup);
            currentGroup.traverse(function (obj) {
                if (obj.geometry) obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
                else if (obj.material) obj.material.dispose();
            });
            currentGroup = null;
            currentMeshes = {};
        }

        function num(id) { return parseFloat(document.getElementById(id).value); }

        function readParams() {
            return {
                lines: readModel(), align: currentAlign, fontFile: currentFontFile,
                frameShape: currentFrameShape, cornerR: num('cornerR'),
                borderW: num('borderW'), innerMargin: num('innerMargin'), outerMargin: num('outerMargin'),
                keyringOn: document.getElementById('keyringOn').checked,
                magnetOn: document.getElementById('magnetOn').checked, magnetMode: currentMagnetMode, magnetCount: currentMagnetCount,
                keyringX: num('keyringX'), keyringY: num('keyringY'), keyringHoleSize: num('keyringHoleSize'), keyringRim: num('keyringRim'),
                baseThick: num('baseThick'), borderThick: num('borderThick'),
                colBase: document.getElementById('colBase').value,
                colBorder: document.getElementById('colBorder').value,
                colText: document.getElementById('colText').value
            };
        }

        // 글자마다 고른 색은 lines 안에 있어 도형을 다시 만든다(색이 같은 글자끼리 묶이므로).
        // '5. 색상'의 색들은 도형을 바꾸지 않아 칠만 다시 한다(applyColorsOnly).
        function shapeFingerprint(p) {
            return JSON.stringify({
                lines: p.lines, align: p.align, fontFile: p.fontFile,
                frameShape: p.frameShape, cornerR: p.cornerR,
                borderW: p.borderW, innerMargin: p.innerMargin, outerMargin: p.outerMargin,
                keyringOn: p.keyringOn, keyringX: p.keyringX, keyringY: p.keyringY, keyringHoleSize: p.keyringHoleSize, keyringRim: p.keyringRim,
                magnetOn: p.magnetOn, magnetMode: p.magnetMode, magnetCount: p.magnetCount
            });
        }
        function geometryFingerprint(p) {
            return shapeFingerprint(p) + '|' + JSON.stringify({
                baseThick: p.baseThick, borderThick: p.borderThick
            });
        }

        const LAYER_COLOR_KEYS = { base: 'colBase', border: 'colBorder' };
        function applyColorsOnly(params) {
            Object.keys(currentMeshes).forEach(function (name) {
                const mesh = currentMeshes[name];
                const color = name.indexOf('text:') === 0 ? textColorOf(name.slice(5), params) : params[LAYER_COLOR_KEYS[name]];
                if (!mesh || !color) return;
                const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                mats.forEach(function (m) { m.color.set(color); });
            });
        }

        // 준비 확인: 쓰이는 글씨체가 덜 불러와졌으면 불러오기를 시작하고(끝나면 다시 그림) false.
        function isReady(params) {
            if (!manifoldReady || !emojiFont || !emojiCssReady) return false;
            const missing = neededFonts(params).filter(function (f) { return !isFontReady(f); });
            if (!missing.length) return true;
            if (missing.some(function (f) { return !FontPicker.isFailed(f); })) {
                Promise.all(missing.map(ensureFont)).then(scheduleUpdate);
            }
            return false;
        }

        function updateModel() {
            const params = readParams();
            if (!isReady(params)) return;
            [
                ['valBorderW', params.borderW], ['valCornerR', params.cornerR],
                ['valInnerMargin', params.innerMargin], ['valOuterMargin', params.outerMargin],
                ['valKeyringX', params.keyringX], ['valKeyringY', params.keyringY],
                ['valKeyringHoleSize', params.keyringHoleSize], ['valKeyringRim', params.keyringRim],
                ['valBaseThick', params.baseThick], ['valBorderThick', params.borderThick]
            ].forEach(function (pair) { document.getElementById(pair[0]).innerText = pair[1]; });

            const fingerprint = geometryFingerprint(params);
            if (currentGroup && fingerprint === lastGeometryFingerprint) {
                applyColorsOnly(params);
                return;
            }
            const meshes = buildPreviewMeshes(params, shapeFingerprint(params));
            disposeCurrentThreeMesh();
            if (!meshes) { lastGeometryFingerprint = null; return; }
            currentGroup = new THREE.Group();
            currentMeshes = {};
            meshes.forEach(function (mesh) {
                currentGroup.add(mesh);
                currentMeshes[mesh.userData.layerName] = mesh;
            });
            scene.add(currentGroup);
            ParametricCore.updateDimensionOverlay(scene, currentGroup);
            lastGeometryFingerprint = fingerprint;
        }

        function fileBaseName(params) {
            const first = (modelText(params.lines).split('\n').find(function (l) { return l.trim(); }) || '').trim();
            return (first || LangCore.pick('표지판', 'signplate')).replace(/[\\/:*?"<>|]/g, '').slice(0, 20);
        }

        function exportWith(kind) {
            const params = readParams();
            if (!isReady(params)) return;
            const scratch = [];
            function track(m) { scratch.push(m); return m; }
            function cleanup() { scratch.forEach(function (m) { if (m && typeof m.delete === 'function') m.delete(); }); }
            let result;
            try {
                result = buildFusedSolid(params, track);
            } catch (err) {
                console.error(kind + ' 생성 실패:', err);
                cleanup();
                return;
            }
            if (!result) { cleanup(); return; }
            const mesh = ManifoldCore.toThreeMesh(result.fused, result.idToColor);
            cleanup();
            const exportGroup = new THREE.Group();
            exportGroup.add(mesh);
            const name = fileBaseName(params);
            if (kind === 'STL') ParametricCore.exportSTL(exportGroup, LangCore.pick(`${name}_표지판.stl`, `${name}_signplate.stl`));
            else ThreeMFCore.export3MF(exportGroup, LangCore.pick(`${name}_표지판.3mf`, `${name}_signplate.3mf`));
            mesh.geometry.dispose();
            (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(function (m) { m.dispose(); });
        }
        function downloadSTL() { exportWith('STL'); }
        function download3MF() { exportWith('3MF'); }

        window.scheduleUpdate = scheduleUpdate;
        window.onFontChange = onFontChange;
        window.onLayoutStyleChange = onLayoutStyleChange;
        window.onTextColorChange = onTextColorChange;
        window.onKeyringToggle = onKeyringToggle;
        window.onMagnetToggle = onMagnetToggle;
        window.download3MF = download3MF;
        window.downloadSTL = downloadSTL;
        window.__getPreviewGroup = function () { return currentGroup; };
        // 시험용: 측정한 글자 위치를 바깥에서 볼 수 있게(화면과 입체가 맞는지 확인할 때만 씀).
        window.__measureLayout = function () { return measureLayout(readParams()); };
        // 시험용: 도구 막대가 바꿀 고른 범위(글자 수 위치)
        window.__lastSel = function () { return lastSel; };

        async function main() {
            textBox.style.fontFamily = cssFamily(currentFontFile);
            // 체크 칸의 처음 상태도 DEFAULTS를 따른다(HTML에는 checked가 없음)
            document.getElementById('magnetOn').checked = DEFAULTS.magnetOn;
            document.getElementById('keyringOn').checked = DEFAULTS.keyringOn;
            syncMagnetUI();
            syncKeyringDetails();
            renderModel(cloneModel(DEFAULTS.model));
            resetHistory();
            refreshFontSelects();
            FontPicker.restoreSavedFolder();
            updateFmtRow();
            applyBoxStyle();
            await ManifoldCore.ready;
            manifoldReady = true;
            FontCore.loadFont(EMOJI_FONT_FILE, function (font) {
                emojiFont = font;
                updateModel();
            });
            onFontChange();
        }
        main();
    </script>
