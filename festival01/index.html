<!DOCTYPE html>
<html lang="ko" class="festival">
<head>
    <meta charset="UTF-8">
    <!-- 예전 GitHub Pages 주소로 들어온 방문자를 easy3d.web.app으로 보낸다(design.html과 같은 이유). -->
    <script>(function(){if(location.hostname==='maker-ssam.github.io'){location.replace('https://easy3d.web.app'+location.pathname.replace(/^\/easy3d/,'')+location.search+location.hash);}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>만나자, 교크협! - 3D프린터팀</title>
    <!-- 행사장 모바일 페이지와 같은 글씨체 + 행사 전용 색(festival.css의 --mj-* 변수) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../assets/css/festival.css">
    <style>
        /* 행사 첫 화면(설명) — 디자인 페이지(design.html)로 넘어가기 전에 무엇을 하는지 짧게 알려 준다.
           색·카드·버튼 모양은 festival.css의 행사 디자인을 그대로 따른다. */
        html.festival, html.festival body { margin: 0; min-height: 100%; }
        .intro {
            max-width: 480px; margin: 0 auto; box-sizing: border-box;
            min-height: 100vh; min-height: 100dvh;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
            display: flex; flex-direction: column;
        }
        .intro-head { padding: 4px 0 20px; }
        .intro h1 {
            margin: 8px 0 12px;
            font-size: 2.3rem; font-weight: 900; line-height: 1.05; letter-spacing: -0.055em;
        }
        .intro .fest-lead { margin-bottom: 20px; }
        .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
        .steps li {
            counter-increment: step;
            display: flex; gap: 14px; align-items: flex-start;
            padding: 12px 0;
            font-size: 1rem; font-weight: 600; line-height: 1.5; color: var(--mj-sub);
            word-break: keep-all;
        }
        .steps li + li { border-top: 1px dashed var(--mj-ring); }
        .steps li::before {
            content: counter(step);
            display: grid; place-items: center; flex-shrink: 0;
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--mj-butter); color: var(--mj-ink);
            font-weight: 900; box-shadow: 0 0 0 1px var(--mj-ring);
        }
        .steps b { display: block; color: var(--mj-ink); font-weight: 800; }
        .intro-go { margin-top: auto; padding-top: 8px; }
        .intro-go a {
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
            width: 100%; min-height: 60px; padding: 0 24px; border-radius: 999px;
            background: var(--mj-coral-strong); color: #fff; text-decoration: none;
            font-size: 1.25rem; font-weight: 900; letter-spacing: -0.025em;
            box-shadow: 0 18px 36px -16px rgba(217, 79, 69, 0.9);
        }
        .intro-go a::after { content: "→"; margin-left: 0.3em; }
        .intro-go a:hover { background: #C8433A; }
        .intro-go a:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <main class="intro">
        <div class="intro-head">
            <div class="fest-brand"><span class="fest-brand-mark">★</span>3D프린팅 분과</div>
            <h1>만나자, 교크협<span class="fest-bang">!</span></h1>
            <p class="fest-lead">
                교크협 정기네트워크의 3D프린팅 분과입니다. 사전에 미리 디자인을 제작하여 보내주시는 분들은 '멀티컬러' 프린팅 키캡을 출력 해 드립니다.(색상은 랜덤입니다.)
            </p>
        </div>

        <section class="fest-card">
            <span class="fest-card-title">이렇게 만들어요</span>
            <ol class="steps">
                <li><span><b>글씨 넣기</b>키캡에 새길 글씨를 두 칸(2×1)에 한 글자씩 적어요.</span></li>
                <li><span><b>모양 고르기</b>글씨체·글씨 크기·굵기를 골라요. 3D 화면을 손가락으로 돌려 볼 수 있어요.</span></li>
                <li><span><b>보내기</b>‘디자인 완성하고 보내기’를 누르고 이름과 소속을 적어 보내요.</span></li>
            </ol>
        </section>

        <div class="intro-go">
            <a href="design.html">키캡 디자인하러 가기</a>
        </div>
    </main>
<!-- 방문 집계(Cloudflare Web Analytics, 쿠키·개인 추적 없음) — 실제 사이트(easy3d.web.app)에서만 -->
<script>if(location.hostname==='easy3d.web.app'){var s=document.createElement('script');s.defer=true;s.src='https://static.cloudflareinsights.com/beacon.min.js';s.setAttribute('data-cf-beacon','{"token": "f1763eddb5244b76a2859b8f83f56b5c"}');document.body.appendChild(s);}</script>
</body>
</html>
